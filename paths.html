        .path-detail-sub { color: rgba(255,255,255,0.78); font-size: 13.5px; margin-top: 4px; }

        .path-detail-pill-label { font-size: 11.5px; color: rgba(255,255,255,0.7); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
        .path-detail-pill-value { font-size: 22px; font-weight: 800; color: white; letter-spacing: -0.015em; }

        .path-chapter-kicker { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.8); margin-bottom: 4px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }

        .path-detail-body { background: var(--paper); padding: 32px; border-top: 1px solid var(--line); }

<script>
function pathIcon(path) {
    return path.slug === 'starter' ? 'ph-rocket-launch' : path.icon;
}

function getPathUser() {
    try {
        return typeof Auth !== 'undefined' ? Auth.getCurrentUser() : null;
    } catch {
        return null;
    }
}

function isPathAuthReady() {
    try {
        return typeof _authReady !== 'undefined' && _authReady;
    } catch {
        return false;
    }
}

function promptPathLogin() {
    if (typeof showToast === 'function') showToast('请先登录后开始学习路径');
    if (typeof showAuthModal === 'function') setTimeout(() => showAuthModal('login'), 80);
}

function requirePathLogin(onReady) {
    if (getPathUser()) return true;
    if (typeof onAuthReady === 'function' && !isPathAuthReady()) {
        if (typeof showToast === 'function') showToast('正在确认登录状态...');
        onAuthReady(user => {
            if (user) onReady?.();
            else promptPathLogin();
        });
        return false;
    }
    promptPathLogin();
    return false;
}

const PATH_PROGRESS_PREFIX = 'xylaoshi:path-progress:';
let loadedPaths = [];

function pathUserStorageKey() {
    const user = getPathUser();
    const identity = user && (user.uid || user.email);
    return identity ? `${PATH_PROGRESS_PREFIX}${encodeURIComponent(identity)}` : '';
}

function readPathProgress() {
    const key = pathUserStorageKey();
    if (!key) return {};
    try {
        const value = JSON.parse(localStorage.getItem(key) || '{}');
        return value && typeof value === 'object' ? value : {};
    } catch {
        return {};
    }
}

function writePathProgress(progress) {
    const key = pathUserStorageKey();
    if (!key) return;
    try { localStorage.setItem(key, JSON.stringify(progress)); } catch (_) {}
}

function setPathStepOpen(row, open) {
    const detail = row?.nextElementSibling;
    if (!detail) return;
    detail.classList.toggle('open', open);
    row.classList.toggle('expanded', open);
    row.setAttribute('aria-expanded', String(open));
}

function pathPracticeAction(step) {
    const name = String(step?.name || '');
    if (/提示词|提问/.test(name)) return { href:'/prompts', label:'打开提示词库实践' };
    if (/备课|教案|教学设计/.test(name)) return { href:'/agents#lesson-design', label:'用教学设计助手实践' };
    if (/课件|演示|视频|图像|音频|创作/.test(name)) return { href:'/multimodal', label:'打开多模态工作坊' };
    if (/出题|练习|测验/.test(name)) return { href:'/agents#quiz-gen', label:'用练习生成器实践' };
    if (/批改|评价|反馈/.test(name)) return { href:'/agents#homework-grader', label:'用批改助手实践' };
    if (/家校|沟通/.test(name)) return { href:'/agents#parent-comm', label:'用家校沟通助手实践' };
    if (/课堂|活动|分组/.test(name)) return { href:'/classroom-tools', label:'打开课堂工具实践' };
    if (/智能体|助手|工作流/.test(name)) return { href:'/agents', label:'浏览智能体实践' };
    return { href:'/articles', label:'阅读配套实践文章' };
}

function syncPathProgressUI() {
    if (!loadedPaths.length) return;
    const progress = readPathProgress();
    const hasUser = Boolean(pathUserStorageKey());
    let continueTarget = null;

    loadedPaths.forEach((path, pathIndex) => {
        const pathSlug = /^[a-z0-9_-]{1,64}$/i.test(path.slug || '') ? path.slug : `path-${pathIndex + 1}`;
        const completed = new Set(Array.isArray(progress[pathSlug]) ? progress[pathSlug] : []);
        const total = (path.steps || []).length;
        const done = [...completed].filter(index => Number.isInteger(index) && index >= 0 && index < total).length;
        const percentage = total ? Math.round(done / total * 100) : 0;

        document.querySelectorAll(`[data-path-progress="${pathSlug}"]`).forEach(node => {
            node.querySelector('.path-progress-fill')?.style.setProperty('width', `${percentage}%`);
            const label = node.querySelector('[data-path-progress-label]');
            if (label) label.textContent = hasUser ? `${done}/${total} 完成` : '登录后记录';
        });

        document.querySelectorAll(`.step-row[data-path="${pathSlug}"]`).forEach(row => {
            const stepIndex = Number(row.dataset.step);
            const isComplete = completed.has(stepIndex);
            row.classList.toggle('completed', isComplete);
            const button = row.nextElementSibling?.querySelector('.step-complete-btn');
            if (button) {
                button.setAttribute('aria-pressed', String(isComplete));
                button.innerHTML = isComplete
                    ? '<i class="ph ph-check-circle"></i> 已完成，点击撤销'
                    : '<i class="ph ph-circle"></i> 标记为已完成';
            }
        });

        if (!continueTarget && hasUser && done > 0 && done < total) {
            const nextIndex = (path.steps || []).findIndex((_, index) => !completed.has(index));
            if (nextIndex >= 0) continueTarget = { path, pathSlug, nextIndex, done, total };
        }
    });

    const link = document.getElementById('path-continue');
    if (!link) return;
    link.classList.toggle('active', Boolean(continueTarget));
    if (!continueTarget) return;
    link.href = `#path-step-${continueTarget.pathSlug}-${continueTarget.nextIndex}`;
    document.getElementById('path-continue-title').textContent = `继续「${continueTarget.path.title}」`;
    document.getElementById('path-continue-meta').textContent = `已完成 ${continueTarget.done}/${continueTarget.total} 步 · 下一步：${continueTarget.path.steps[continueTarget.nextIndex].name}`;
}

function togglePathStepCompletion(button, pathSlug, stepIndex) {
    if (!requirePathLogin(() => togglePathStepCompletion(button, pathSlug, stepIndex))) return;
    const progress = readPathProgress();
    const completed = new Set(Array.isArray(progress[pathSlug]) ? progress[pathSlug] : []);
    const willComplete = !completed.has(stepIndex);
    if (willComplete) completed.add(stepIndex);
    else completed.delete(stepIndex);
    progress[pathSlug] = [...completed].sort((a, b) => a - b);
    progress.updatedAt = Date.now();
    writePathProgress(progress);
    syncPathProgressUI();
    if (typeof showToast === 'function') showToast(willComplete ? '已记录学习进度' : '已撤销完成标记');

    if (willComplete) {
        const next = document.querySelector(`.step-row[data-path="${pathSlug}"][data-step="${stepIndex + 1}"]`);
        if (next) {
            next.closest('section').querySelectorAll('.step-row').forEach(row => setPathStepOpen(row, row === next));
            setTimeout(() => next.scrollIntoView({ behavior:'smooth', block:'center' }), 80);
        }
    }
}

function toggleStep(row) {
    if (!requirePathLogin(() => toggleStep(row))) return;
    const detail = row.nextElementSibling;
    const isOpen = detail.classList.contains('open');
    row.closest('section').querySelectorAll('.step-row').forEach(r => setPathStepOpen(r, !isOpen && r === row));
}

function startPath(btn) {
    if (!requirePathLogin(() => startPath(btn))) return;
    const section = btn.closest('section');
    section.querySelectorAll('.step-row').forEach(r => setPathStepOpen(r, true));
    btn.innerHTML = '<i class="ph ph-check-circle"></i> 已展开全部步骤，点击各步骤可折叠';
    btn.style.opacity = '0.85';
    btn.onclick = null;
    const firstStep = section.querySelector('.step-row');
    if (firstStep) setTimeout(() => firstStep.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
}

renderNav('paths');
renderFooter();
onAuthReady((user) => { renderNav('paths'); renderFooter(); syncPathProgressUI(); });

(async () => {
    const paths = await DB.getPaths();
    loadedPaths = paths;

    // Force the editorial palette, ignoring any legacy gradient that
    // may still live in Firestore.
    const PATH_PALETTE = {
        starter: 'linear-gradient(135deg,#2d4a3a 0%,#1a3528 100%)',
        teacher: 'linear-gradient(135deg,#4a3625 0%,#2c1f15 100%)',
        creator: 'linear-gradient(135deg,#7a2e28 0%,#4d1812 100%)'
    };
    const PATH_FALLBACK = ['linear-gradient(135deg,#2d4a3a 0%,#1a3528 100%)','linear-gradient(135deg,#4a3625 0%,#2c1f15 100%)','linear-gradient(135deg,#7a2e28 0%,#4d1812 100%)'];
    const grad = (p, i) => PATH_PALETTE[p.slug] || PATH_FALLBACK[i % PATH_FALLBACK.length];
    const slug = (p, i) => /^[a-z0-9_-]{1,64}$/i.test(p.slug || '') ? p.slug : `path-${i + 1}`;

    // Nav cards
    document.getElementById('path-nav-cards').innerHTML = paths.map((p, i) => `
    <a href="#${slug(p, i)}" style="text-decoration:none">
        <div class="path-nav-card" style="background:${grad(p, i)}" data-path-card="${slug(p, i)}">
            <div class="path-nav-number">No. ${String(i+1).padStart(2,'0')}</div>
            <i class="path-nav-icon ph-bold ${SafeRender.classNames(pathIcon(p), 'ph-path')}" aria-hidden="true"></i>
            <div class="path-nav-title">${SafeRender.escape(p.title)}</div>
            <div class="path-nav-duration">${SafeRender.escape(p.duration)}</div>
            <div class="path-nav-level">${SafeRender.escape(p.level)}</div>
            <div class="path-nav-progress" data-path-progress="${slug(p, i)}">
                <span class="path-progress-track"><span class="path-progress-fill"></span></span>
                <span data-path-progress-label>登录后记录</span>
            </div>
        </div>
    </a>`).join('');

    // Detailed sections
    document.getElementById('paths-detail').innerHTML = paths.map((p, i) => `
    <section id="${slug(p, i)}" style="scroll-margin-top:80px">
        <div class="path-detail">
            <div class="path-detail-head" style="background:${grad(p, i)}">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px">
                    <div>
                        <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
                            <i class="path-detail-icon ph-bold ${SafeRender.classNames(pathIcon(p), 'ph-path')}" aria-hidden="true"></i>
                            <div>
                                <div class="path-chapter-kicker">Chapter ${String(i+1).padStart(2,'0')}</div>
                                <h2 class="path-detail-title">${SafeRender.escape(p.title)}</h2>
                                <div class="path-detail-sub">${SafeRender.escape(p.subtitle)}</div>
                            </div>
                        </div>
                        <p class="path-detail-desc">${SafeRender.escape(p.desc)}</p>
                    </div>
                    <div class="path-detail-pill">
                        <div class="path-detail-pill-label">预计时长</div>
                        <div class="path-detail-pill-value">${SafeRender.escape(p.duration)}</div>
                        <div class="path-detail-pill-level">${SafeRender.escape(p.level)}水平</div>
                    </div>
                </div>
                <div style="margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.18)">
                    <div class="path-resources-label">推荐配合使用的工具</div>
                    <div>${(p.resources || []).map(r => `<span class="resource-chip"><i class="ph ph-arrow-up-right"></i>${SafeRender.escape(r)}</span>`).join('')}</div>
                </div>
            </div>
            <div class="path-detail-body">
                <h3 class="path-steps-heading">学习步骤 <span class="path-steps-hint" data-path-progress="${slug(p, i)}"><span data-path-progress-label>登录后记录</span></span></h3>
                <div>
                    ${(p.steps || []).map((s, idx) => {
                        const action = pathPracticeAction(s);
                        return `
                    <button type="button" id="path-step-${slug(p, i)}-${idx}" class="step-row" data-path="${slug(p, i)}" data-step="${idx}" aria-expanded="false" aria-controls="path-detail-${slug(p, i)}-${idx}" onclick="toggleStep(this)">
                        <span class="step-num">${idx+1}</span>
                        <i class="ph ${SafeRender.classNames(s.icon, 'ph-check-circle')} step-icon" aria-hidden="true"></i>
                        <span class="step-name">${SafeRender.escape(s.name)}</span>
                        <i class="ph ph-caret-down step-chevron" aria-hidden="true"></i>
                    </button>
                    <div class="step-detail" id="path-detail-${slug(p, i)}-${idx}">
                        <div class="step-detail-inner">
                            ${SafeRender.sanitizeHtml(s.detail)}
                            <div class="step-actions">
                                <button type="button" class="step-complete-btn" aria-pressed="false" onclick="togglePathStepCompletion(this,'${slug(p, i)}',${idx})"><i class="ph ph-circle"></i> 标记为已完成</button>
                                <a class="step-practice-link" href="${action.href}">${action.label}<i class="ph ph-arrow-right"></i></a>
                            </div>
                        </div>
                    </div>`;
                    }).join('')}
                </div>
                <button onclick="startPath(this)" class="path-start-btn" style="background:${grad(p, i)}">
                    展开全部步骤，开始学习 →
                </button>
            </div>
        </div>
    </section>`).join('');

    syncPathProgressUI();

    if (location.hash) {
        setTimeout(() => {
            const el = document.querySelector(location.hash);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }, 100);
    }
})();
</script>
<script src="js/pwa.js?v=20260806-ux2"></script>
<script src="js/assistant.js?v=20260821-tencent"></script>
</body>
</html>
