<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂工具 · AI 教师培训中心</title>
    <meta name="description" content="教师课堂常用互动小工具：倒计时、随机点名、转盘抽奖、弹力球抽选。开箱即用，无需安装。">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ct-page { max-width: 1240px; margin: 0 auto; padding: 56px 24px 88px; }
        .ct-kicker { font-family: var(--font-mono); font-size: 11.5px; color: var(--brand); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; font-weight: 500; }
        .ct-title { font-size: clamp(32px, 4.6vw, 52px); font-weight: 800; color: var(--ink); letter-spacing: -0.03em; line-height: 1.1; margin: 0; }
        .ct-title em { font-style: italic; color: var(--brand); }
        .ct-sub { font-size: 14.5px; color: var(--muted); margin-top: 14px; line-height: 1.75; max-width: 580px; }

        .ct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-top: 48px; }
        .ct-tool-card {
            background: var(--paper); border: 1px solid var(--line);
            border-radius: var(--r-md); padding: 26px;
            cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; gap: 8px;
            min-height: 200px;
        }
        .ct-tool-card::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--brand); transition: height 0.22s ease; }
        .ct-tool-card:hover { transform: translateY(-3px); border-color: transparent; box-shadow: var(--shadow-md); }
        .ct-tool-card:hover::after { height: 3px; }
        .ct-tool-icon {
            width: 52px; height: 52px; border-radius: var(--r-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; margin-bottom: 8px;
        }
        .ct-tool-icon.tone-1 { background: #fbe8e4; color: #c0392b; }
        .ct-tool-icon.tone-2 { background: #e7ede8; color: #2d6a4f; }
        .ct-tool-icon.tone-3 { background: #fbf2dd; color: #b08642; }
        .ct-tool-icon.tone-4 { background: #e6eef7; color: #2c5282; }
        .ct-tool-name { font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -0.015em; }
        .ct-tool-desc { font-size: 13.5px; color: var(--muted); line-height: 1.7; flex: 1; }
        .ct-tool-hint { font-size: 11.5px; color: var(--brand); font-weight: 500; display: flex; align-items: center; gap: 4px; margin-top: 4px; }

        /* Tool stage */
        .ct-stage { display: none; min-height: calc(100vh - 200px); }
        .ct-stage.active { display: flex; flex-direction: column; }
        .ct-stage-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: 20px; margin-bottom: 24px;
            border-bottom: 1px solid var(--line);
            gap: 12px; flex-wrap: wrap;
        }
        .ct-back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 16px; font-size: 13.5px; font-weight: 500;
            color: var(--text); border: 1px solid var(--line); background: var(--paper);
            border-radius: var(--r-sm); cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }
        .ct-back-btn:hover { border-color: var(--ink); color: var(--ink); }
        .ct-stage-title { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -0.015em; }
        .ct-fullscreen-btn {
            padding: 9px 16px; font-size: 13.5px; font-weight: 500;
            color: var(--text); border: 1px solid var(--line); background: var(--paper);
            border-radius: var(--r-sm); cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
            transition: border-color 0.15s, color 0.15s;
        }
        .ct-fullscreen-btn:hover { border-color: var(--ink); color: var(--ink); }

        /* Generic */
        .ct-btn-primary {
            padding: 14px 28px; font-size: 14.5px; font-weight: 600;
            background: var(--ink); color: var(--soft);
            border: 1px solid var(--ink); border-radius: var(--r-sm);
            cursor: pointer; letter-spacing: -0.005em;
            transition: background 0.15s, transform 0.15s;
        }
        .ct-btn-primary:hover { background: var(--brand); border-color: var(--brand); transform: translateY(-1px); }
        .ct-btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
        .ct-btn-secondary {
            padding: 14px 24px; font-size: 14px; font-weight: 500;
            background: var(--paper); color: var(--ink);
            border: 1px solid var(--line); border-radius: var(--r-sm);
            cursor: pointer; transition: border-color 0.15s;
        }
        .ct-btn-secondary:hover { border-color: var(--ink); }
        .ct-textarea {
            width: 100%; min-height: 180px;
            padding: 14px 16px; font-size: 14px; font-family: inherit;
            border: 1px solid var(--line); border-radius: var(--r-md);
            background: var(--paper); color: var(--ink);
            outline: none; resize: vertical; line-height: 1.7;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .ct-textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(26,22,18,0.06); }

        /* Countdown */
        .ct-countdown-wrap { display: flex; flex-direction: column; align-items: center; gap: 36px; padding: 48px 20px; }
        .ct-countdown-display {
            font-family: var(--font-mono); font-variant-numeric: tabular-nums;
            font-size: clamp(96px, 18vw, 220px); font-weight: 600;
            color: var(--ink); letter-spacing: -0.03em; line-height: 1;
            text-align: center;
        }
        .ct-countdown-display.warn { color: var(--brand); animation: ct-pulse 1s ease-in-out infinite; }
        @keyframes ct-pulse { 50% { opacity: 0.5; } }
        .ct-countdown-presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .ct-preset-btn {
            padding: 9px 18px; font-size: 13.5px; font-weight: 500;
            background: var(--paper); color: var(--text);
            border: 1px solid var(--line); border-radius: 999px;
            cursor: pointer; transition: all 0.15s;
            font-family: inherit;
        }
        .ct-preset-btn:hover { border-color: var(--ink); color: var(--ink); }
        .ct-preset-btn.active { background: var(--ink); border-color: var(--ink); color: var(--soft); font-weight: 600; }
        .ct-countdown-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .ct-input-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .ct-num-input {
            width: 90px; padding: 10px 14px; font-size: 16px; font-family: var(--font-mono);
            border: 1px solid var(--line); border-radius: var(--r-sm); text-align: center;
            background: var(--paper); color: var(--ink); outline: none;
        }
        .ct-num-input:focus { border-color: var(--ink); }
        .ct-input-label { font-size: 13.5px; color: var(--muted); }

        /* Random picker */
        .ct-picker-wrap { display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; }
        @media (max-width: 820px) { .ct-picker-wrap { grid-template-columns: 1fr; } }
        .ct-picker-left { display: flex; flex-direction: column; gap: 14px; }
        .ct-picker-right { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; min-height: 360px; background: var(--soft); border: 1px solid var(--line); border-radius: var(--r-md); padding: 40px 24px; }
        .ct-picker-display {
            font-size: clamp(40px, 7vw, 84px); font-weight: 800;
            color: var(--ink); letter-spacing: -0.025em;
            text-align: center; line-height: 1.15; min-height: 1.2em;
            transition: transform 0.18s;
        }
        .ct-picker-display.spinning { color: var(--muted); }
        .ct-picker-display.landed { color: var(--brand); }
        .ct-picker-display.landed { animation: ct-land 0.5s cubic-bezier(.2,.7,.2,1); }
        @keyframes ct-land { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .ct-picker-meta { font-size: 13px; color: var(--muted); }
        .ct-picker-options { display: flex; gap: 14px; font-size: 13.5px; color: var(--text); }
        .ct-picker-options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .ct-picker-history { display: flex; flex-wrap: wrap; gap: 6px; max-width: 100%; justify-content: center; }
        .ct-history-chip { font-size: 12px; padding: 3px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }

        /* Wheel */
        .ct-wheel-wrap { display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; align-items: center; }
        @media (max-width: 820px) { .ct-wheel-wrap { grid-template-columns: 1fr; } }
        .ct-wheel-canvas-box { position: relative; display: flex; justify-content: center; }
        #ct-wheel-canvas { max-width: 100%; height: auto; cursor: pointer; }
        .ct-wheel-pointer {
            position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 30px solid var(--ink);
            filter: drop-shadow(0 4px 8px rgba(26,22,18,0.3));
            z-index: 2;
        }
        .ct-wheel-result { text-align: center; font-size: 13.5px; color: var(--muted); min-height: 1.5em; }
        .ct-wheel-result strong { color: var(--brand); font-size: 22px; font-weight: 800; display: block; margin-top: 6px; }

        /* Bouncy balls */
        .ct-balls-stage {
            position: relative; width: 100%;
            height: 60vh; min-height: 460px;
            background:
                radial-gradient(ellipse 80% 60% at 50% 50%, var(--soft) 0%, var(--soft-2) 100%);
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            overflow: hidden;
        }
        #ct-balls-canvas { display: block; width: 100%; height: 100%; }
        .ct-balls-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
        .ct-balls-hint { font-size: 12.5px; color: var(--muted); margin-left: auto; }
        @media (max-width: 640px) { .ct-balls-hint { display: none; } }

        /* Fullscreen */
        body.ct-fullscreen .site-header,
        body.ct-fullscreen .site-footer,
        body.ct-fullscreen .assistant-launcher { display: none !important; }
        body.ct-fullscreen .ct-page { max-width: none; padding: 16px 20px; }
        body.ct-fullscreen .ct-balls-stage { height: calc(100vh - 140px); }
    </style>
</head>
<body>
<div id="main-nav"></div>

<main class="ct-page">
    <!-- Home: tool grid -->
    <div id="ct-home">
        <div class="ct-kicker">Classroom Tools · 课堂工具</div>
        <h1 class="ct-title">让<em>课堂</em>更生动</h1>
        <p class="ct-sub">为日常教学准备的几个互动小工具。无需安装、不收集数据，打开即可在课堂大屏上使用。</p>

        <div class="ct-grid">
            <div class="ct-tool-card" data-tool="countdown">
                <div class="ct-tool-icon tone-1"><i class="ph-fill ph-timer"></i></div>
                <div class="ct-tool-name">倒计时</div>
                <div class="ct-tool-desc">课堂限时活动、小测、思考时间。预设 1/3/5/10/15 分钟，或自定义时长。</div>
                <div class="ct-tool-hint">点击开始 <i class="ph ph-arrow-right"></i></div>
            </div>
            <div class="ct-tool-card" data-tool="picker">
                <div class="ct-tool-icon tone-2"><i class="ph-fill ph-user-focus"></i></div>
                <div class="ct-tool-name">随机点名</div>
                <div class="ct-tool-desc">输入花名册一次,公平随机抽取学生。支持"抽过不再抽",避免重复打扰。</div>
                <div class="ct-tool-hint">点击开始 <i class="ph ph-arrow-right"></i></div>
            </div>
            <div class="ct-tool-card" data-tool="wheel">
                <div class="ct-tool-icon tone-3"><i class="ph-fill ph-circle-half-tilt"></i></div>
                <div class="ct-tool-name">转盘抽奖</div>
                <div class="ct-tool-desc">把奖品或选项写进转盘,点击转动,旋转减速停止后揭晓中奖。</div>
                <div class="ct-tool-hint">点击开始 <i class="ph ph-arrow-right"></i></div>
            </div>
            <div class="ct-tool-card" data-tool="balls">
                <div class="ct-tool-icon tone-4"><i class="ph-fill ph-circles-three"></i></div>
                <div class="ct-tool-name">弹力球抽选</div>
                <div class="ct-tool-desc">每位同学化作一颗弹跳小球,按"抽选"会留下一颗——比静态名单更有仪式感。</div>
                <div class="ct-tool-hint">点击开始 <i class="ph ph-arrow-right"></i></div>
            </div>
        </div>
    </div>

    <!-- Stage: active tool -->
    <div id="ct-stage" class="ct-stage">
        <div class="ct-stage-bar">
            <button class="ct-back-btn" onclick="ctBack()"><i class="ph ph-arrow-left"></i> 返回工具列表</button>
            <div class="ct-stage-title" id="ct-stage-title"></div>
            <button class="ct-fullscreen-btn" onclick="ctToggleFullscreen()" id="ct-fs-btn"><i class="ph ph-arrows-out"></i> 全屏</button>
        </div>
        <div id="ct-stage-content"></div>
    </div>
</main>

<div id="main-footer"></div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=20260530-admin-delete"></script>
<script src="js/auth.js?v=20260531-classroom"></script>
<script>
renderNav('classroom');
renderFooter();
onAuthReady(() => { renderNav('classroom'); renderFooter(); });

let _activeTool = null;
let _toolCleanup = null;

const TOOLS = {
    countdown: { title: '倒计时', mount: mountCountdown },
    picker:    { title: '随机点名', mount: mountPicker },
    wheel:     { title: '转盘抽奖', mount: mountWheel },
    balls:     { title: '弹力球抽选', mount: mountBalls }
};

document.querySelectorAll('.ct-tool-card').forEach(card => {
    card.addEventListener('click', () => openTool(card.dataset.tool));
});

function openTool(key) {
    const tool = TOOLS[key];
    if (!tool) return;
    if (_toolCleanup) { try { _toolCleanup(); } catch {} _toolCleanup = null; }
    _activeTool = key;
    document.getElementById('ct-home').style.display = 'none';
    document.getElementById('ct-stage').classList.add('active');
    document.getElementById('ct-stage-title').textContent = tool.title;
    const container = document.getElementById('ct-stage-content');
    container.innerHTML = '';
    _toolCleanup = tool.mount(container) || null;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    location.hash = '#' + key;
}

function ctBack() {
    if (_toolCleanup) { try { _toolCleanup(); } catch {} _toolCleanup = null; }
    _activeTool = null;
    document.getElementById('ct-home').style.display = '';
    document.getElementById('ct-stage').classList.remove('active');
    if (document.body.classList.contains('ct-fullscreen')) ctToggleFullscreen();
    history.replaceState(null, '', location.pathname);
}

function ctToggleFullscreen() {
    document.body.classList.toggle('ct-fullscreen');
    const btn = document.getElementById('ct-fs-btn');
    const on = document.body.classList.contains('ct-fullscreen');
    btn.innerHTML = on ? '<i class="ph ph-arrows-in"></i> 退出全屏' : '<i class="ph ph-arrows-out"></i> 全屏';
}

window.addEventListener('load', () => {
    const hash = location.hash.replace('#', '');
    if (hash && TOOLS[hash]) openTool(hash);
});

/* ============== 1. 倒计时 ============== */
function mountCountdown(root) {
    root.innerHTML = `
        <div class="ct-countdown-wrap">
            <div class="ct-countdown-display" id="cd-display">05:00</div>
            <div class="ct-countdown-presets">
                <button class="ct-preset-btn" data-secs="60">1 分钟</button>
                <button class="ct-preset-btn" data-secs="180">3 分钟</button>
                <button class="ct-preset-btn active" data-secs="300">5 分钟</button>
                <button class="ct-preset-btn" data-secs="600">10 分钟</button>
                <button class="ct-preset-btn" data-secs="900">15 分钟</button>
            </div>
            <div class="ct-input-group">
                <span class="ct-input-label">自定义</span>
                <input type="number" class="ct-num-input" id="cd-min" min="0" max="180" placeholder="分">
                <span class="ct-input-label">:</span>
                <input type="number" class="ct-num-input" id="cd-sec" min="0" max="59" placeholder="秒">
                <button class="ct-btn-secondary" id="cd-set">设定</button>
            </div>
            <div class="ct-countdown-controls">
                <button class="ct-btn-primary" id="cd-start">开始</button>
                <button class="ct-btn-secondary" id="cd-reset">重置</button>
            </div>
        </div>`;

    let total = 300;
    let remaining = 300;
    let interval = null;
    let endAt = 0;

    const display = root.querySelector('#cd-display');
    const startBtn = root.querySelector('#cd-start');
    const resetBtn = root.querySelector('#cd-reset');

    function fmt(s) {
        s = Math.max(0, Math.round(s));
        const m = Math.floor(s / 60);
        const ss = s % 60;
        return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    }

    function paint() {
        display.textContent = fmt(remaining);
        display.classList.toggle('warn', remaining <= 10 && interval);
    }

    function tick() {
        remaining = Math.max(0, (endAt - Date.now()) / 1000);
        paint();
        if (remaining <= 0) {
            clearInterval(interval); interval = null;
            startBtn.textContent = '开始';
            beep();
        }
    }

    function beep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            for (let i = 0; i < 3; i++) {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = 880;
                g.gain.value = 0.001;
                const t = ctx.currentTime + i * 0.42;
                g.gain.setValueAtTime(0.001, t);
                g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
                o.start(t); o.stop(t + 0.4);
            }
        } catch {}
    }

    function setTotal(s) {
        total = s; remaining = s;
        if (interval) { clearInterval(interval); interval = null; startBtn.textContent = '开始'; }
        paint();
    }

    root.querySelectorAll('.ct-preset-btn').forEach(b => {
        b.addEventListener('click', () => {
            root.querySelectorAll('.ct-preset-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            setTotal(Number(b.dataset.secs));
        });
    });

    root.querySelector('#cd-set').addEventListener('click', () => {
        const m = Number(root.querySelector('#cd-min').value) || 0;
        const s = Number(root.querySelector('#cd-sec').value) || 0;
        const total = Math.max(1, m * 60 + s);
        root.querySelectorAll('.ct-preset-btn').forEach(x => x.classList.remove('active'));
        setTotal(total);
    });

    startBtn.addEventListener('click', () => {
        if (interval) {
            clearInterval(interval); interval = null;
            startBtn.textContent = '继续';
        } else {
            if (remaining <= 0) remaining = total;
            endAt = Date.now() + remaining * 1000;
            interval = setInterval(tick, 200);
            startBtn.textContent = '暂停';
        }
    });

    resetBtn.addEventListener('click', () => {
        if (interval) { clearInterval(interval); interval = null; }
        startBtn.textContent = '开始';
        remaining = total;
        paint();
    });

    paint();
    return () => { if (interval) clearInterval(interval); };
}

/* ============== 2. 随机点名 ============== */
function mountPicker(root) {
    const stored = localStorage.getItem('ctPickerRoster') || '李明 张伟 王芳 刘洋 陈静 周琪\n赵磊 黄敏 吴昊 郑思宇 孙逸 朱可';
    root.innerHTML = `
        <div class="ct-picker-wrap">
            <div class="ct-picker-left">
                <label class="ct-input-label" style="font-weight:500">花名册（每行一个，或用空格/逗号分隔）</label>
                <textarea class="ct-textarea" id="pk-names" placeholder="李明 张伟 王芳..."></textarea>
                <div class="ct-picker-options">
                    <label><input type="checkbox" id="pk-noRepeat" checked> 抽过的不再抽</label>
                    <label><input type="checkbox" id="pk-saveRoster" checked> 记住花名册</label>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap">
                    <button class="ct-btn-secondary" id="pk-reset">重置已抽</button>
                    <button class="ct-btn-secondary" id="pk-clear">清空</button>
                </div>
            </div>
            <div class="ct-picker-right">
                <div class="ct-picker-meta" id="pk-meta">准备就绪</div>
                <div class="ct-picker-display" id="pk-display">点击下方按钮</div>
                <button class="ct-btn-primary" id="pk-go" style="min-width:200px">抽取学生</button>
                <div class="ct-picker-history" id="pk-history"></div>
            </div>
        </div>`;

    const textarea = root.querySelector('#pk-names');
    const display = root.querySelector('#pk-display');
    const meta = root.querySelector('#pk-meta');
    const history = root.querySelector('#pk-history');
    const goBtn = root.querySelector('#pk-go');
    const noRepeat = root.querySelector('#pk-noRepeat');
    const saveRoster = root.querySelector('#pk-saveRoster');

    textarea.value = stored;
    let picked = [];
    let timer = null;

    function parseNames() {
        return textarea.value.split(/[\s,，;；、\n]+/).map(s => s.trim()).filter(Boolean);
    }

    function updateMeta() {
        const all = parseNames();
        meta.textContent = `共 ${all.length} 人 · 已抽 ${picked.length} 人 · 剩余 ${Math.max(0, all.length - picked.length)} 人`;
        history.innerHTML = picked.map(n => `<span class="ct-history-chip">${escapeHtml(n)}</span>`).join('');
    }

    function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function pickOnce() {
        const all = parseNames();
        if (!all.length) { meta.textContent = '请先输入花名册'; return; }
        let pool = noRepeat.checked ? all.filter(n => !picked.includes(n)) : all;
        if (!pool.length) {
            meta.textContent = '全部抽完了 · 点击"重置已抽"重新开始';
            return;
        }
        goBtn.disabled = true;
        display.classList.remove('landed');
        display.classList.add('spinning');
        let count = 0;
        const total = 18 + Math.floor(Math.random() * 6);
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
            display.textContent = pool[Math.floor(Math.random() * pool.length)];
            count++;
            if (count >= total) {
                clearInterval(timer); timer = null;
                const final = pool[Math.floor(Math.random() * pool.length)];
                display.textContent = final;
                display.classList.remove('spinning');
                display.classList.add('landed');
                if (noRepeat.checked) picked.push(final);
                updateMeta();
                goBtn.disabled = false;
            }
        }, 60 + (count > 12 ? count * 12 : 0));
    }

    function reflow() {
        if (saveRoster.checked) localStorage.setItem('ctPickerRoster', textarea.value);
        else localStorage.removeItem('ctPickerRoster');
        updateMeta();
    }

    textarea.addEventListener('input', reflow);
    saveRoster.addEventListener('change', reflow);
    noRepeat.addEventListener('change', updateMeta);
    root.querySelector('#pk-reset').addEventListener('click', () => { picked = []; updateMeta(); });
    root.querySelector('#pk-clear').addEventListener('click', () => { textarea.value = ''; picked = []; reflow(); });
    goBtn.addEventListener('click', pickOnce);

    updateMeta();
    return () => { if (timer) clearInterval(timer); };
}

/* ============== 3. 转盘抽奖 ============== */
function mountWheel(root) {
    root.innerHTML = `
        <div class="ct-wheel-wrap">
            <div>
                <label class="ct-input-label" style="font-weight:500">转盘选项（每行一个，2-20 项）</label>
                <textarea class="ct-textarea" id="wh-items" style="margin-top:10px">小组一\n小组二\n小组三\n小组四\n小组五\n小组六</textarea>
                <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
                    <button class="ct-btn-primary" id="wh-spin">转动转盘</button>
                    <button class="ct-btn-secondary" id="wh-reset">清空记录</button>
                </div>
                <div class="ct-wheel-result" id="wh-result" style="margin-top:24px"></div>
            </div>
            <div>
                <div class="ct-wheel-canvas-box">
                    <div class="ct-wheel-pointer"></div>
                    <canvas id="ct-wheel-canvas" width="460" height="460"></canvas>
                </div>
            </div>
        </div>`;

    const canvas = root.querySelector('#ct-wheel-canvas');
    const ctx = canvas.getContext('2d');
    const textarea = root.querySelector('#wh-items');
    const result = root.querySelector('#wh-result');

    const PALETTE = ['#c0392b', '#2c5282', '#2d6a4f', '#b08642', '#574a3d', '#962b1f', '#3a5070', '#1e3a32', '#a05a3e', '#6e3a26'];

    let items = [];
    let angle = 0;
    let spinning = false;

    function parse() {
        return textarea.value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 20);
    }

    function draw() {
        items = parse();
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2, r = Math.min(cx, cy) - 8;
        ctx.clearRect(0, 0, W, H);
        if (!items.length) {
            ctx.fillStyle = '#faf7f0';
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#e0d9c7'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = '#8a7d6d';
            ctx.font = '16px "Plus Jakarta Sans", "Noto Sans SC", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('请输入选项', cx, cy);
            return;
        }
        const n = items.length;
        const slice = (Math.PI * 2) / n;
        for (let i = 0; i < n; i++) {
            const start = angle + i * slice;
            const end = start + slice;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, end);
            ctx.closePath();
            ctx.fillStyle = PALETTE[i % PALETTE.length];
            ctx.fill();
            ctx.strokeStyle = '#faf7f0';
            ctx.lineWidth = 2;
            ctx.stroke();

            // label
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(start + slice / 2);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#faf7f0';
            const fontSize = Math.max(11, Math.min(20, 360 / Math.max(n, 6)));
            ctx.font = `600 ${fontSize}px "Plus Jakarta Sans", "Noto Sans SC", sans-serif`;
            let label = items[i];
            const maxLen = Math.max(4, Math.floor(18 - n / 2));
            if (label.length > maxLen) label = label.slice(0, maxLen) + '…';
            ctx.fillText(label, r - 16, 0);
            ctx.restore();
        }
        // hub
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.fillStyle = '#1a1612';
        ctx.fill();
        ctx.strokeStyle = '#faf7f0';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function spin() {
        if (spinning) return;
        items = parse();
        if (items.length < 2) { result.textContent = '至少需要 2 个选项'; return; }
        spinning = true;
        result.textContent = '转动中…';
        const n = items.length;
        const targetIdx = Math.floor(Math.random() * n);
        const slice = (Math.PI * 2) / n;
        // We want pointer (at top, -PI/2) to land in the middle of target slice.
        const pointerAngle = -Math.PI / 2;
        const targetMid = angle + targetIdx * slice + slice / 2;
        // We need targetMid + extra rotations ≡ pointerAngle (mod 2PI)
        const turns = 5 + Math.random() * 3;
        const finalAngle = pointerAngle - (targetIdx * slice + slice / 2) - Math.PI * 2 * turns;
        const startAngle = angle;
        const delta = finalAngle - ((angle) % (Math.PI * 2));
        const duration = 4200;
        const startTime = performance.now();
        function ease(t) { return 1 - Math.pow(1 - t, 3); }
        function step(now) {
            const t = Math.min(1, (now - startTime) / duration);
            angle = startAngle + delta * ease(t);
            draw();
            if (t < 1) requestAnimationFrame(step);
            else {
                spinning = false;
                angle = angle % (Math.PI * 2);
                result.innerHTML = `中奖项 <strong>${escapeHtml(items[targetIdx])}</strong>`;
            }
        }
        requestAnimationFrame(step);
    }

    function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    textarea.addEventListener('input', () => { if (!spinning) { angle = 0; draw(); } });
    root.querySelector('#wh-spin').addEventListener('click', spin);
    root.querySelector('#wh-reset').addEventListener('click', () => { result.textContent = ''; });
    canvas.addEventListener('click', spin);

    // Hi-DPI
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const css = Math.min(460, canvas.parentElement.clientWidth - 16);
        canvas.style.width = css + 'px';
        canvas.style.height = css + 'px';
        canvas.width = css * dpr;
        canvas.height = css * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
    }
    resize();
    window.addEventListener('resize', resize);

    return () => { window.removeEventListener('resize', resize); };
}

/* ============== 4. 弹力球 ============== */
function mountBalls(root) {
    const stored = localStorage.getItem('ctBallsRoster') || '李明 张伟 王芳 刘洋 陈静 周琪\n赵磊 黄敏 吴昊 郑思宇 孙逸 朱可';
    root.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:14px">
            <label class="ct-input-label" style="font-weight:500">参与名单（每行/空格/逗号分隔）</label>
            <textarea class="ct-textarea" id="bl-names" style="min-height:90px"></textarea>
            <div class="ct-balls-controls">
                <button class="ct-btn-primary" id="bl-launch">投放小球</button>
                <button class="ct-btn-secondary" id="bl-pick">抽选一位</button>
                <button class="ct-btn-secondary" id="bl-clear">清空</button>
                <span class="ct-balls-hint">点击任意小球可让它跳一下</span>
            </div>
            <div class="ct-balls-stage">
                <canvas id="ct-balls-canvas"></canvas>
            </div>
        </div>`;

    const textarea = root.querySelector('#bl-names');
    const canvas = root.querySelector('#ct-balls-canvas');
    const ctx = canvas.getContext('2d');
    const stage = root.querySelector('.ct-balls-stage');
    textarea.value = stored;

    const PALETTE = ['#c0392b', '#2c5282', '#2d6a4f', '#b08642', '#574a3d', '#962b1f', '#3a5070', '#a05a3e', '#7a2218', '#1e3a32'];
    let balls = [];
    let raf = null;
    let mode = 'all'; // 'all' or 'pick'
    let pickTarget = null;
    let pickStartTime = 0;
    let dpr = window.devicePixelRatio || 1;

    function parseNames() {
        return textarea.value.split(/[\s,，;；、\n]+/).map(s => s.trim()).filter(Boolean);
    }

    function resize() {
        const w = stage.clientWidth, h = stage.clientHeight;
        dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function launch() {
        const names = parseNames();
        if (!names.length) return;
        const w = stage.clientWidth, h = stage.clientHeight;
        const n = names.length;
        const baseR = Math.max(22, Math.min(46, Math.sqrt((w * h) / (n * 9))));
        balls = names.map((name, i) => {
            const angle = Math.random() * Math.PI * 2;
            const sp = 1.4 + Math.random() * 1.6;
            return {
                name,
                x: 60 + Math.random() * (w - 120),
                y: 60 + Math.random() * (h - 120),
                vx: Math.cos(angle) * sp,
                vy: Math.sin(angle) * sp,
                r: baseR,
                color: PALETTE[i % PALETTE.length],
                alpha: 1
            };
        });
        mode = 'all';
        pickTarget = null;
        if (!raf) loop();
        localStorage.setItem('ctBallsRoster', textarea.value);
    }

    function startPick() {
        if (!balls.length) return;
        mode = 'pick';
        pickTarget = balls[Math.floor(Math.random() * balls.length)];
        pickStartTime = performance.now();
        // boost everyone briefly
        balls.forEach(b => {
            b.vx *= 1.6; b.vy *= 1.6;
        });
    }

    function step() {
        const w = stage.clientWidth, h = stage.clientHeight;
        // physics
        for (const b of balls) {
            b.x += b.vx; b.y += b.vy;
            // wall bounce
            if (b.x - b.r < 0)      { b.x = b.r;       b.vx = Math.abs(b.vx); }
            if (b.x + b.r > w)      { b.x = w - b.r;   b.vx = -Math.abs(b.vx); }
            if (b.y - b.r < 0)      { b.y = b.r;       b.vy = Math.abs(b.vy); }
            if (b.y + b.r > h)      { b.y = h - b.r;   b.vy = -Math.abs(b.vy); }
        }
        // ball-ball collision (cheap)
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                const a = balls[i], b = balls[j];
                const dx = b.x - a.x, dy = b.y - a.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                const min = a.r + b.r;
                if (d > 0 && d < min) {
                    const overlap = (min - d) / 2;
                    const nx = dx / d, ny = dy / d;
                    a.x -= nx * overlap; a.y -= ny * overlap;
                    b.x += nx * overlap; b.y += ny * overlap;
                    // simple velocity swap along normal
                    const av = a.vx * nx + a.vy * ny;
                    const bv = b.vx * nx + b.vy * ny;
                    a.vx += (bv - av) * nx; a.vy += (bv - av) * ny;
                    b.vx += (av - bv) * nx; b.vy += (av - bv) * ny;
                }
            }
        }
        // pick mode: shrink/fade non-targets, grow target
        if (mode === 'pick' && pickTarget) {
            const elapsed = performance.now() - pickStartTime;
            const t = Math.min(1, elapsed / 2200);
            for (const b of balls) {
                if (b === pickTarget) {
                    b.r += (Math.min(110, Math.min(w, h) * 0.18) - b.r) * 0.08;
                    b.vx *= 0.94; b.vy *= 0.94;
                } else {
                    b.alpha = Math.max(0, 1 - t * 1.6);
                    b.r *= 0.985;
                }
            }
            if (t >= 1) {
                balls = [pickTarget];
                pickTarget.vx *= 0.5; pickTarget.vy *= 0.5;
                mode = 'all';
            }
        }
    }

    function render() {
        const w = stage.clientWidth, h = stage.clientHeight;
        ctx.clearRect(0, 0, w, h);
        for (const b of balls) {
            ctx.globalAlpha = b.alpha;
            // ball
            const grad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.4, b.r * 0.1, b.x, b.y, b.r);
            grad.addColorStop(0, lighten(b.color, 0.32));
            grad.addColorStop(1, b.color);
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
            // name
            ctx.fillStyle = '#faf7f0';
            const fs = Math.max(11, Math.min(b.r * 0.55, 22));
            ctx.font = `700 ${fs}px "Plus Jakarta Sans", "Noto Sans SC", sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            let label = b.name;
            const maxChars = Math.max(3, Math.floor(b.r / fs * 2.4));
            if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '…';
            ctx.fillText(label, b.x, b.y);
        }
        ctx.globalAlpha = 1;
    }

    function lighten(hex, amt) {
        const c = hex.replace('#','');
        const r = parseInt(c.substr(0,2),16);
        const g = parseInt(c.substr(2,2),16);
        const b = parseInt(c.substr(4,2),16);
        const mix = (v) => Math.round(v + (255 - v) * amt);
        return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
    }

    function loop() {
        step(); render();
        raf = requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', (ev) => {
        const rect = canvas.getBoundingClientRect();
        const x = ev.clientX - rect.left;
        const y = ev.clientY - rect.top;
        for (const b of balls) {
            const dx = x - b.x, dy = y - b.y;
            if (dx * dx + dy * dy <= b.r * b.r) {
                b.vy -= 6 + Math.random() * 3;
                b.vx += (Math.random() - 0.5) * 4;
                break;
            }
        }
    });

    root.querySelector('#bl-launch').addEventListener('click', launch);
    root.querySelector('#bl-pick').addEventListener('click', startPick);
    root.querySelector('#bl-clear').addEventListener('click', () => {
        balls = []; mode = 'all'; pickTarget = null;
    });
    textarea.addEventListener('input', () => {
        localStorage.setItem('ctBallsRoster', textarea.value);
    });

    resize();
    window.addEventListener('resize', resize);
    launch();
    if (!raf) loop();

    return () => {
        if (raf) cancelAnimationFrame(raf);
        window.removeEventListener('resize', resize);
    };
}
</script>
