    <style>
        /* ===== 智能体空间 · 页面专属样式（基于全站 editorial token） ===== */
        .page-kicker { font-family: var(--font-mono); font-size: 11.5px; color: var(--brand); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; font-weight: 500; }
        .page-title { font-size: clamp(32px, 4.6vw, 52px); font-weight: 800; color: var(--ink); letter-spacing: -0.03em; line-height: 1.1; margin: 0; }
        .page-title em { font-style: italic; color: var(--brand); }
        .page-sub { font-size: 14.5px; color: var(--muted); margin-top: 14px; line-height: 1.75; max-width: 620px; }

        /* 搜索 + 筛选条 */
        .agents-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 30px 0 8px; }
        .agent-search { position: relative; flex: 1; min-width: 240px; max-width: 380px; }
        .agent-search i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--subtle); font-size: 17px; }
        .agent-search input { width: 100%; padding: 11px 16px 11px 42px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 14px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
        .agent-search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
        .agent-count { font-family: var(--font-mono); font-size: 12px; color: var(--subtle); white-space: nowrap; }

        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 36px; }
        .filter-pill { padding: 8px 16px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; cursor: pointer; font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
        .filter-pill:hover { color: var(--ink); border-color: var(--subtle); }
        .filter-pill.active { background: var(--ink); color: var(--soft); border-color: var(--ink); }
        .filter-pill .dot { width: 7px; height: 7px; border-radius: 50%; }

        /* 卡片墙 */
        .agent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        @media (max-width: 920px) { .agent-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .agent-grid { grid-template-columns: 1fr; } }

        /* .agent-card 及其子部件样式已移至 css/style.css（与首页橱窗共享），此处不再重复 */

        .empty-hint { grid-column: 1/-1; text-align: center; padding: 70px 20px; color: var(--subtle); }
        .empty-hint i { font-size: 46px; display: block; margin-bottom: 12px; }

        /* 分区陈列 + 精选 */
        .agent-section { margin-bottom: 38px; }
        .agent-section-head { display: flex; align-items: center; gap: 10px; padding-top: 20px; margin-bottom: 18px; border-top: 1px solid var(--line); }
        .agent-section-head.featured-head { border-top: none; padding-top: 0; }
        .agent-section-head .sec-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
        .agent-section-head .sec-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
        .agent-section-head .sec-count { font-family: var(--font-mono); font-size: 11px; color: var(--subtle); background: var(--soft-2); padding: 1px 8px; border-radius: 999px; }
        .agent-section-head .sec-sub { font-size: 12.5px; color: var(--muted); }
        .featured-grid { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 980px) { .featured-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .featured-grid { grid-template-columns: 1fr; } }
        /* 精选卡片：细品牌色顶饰，强化「起点」感 */
        .featured-grid .agent-card { border-color: var(--brand-soft); }
        .featured-grid .agent-card::before { opacity: .5; background: var(--brand); }

        /* 朱印：实心款，与首页一致（2026-06-19 深修）——覆盖 style.css 的描边款 */
        .seal { font-family: "STKaiti","Kaiti SC","KaiTi","STSong","Songti SC",serif;
            display: inline-flex; align-items: center; justify-content: center;
            width: auto; height: auto; padding: 5px 9px; border: none; border-radius: 5px;
            color: #fff; background: #c8402e; font-size: 13px; font-weight: 700; letter-spacing: 1px;
            line-height: 1; transform: rotate(-7deg); position: relative;
            box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.5), inset 0 0 0 3px #c8402e; }
        .seal::before { display: none; }
        .seal::after { content: ""; position: absolute; inset: 0; border-radius: 5px;
            background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), transparent 60%); mix-blend-mode: screen; }
        .seal.sm { width: auto; height: auto; padding: 4px 8px; font-size: 12px; }
        .card-seal { position: absolute; top: 12px; right: 12px; z-index: 2; }
        .agents-head { position: relative; }

        /* ===== 工作台 ===== */
        .ws-wrap { max-width: 1320px; margin: 0 auto; padding: 24px 24px 76px; }
        .ws-top { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; align-items: center; gap: 14px; padding: 13px 0 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
        .ws-back { flex-shrink: 0; width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 19px; transition: background .15s, border-color .15s; }
        .ws-back:hover { background: var(--soft-2); border-color: var(--subtle); }
        .ws-ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 27px; flex-shrink: 0; }
        .ws-titles h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; color: var(--ink); margin: 0; letter-spacing: -0.02em; }
        .ws-titles p { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.7; max-width: 640px; }
        .ws-cat-tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; margin-bottom: 4px; }
        .ws-status { display: flex; align-items: center; gap: 8px; justify-self: end; flex-wrap: wrap; }
        .ws-model-badge { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; padding: 7px 11px; font-size: 12px; white-space: nowrap; }
        .ws-model-badge strong { color: var(--ink); font-weight: 700; }
        .ws-model-badge i { color: var(--brand); font-size: 15px; }
        @media (max-width: 760px) {
            .ws-top { grid-template-columns: auto auto minmax(0,1fr); align-items: flex-start; }
            .ws-status { grid-column: 1 / -1; justify-self: start; }
        }

        /* form 工作台：参数台 + 文稿台 */
        .ws-form-layout { display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
        .ws-panel { background: var(--paper); border: 1px solid rgba(26,22,18,.1); border-radius: 18px; box-shadow: 0 1px 2px rgba(26,22,18,.04); overflow: hidden; }
        .ws-input-col { position: sticky; top: 92px; align-self: start; height: clamp(520px, calc(100vh - 150px), 760px); padding: 18px; display: flex; flex-direction: column; }
        .ws-input-scroll { min-height: 0; overflow: auto; padding-right: 4px; }
        .ws-input-col.is-collapsed { height: auto; }
        .ws-input-col.is-collapsed .ws-input-scroll { display: none; }
        .ws-input-col.is-collapsed .ws-input-summary { display: block; }
        .ws-input-summary { display: none; border: 1px solid var(--line); background: var(--soft); border-radius: 14px; padding: 12px 13px; font-size: 12.5px; color: var(--text); line-height: 1.7; }
        .ws-input-summary b { color: var(--ink); font-weight: 800; }
        .ws-panel-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 18px; }
        .ws-panel-head .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--subtle); margin-left: auto; letter-spacing: .05em; }
        .ws-toggle-input { border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; padding: 5px 9px; font: inherit; font-size: 11.5px; cursor: pointer; }
        .ws-toggle-input:hover { color: var(--ink); border-color: var(--subtle); background: var(--soft-2); }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
        .field label .req { color: var(--brand); margin-left: 2px; }
        .field label .hint { font-weight: 400; color: var(--subtle); font-size: 11.5px; margin-left: 6px; }
        .field input, .field select, .field textarea { width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--soft); font-size: 13.5px; color: var(--ink); outline: none; font-family: inherit; transition: border-color .15s, box-shadow .15s, background .15s; }
        .field textarea { resize: vertical; line-height: 1.65; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); background: var(--paper); box-shadow: 0 0 0 3px var(--brand-soft); }
        .field .chips { display: flex; flex-wrap: wrap; gap: 7px; }
        .field .chip-opt { padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); font-size: 12.5px; color: var(--text); cursor: pointer; transition: all .14s; user-select: none; }
        .field .chip-opt.on { background: var(--ink); color: var(--soft); border-color: var(--ink); }
        .hw-assist { border: 1px solid var(--line); background: #fffaf2; border-radius: 14px; padding: 13px 14px; margin: -2px 0 16px; }
        .hw-assist-top { display: flex; gap: 10px; align-items: flex-start; }
        .hw-assist-ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex-shrink: 0; font-size: 17px; }
        .hw-assist-title { font-size: 13px; font-weight: 800; color: var(--ink); margin-bottom: 3px; }
        .hw-assist-copy { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
        .hw-assist-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
        .hw-assist-actions button { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--paper); color: var(--text); border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
        .hw-assist-actions button:hover { border-color: var(--brand); color: var(--brand); }

        .ws-run { width: 100%; margin-top: 6px; padding: 13px; border: none; border-radius: var(--r-md); background: var(--brand); color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .1s; }
        .ws-run:hover { background: var(--brand-dark); }
        .ws-run:active { transform: scale(.99); }
        .ws-run:disabled { opacity: .55; cursor: not-allowed; }

        /* 输出区 */
        .ws-out-panel { height: clamp(520px, calc(100vh - 150px), 760px); display: flex; flex-direction: column; }
        .ws-edit-area { width: 100%; flex: 1; min-height: 0; border: none; border-radius: 0; background: var(--soft); padding: 20px 22px; font-family: var(--font-mono); font-size: 13px; line-height: 1.7; color: var(--ink); resize: none; outline: none; }
        .ws-edit-area:focus { background: var(--paper); box-shadow: inset 0 0 0 3px var(--brand-soft); }
        .ws-mini-btn.active { background: var(--ink); color: var(--soft); border-color: var(--ink); }
        .ws-out-head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--line-soft); background: linear-gradient(180deg, var(--paper), var(--soft)); flex-shrink: 0; }
        .ws-out-head .label { font-size: 13px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 7px; }
        .ws-out-actions { margin-left: auto; display: flex; gap: 7px; }
        .ws-mini-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-sm); font-size: 12px; color: var(--text); cursor: pointer; font-family: inherit; transition: all .14s; }
        .ws-mini-btn:hover { background: var(--soft-2); color: var(--ink); }
        .ws-mini-btn.copied { color: var(--success); border-color: var(--success); }
        .ws-out-body { flex: 1; min-height: 0; overflow: auto; padding: 20px 22px; font-size: 14px; line-height: 1.85; color: var(--text); }
        .ws-out-body.placeholder { display: grid; place-items: center; text-align: center; color: var(--subtle); }
        .ws-out-body.placeholder .ph { font-size: 50px; display: block; margin-bottom: 14px; opacity: .6; }
        @media (max-width: 900px) {
            .ws-form-layout { grid-template-columns: 1fr; }
            .ws-input-col { position: static; height: auto; max-height: none; }
            .ws-out-panel { height: min(72vh, 680px); min-height: 460px; }
        }
        @media (max-width: 600px) {
            .ws-out-head { display: block; }
            .ws-out-actions { margin: 12px 0 0; display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
            .ws-mini-btn { justify-content: center; white-space: nowrap; }
        }
        /* markdown 渲染样式 */
        .md h1, .md h2, .md h3 { color: var(--ink); font-weight: 700; line-height: 1.3; margin: 1.2em 0 .5em; }
        .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
        .md h2 { padding-top: .4em; border-top: 1px solid var(--line-soft); }
        .md p { margin: .6em 0; }
        .md ul, .md ol { margin: .5em 0; padding-left: 1.4em; }
        .md li { margin: .3em 0; }
        .md strong { color: var(--ink); font-weight: 700; }
        .md code { background: var(--soft-2); padding: 1px 6px; border-radius: 5px; font-family: var(--font-mono); font-size: 12.5px; }
        .md blockquote { border-left: 3px solid var(--brand); padding: 2px 14px; margin: .8em 0; color: var(--muted); background: var(--brand-soft); border-radius: 0 8px 8px 0; }
        .md table { width: 100%; border-collapse: collapse; margin: .9em 0; font-size: 13px; }
        .md th, .md td { border: 1px solid var(--line); padding: 8px 11px; text-align: left; }
        .md th { background: var(--soft-2); font-weight: 700; color: var(--ink); }
        .md hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
        .cursor-blink::after { content: "▋"; color: var(--brand); animation: blink 1s steps(2) infinite; margin-left: 1px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* chat 工作台 —— 独立聊天窗口，内部滚动（不带动整页与底部色块）*/
        .ws-chat-layout { max-width: 840px; margin: 0 auto; }
        .chat-window { display: flex; flex-direction: column; height: min(66vh, 600px); border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--soft); overflow: hidden; box-shadow: var(--shadow-sm); }
        .chat-stream { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px; padding: 22px 20px; }
        .chat-row { display: flex; gap: 12px; max-width: 88%; }
        .chat-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .chat-av { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; font-size: 17px; box-shadow: var(--shadow-xs); }
        .chat-av.user { background: var(--ink); color: var(--soft); font-size: 13px; font-weight: 700; }
        .chat-bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.8; }
        .chat-row.bot .chat-bubble { background: var(--paper); border: 1px solid var(--line); border-top-left-radius: 5px; color: var(--text); box-shadow: var(--shadow-xs); }
        .chat-row.user .chat-bubble { background: var(--ink); color: var(--soft); border-top-right-radius: 5px; }
        .chat-row.user .chat-bubble .md strong { color: #fff; }
        .chat-foot { border-top: 1px solid var(--line); background: var(--paper); padding: 12px 14px; }
        .chat-starter-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .chat-starter-chips button { padding: 7px 13px; border: 1px solid var(--line); background: var(--soft); border-radius: 999px; font-size: 12.5px; color: var(--text); cursor: pointer; font-family: inherit; transition: all .14s; }
        .chat-starter-chips button:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
        .chat-input-bar { display: flex; gap: 10px; align-items: flex-end; }
        .chat-input-bar textarea { flex: 1; border: 1px solid var(--line); border-radius: var(--r-md); outline: none; resize: none; font-family: inherit; font-size: 14px; line-height: 1.6; background: var(--soft); color: var(--ink); max-height: 120px; padding: 10px 12px; transition: border-color .15s, box-shadow .15s, background .15s; }
        .chat-input-bar textarea:focus { border-color: var(--brand); background: var(--paper); box-shadow: 0 0 0 3px var(--brand-soft); }
        .chat-send { flex-shrink: 0; width: 42px; height: 42px; border-radius: var(--r-md); border: none; background: var(--brand); color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 19px; transition: background .15s; }
        .chat-send:hover { background: var(--brand-dark); }
        .chat-send:disabled { opacity: .5; cursor: not-allowed; }
        .chat-actions { display: flex; align-items: center; justify-content: flex-end; gap: 7px; margin: 0 0 10px; flex-wrap: wrap; }
        .chat-actions .ws-mini-btn { background: var(--paper); }

        .api-note { display: flex; align-items: flex-start; gap: 9px; margin-top: 18px; padding: 13px 16px; background: var(--soft-2); border: 1px dashed var(--line); border-radius: var(--r-md); font-size: 12.5px; color: var(--muted); line-height: 1.7; }
        .api-note i { color: var(--ochre); font-size: 16px; margin-top: 1px; flex-shrink: 0; }
        .work-title-modal { position: fixed; inset: 0; z-index: 650; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(26,22,18,.46); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .work-title-modal.active { display: flex; }
        .work-title-box { width: min(440px, 100%); background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 22px; }
        .work-title-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
        .work-title-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); flex-shrink: 0; font-size: 18px; }
        .work-title-head h3 { margin: 0; font-size: 17px; color: var(--ink); font-weight: 800; }
        .work-title-head p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.65; }
        .work-title-box label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 7px; }
        .work-title-box input { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--soft); color: var(--ink); outline: none; padding: 11px 12px; font: inherit; font-size: 14px; }
        .work-title-box input:focus { border-color: var(--brand); background: var(--paper); box-shadow: 0 0 0 3px var(--brand-soft); }
        .work-title-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .work-title-actions button { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 13px; background: var(--paper); color: var(--text); cursor: pointer; font: inherit; font-size: 13px; }
        .work-title-actions button.primary { background: var(--ink); border-color: var(--ink); color: var(--soft); font-weight: 700; }
        .work-title-actions button:hover { border-color: var(--ink); color: var(--ink); }
        .work-title-actions button.primary:hover { background: var(--brand); border-color: var(--brand); color: #fff; }
    </style>
</head>
<body>
<div id="main-nav"></div>

<!-- ============ 视图一：智能体库 ============ -->
<main id="view-home" style="max-width:1240px;margin:0 auto;padding:48px 24px 88px">
    <div class="breadcrumb"><a href="index.html">首页</a><i class="ph ph-caret-right"></i><span>智能体空间</span></div>

    <div class="agents-head" style="margin-bottom:8px">

function insertHandwritingTemplate(aid, onlyEmpty) {
    const cfg = HANDWRITING_ASSIST[aid];
    const form = document.getElementById('agent-form');
    if (!cfg || !form) return;
    Object.entries(cfg.fields).forEach(([key, value]) => {
        const el = form.querySelector(`[name="${key}"]`);
        if (!el) return;
        if (onlyEmpty && el.value.trim()) return;
        el.value = value;
        if (el.tagName === 'TEXTAREA') {
            el.style.height = 'auto';
            el.style.height = Math.max(el.scrollHeight + 8, 96) + 'px';
        }
    });
    showToast(onlyEmpty ? '已填入空白模板' : '已插入粘贴模板');

function renderField(aid, f) {
    const req = f.required ? '<span class="req">*</span>' : '';
    const hint = f.hint ? `<span class="hint">${f.hint}</span>` : '';
    const label = `<label>${f.label}${req}${hint}</label>`;
    let control = '';
    if (f.type === 'textarea') {
        control = `<textarea name="${f.key}" rows="${f.rows || 4}" placeholder="${f.placeholder || ''}"></textarea>`;
    } else if (f.type === 'select') {
        control = `<select name="${f.key}">${f.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
    } else if (f.type === 'chips') {
        control = `<div class="chips" data-key="${f.key}">${f.options.map(o => `<span class="chip-opt">${o}</span>`).join('')}</div>`;
    } else {
        control = `<input type="${f.type || 'text'}" name="${f.key}" placeholder="${f.placeholder || ''}">`;
    }
    return `<div class="field">${label}${control}</div>`;
}

function collectInputs(a) {
    const form = document.getElementById('agent-form');
    const data = {};
    a.fields.forEach(f => {
        if (f.type === 'chips') {
            const sel = [...form.querySelectorAll(`.chips[data-key="${f.key}"] .chip-opt.on`)].map(e => e.textContent);
            data[f.key] = sel;
        } else {
            const el = form.querySelector(`[name="${f.key}"]`);
            data[f.key] = el ? el.value.trim() : '';
        }
    });
    return data;
}

function summarizeInputs(a, inputs) {
    const priority = ['grade','subject','topic','point','concept','scope','theme','title','scene','name'];
    const parts = [];
    priority.forEach(key => {
        const field = a.fields.find(f => f.key === key);
        const value = fieldText(inputs[key]);
        if (field && value) parts.push(`<b>${escapeHtml(field.label)}</b>：${escapeHtml(value)}`);
    });
    if (!parts.length) {
        a.fields.slice(0, 3).forEach(field => {
            const value = fieldText(inputs[field.key]);
            if (value) parts.push(`<b>${escapeHtml(field.label)}</b>：${escapeHtml(value)}`);
        });
    }
    return parts.slice(0, 5).join('<br>');
}

function quizPointPlaceholder(subject) {
    return QUIZ_POINT_PLACEHOLDERS[subject] || '如：本课重点知识 / 单元复习范围';
}

function initAgentFormHelpers(a) {
    if (a.id !== 'quiz-gen') return;
    const form = document.getElementById('agent-form');
    const subject = form?.querySelector('[name="subject"]');
    const point = form?.querySelector('[name="point"]');
    if (!subject || !point) return;
    const sync = () => { point.placeholder = quizPointPlaceholder(subject.value); };
    subject.addEventListener('change', sync);
    sync();
}

function gradeLevel(grade) {
    return GRADE_LEVEL[grade] || 0;
}

function fieldText(value) {
    if (Array.isArray(value)) return value.join('、');
    return value || '';
}

function validationText(inputs, config) {
    const keys = config.textKeys || (config.textKey ? [config.textKey] : []);
    return keys.map(key => fieldText(inputs[key])).filter(Boolean).join('\n');
}

function ruleSubjects(rule) {
    return rule.subjects || (rule.subject ? [rule.subject] : []);
}

function subjectLabel(rule) {
    const subjects = ruleSubjects(rule);
    return subjects.join(' / ');
}

function configSubject(inputs, config) {
    if (config.ignoreSubject) return '';
    const key = config.subjectKey === undefined ? 'subject' : config.subjectKey;
    return key ? (inputs[key] || '') : '';
}

function configGrade(inputs, config) {
    const key = config.gradeKey === undefined ? 'grade' : config.gradeKey;
    return key ? (inputs[key] || '') : '';
}

function stopMessage(config) {
    return config.action ? `不适合直接${config.action}` : '当前输入不适合直接生成';
}

function validateSubjectGrade(a, inputs, config) {
    const subject = configSubject(inputs, config);
    const grade = configGrade(inputs, config);
    const level = gradeLevel(grade);
    if (!subject || !level) return { ok: true };

    const rule = SUBJECT_GRADE_RULES.find(r => r.subject === subject && level < r.minLevel);
    if (!rule) return { ok: true };

    return {
        ok: false,
        title: '参数需要调整',
        message: `「${subject}」通常不早于${rule.minGrade}作为独立学科学习，${grade}${stopMessage(config)}。`,
        toast: config.toast || '学科和年级不匹配，已停止生成',
        suggestions: [
            `如果面向${grade}，建议将学科改为「${rule.lowerSubject}」，并选择${rule.lowerScope}。`,
            `如果确实要使用「${subject}」，建议将年级改为「${rule.minGrade}」或更高。`
        ]
    };
}

function validateCurriculumInputs(a, inputs) {
    const config = CURRICULUM_VALIDATION[a.id];
    if (!config) return { ok: true };
    const subjectGradeResult = validateSubjectGrade(a, inputs, config);
    if (!subjectGradeResult.ok) return subjectGradeResult;

    const subject = configSubject(inputs, config);
    const grade = configGrade(inputs, config);
    const text = validationText(inputs, config);
    const level = gradeLevel(grade);
    const rule = KNOWLEDGE_COMPATIBILITY_RULES.find(r => r.pattern.test(text));
    if (!rule) return { ok: true };

    const reasons = [];
    const subjects = ruleSubjects(rule);
    const targetSubject = subjectLabel(rule);
    if (subject && subjects.length && !subjects.includes(subject)) {
        reasons.push(`「${rule.label}」属于${targetSubject}相关内容，不属于${subject}学科。`);
    }
    if (level && rule.minLevel && level < rule.minLevel) {
        reasons.push(`「${rule.label}」通常不早于${rule.minGrade}系统学习，${grade}${stopMessage(config)}。`);
    }
    if (!reasons.length) return { ok: true };

    const alternativesBySubject = rule.alternatives || {};
    const firstSubject = subjects[0] || '';
    const alternatives = alternativesBySubject[subject] || alternativesBySubject[firstSubject] || '请选择与当前学科、年级一致的教材内容';
    const suggestions = [];
    if (grade && level && rule.minLevel && level < rule.minLevel) {
        suggestions.push(`如果面向${grade}，建议改为：${rule.lowerGradeAlternatives || alternatives}。`);
    } else if (subject) {
        suggestions.push(`如果继续使用「${subject}」，建议把${config.textLabel || '内容'}改为：${alternatives}。`);
    }
    const changeParts = [];
    if (subject && subjects.length && !subjects.includes(subject)) changeParts.push(`学科改为「${targetSubject}」`);
    if (grade && rule.minGrade && level && level < rule.minLevel) changeParts.push(`年级改为「${rule.minGrade}」或更高`);
    if (changeParts.length) {
        suggestions.push(`如果确实要处理「${rule.label}」，建议${changeParts.join('，')}。`);
    }
    return {
        ok: false,
        title: '参数需要调整',
        message: reasons.join(''),
        toast: config.toast,
        suggestions
    };
}

function validateAgentInputs(a, inputs) {
    return validateCurriculumInputs(a, inputs);
}

function showInputValidation(result) {
    const actions = document.getElementById('out-actions');
    const body = document.getElementById('out-body');
    if (actions) actions.style.display = 'none';
    if (!body) return;
    _lastResult = '';
    _lastInputs = null;
    body.className = 'ws-out-body md';
    body.innerHTML = mdToHtml(`### ${result.title || '参数需要调整'}\n\n${result.message || '当前输入不适合直接生成。'}\n\n${(result.suggestions || []).map(s => `- ${s}`).join('\n')}`);
}

async function runForm(aid) {
    const a = AGENTS.find(x => x.id === aid);
    if (typeof requireLogin === 'function' && !requireLogin(null, '请先登录后使用智能体')) return false;
    const inputs = collectInputs(a);
    _lastInputs = inputs;
    // 必填校验
    const missing = a.fields.filter(f => f.required && (!inputs[f.key] || (Array.isArray(inputs[f.key]) && !inputs[f.key].length)));
    if (missing.length) { showToast(`请填写：${missing.map(m => m.label).join('、')}`); return false; }
    const validation = validateAgentInputs(a, inputs);
    if (!validation.ok) {
        showInputValidation(validation);
        showToast(validation.toast || '当前输入不匹配，已停止生成');
        return false;
    }
    updateInputSummary(a, inputs);

    const btn = document.getElementById('run-btn');
    const body = document.getElementById('out-body');
    const actions = document.getElementById('out-actions');
    const runSeq = ++_formRunSeq;
    const ownerUid = currentAuthUid();
    btn.disabled = true; btn.innerHTML = '<i class="ph ph-spinner-gap ph-spin"></i> 生成中…';
    actions.style.display = 'none';
    body.className = 'ws-out-body md';
    body.innerHTML = '';
    _lastResult = '';
    _editing = false;
    const editBtn = document.getElementById('edit-btn');
    if (editBtn) { editBtn.classList.remove('active'); editBtn.innerHTML = '<i class="ph ph-pencil-simple"></i> 编辑'; }

    try {
        await callAgentAPI({
            agent: a, inputs,
            onToken: (full) => {
                if (runSeq !== _formRunSeq || currentAuthUid() !== ownerUid) return;
                _lastResult = full; body.innerHTML = mdToHtml(full) + ' '; body.classList.add('cursor-blink');
            }
        });
        if (runSeq !== _formRunSeq || currentAuthUid() !== ownerUid) return false;
        body.classList.remove('cursor-blink');
        body.innerHTML = mdToHtml(_lastResult);
        actions.style.display = 'flex';
        toggleInputPanel(false);
        if (window.DB && DB.bumpAgentUsage) DB.bumpAgentUsage(aid);   // 使用计数（用于「热门」印章）
        if (window.Analytics) Analytics.track('agent_run', {
            feature: 'agents',
            targetId: aid,
            targetName: a ? a.name : '',
            meta: { agentType: a ? a.type : 'form' }
        });
    } catch (e) {
        if (runSeq !== _formRunSeq || currentAuthUid() !== ownerUid) return false;
        body.className = 'ws-out-body placeholder';
        body.innerHTML = `<div><i class="ph ph-warning"></i><p>生成失败：${e.message}</p></div>`;
    }
    if (runSeq === _formRunSeq && currentAuthUid() === ownerUid) {
        btn.disabled = false; btn.innerHTML = '<i class="ph-fill ph-sparkle"></i> 开始生成';
    }
    return false;
}

let _workTitleResolve = null;

function cleanWorkTitlePart(value, max = 24) {
    const raw = Array.isArray(value) ? value.join('、') : String(value || '');
    return raw
        .replace(/[#*_>`\[\]（）()《》]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, max);
}

function pickInput(inputs, keys, max) {
    for (const key of keys) {
        const val = cleanWorkTitlePart(inputs?.[key], max);
        if (val) return val;
    }
    return '';
}

function markdownHeading(content) {
    const match = String(content || '').match(/^#{1,3}\s+(.+)$/m);
    return match ? cleanWorkTitlePart(match[1], 34) : '';
}

function compactWorkTitle(parts, fallback) {
    const title = parts.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
    return (title || fallback || '备课内容').slice(0, 72);
}

function buildWorkTitle(agent, inputs, content, type = 'draft') {
    const subject = pickInput(inputs, ['subject'], 10);
    const grade = pickInput(inputs, ['grade'], 12);
    const topic = pickInput(inputs, ['topic','point','concept','scope','theme','title','scene','name'], 30);
    const excerpt = pickInput(inputs, ['question','errors','detail','happened','text'], 28);
    const heading = markdownHeading(content);
    const base = topic || excerpt || heading;
    const fallback = `${agent ? agent.name : '生成结果'} · ${new Date().toLocaleDateString('zh-CN')}`;
    const id = agent?.id || '';

    const templates = {
        'lesson-design': ['教学设计', [grade, subject, base, '教学设计']],
        'courseware-outline': ['课件大纲', [grade, subject, base, '课件大纲']],
        'micro-script': ['微课脚本', [grade, base, '微课脚本']],
        'lesson-hook': ['情境导入', [grade, subject, base, '情境导入']],
        'layered-q': ['分层提问', [grade, subject, base, '分层提问']],
        'concept-explainer': ['概念解释', [grade, base, '概念解释']],
        'class-activity': ['课堂活动', [subject, base, '课堂活动']],
        'quiz-gen': ['练习题', [grade, subject, base, pickInput(inputs, ['types'], 18) || '练习题']],
        'homework-grader': ['作业批改', [subject, excerpt || base, '作业批改']],
        'essay-review': ['作文评改', [grade, base ? `《${base}》` : '', '作文评改']],
        'exam-paper': ['单元组卷', [grade, subject, base, '单元组卷']],
        'error-diagnosis': ['错题诊断', [grade, subject, excerpt || base, '错题诊断']],
        'parent-comm': ['家校沟通', [base || excerpt, '家校沟通']],
        'student-comment': ['学生评语', [base, '学生评语']],
        'class-meeting': ['班会方案', [grade, base, '班会方案']],
        'teaching-reflection': ['教学反思', [base, '教学反思']],
        'lesson-observe': ['听评课观察', [base, '听评课观察']]
    };
    if (type === 'chat') return compactWorkTitle([agent?.name ? `${agent.name}对话` : '智能体对话', base], fallback);
    const tpl = templates[id];
    return compactWorkTitle(tpl ? tpl[1] : [grade, subject, base || agent?.name], fallback);
}

function confirmWorkbookTitle(suggestedTitle, sourceName) {
    return new Promise(resolve => {
        const modal = document.getElementById('work-title-modal');
        const input = document.getElementById('work-title-input');
        const source = document.getElementById('work-title-source');
        if (!modal || !input) {
            const title = prompt('保存标题：', suggestedTitle || '备课内容');
            resolve(title ? title.trim() : '');
            return;
        }
        _workTitleResolve = resolve;
        input.value = suggestedTitle || '备课内容';
        if (source) source.textContent = sourceName ? `来源：${sourceName}。可以先改成更方便查找的标题。` : '可以先改成更方便查找的标题。';
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => { input.focus(); input.select(); }, 30);
    });
}

function closeWorkTitleModal(save) {
    const modal = document.getElementById('work-title-modal');
    const input = document.getElementById('work-title-input');
    const title = save ? cleanWorkTitlePart(input?.value, 80) : '';
    if (save && !title) {
        showToast('请输入保存标题');
        input?.focus();
        return;
    }
    if (modal) modal.classList.remove('active');
    document.body.style.overflow = '';
    if (_workTitleResolve) _workTitleResolve(title);
    _workTitleResolve = null;
}

document.addEventListener('keydown', e => {
    const modal = document.getElementById('work-title-modal');
    if (!modal?.classList.contains('active')) return;
    if (e.key === 'Escape') closeWorkTitleModal(false);
    if (e.key === 'Enter' && document.activeElement?.id === 'work-title-input') closeWorkTitleModal(true);
});

async function saveToWorkbook(aid) {
    // 编辑态下先把最新文本存回
    if (_editing) { const ta = document.getElementById('edit-area'); if (ta) _lastResult = ta.value; }
    if (!_lastResult) { showToast('还没有可保存的内容'); return; }
    if (typeof requireLogin === 'function' && !requireLogin(null, '请先登录后保存')) return;
    const a = AGENTS.find(x => x.id === aid);
    const user = Auth.getCurrentUser();
    if (!user) { showToast('请先登录后保存'); return; }
    const title = await confirmWorkbookTitle(buildWorkTitle(a, _lastInputs || {}, _lastResult, 'draft'), a ? a.name : '智能体');
    if (!title) return;
    const btn = document.getElementById('save-btn');
    const orig = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<i class="ph ph-spinner-gap ph-spin"></i> 保存中…';
    try {
        await DB.saveWork({
            uid: user.uid,
            agentId: aid,
            agentName: a ? a.name : '',
            agentType: a ? a.type : 'form',
            workType: 'draft',
            title,
            content: _lastResult,
            inputs: _lastInputs || {}
        });
        if (window.Analytics) Analytics.track('workbook_save', {
            feature: 'workspace',
            targetId: aid,
            targetName: a ? a.name : '',
            meta: { source: 'agent_form' }
        });
        btn.classList.add('copied'); btn.innerHTML = '<i class="ph ph-check"></i> 已保存';
        showToast('已保存到「我的备课本」✓');
        setTimeout(() => { btn.classList.remove('copied'); btn.disabled = false; btn.innerHTML = orig; }, 1800);
    } catch (e) {
        btn.disabled = false; btn.innerHTML = orig;
        showToast('保存失败：' + (e.message || '请稍后重试'));
    }
}

function copyResult() {
    // 编辑态下先把最新文本存回
    if (_editing) { const ta = document.getElementById('edit-area'); if (ta) _lastResult = ta.value; }
    if (!_lastResult) return;
    navigator.clipboard.writeText(_lastResult).then(() => {
        const b = document.getElementById('copy-btn');
        b.classList.add('copied'); b.innerHTML = '<i class="ph ph-check"></i> 已复制';
        showToast('已复制到剪贴板 ✓');
        setTimeout(() => { b.classList.remove('copied'); b.innerHTML = '<i class="ph ph-copy"></i> 复制'; }, 1800);
    });
}

// 编辑生成结果：渲染态 ↔ 编辑原始文本 切换
let _editing = false;
function toggleEdit() {
    const body = document.getElementById('out-body');
    const btn = document.getElementById('edit-btn');
    if (!_editing) {
        _editing = true;
        body.className = 'ws-out-body';

}

/* ---------- chat 工作台 ---------- */
let _chatHistory = [];
let _chatRunSeq = 0;
function buildChat(a) {
    clearAgentWorkState({ keepAgent: true });
    _chatHistory = [];
    const starters = (a.starters || []).map(s =>
        `<button onclick="quickChat('${a.id}', this.textContent)">${s}</button>`).join('');
    document.getElementById('ws-body').innerHTML = `
    <div class="ws-chat-layout">
        <div class="chat-actions" id="chat-actions" style="display:none">
            <button class="ws-mini-btn" id="chat-save-btn" onclick="saveChatToWorkbook('${a.id}')"><i class="ph ph-bookmark-simple"></i> 保存到备课本</button>
            <button class="ws-mini-btn" id="chat-copy-btn" onclick="copyChatTranscript('${a.id}')"><i class="ph ph-copy"></i> 复制对话</button>
            <button class="ws-mini-btn" onclick="clearChat('${a.id}')"><i class="ph ph-trash"></i> 清空</button>
        </div>
        <div class="chat-window">
            <div class="chat-stream" id="chat-stream"></div>
            <div class="chat-foot">
                ${starters ? `<div class="chat-starter-chips" id="chat-starters">${starters}</div>` : ''}
                <div class="chat-input-bar">
                    <textarea id="chat-input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"
                        oninput="autoGrow(this)" onkeydown="chatKey(event,'${a.id}')"></textarea>
                    <button class="chat-send" id="chat-send" onclick="sendChat('${a.id}')"><i class="ph-fill ph-paper-plane-right"></i></button>
                </div>
            </div>
        </div>
    </div>`;
    // 智能体开场白
    pushChat('bot', a.greeting || '你好，我可以帮你什么？', a);
    updateChatActions();
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
function chatKey(ev, aid) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendChat(aid); }
}
function quickChat(aid, text) {
    document.getElementById('chat-input').value = text;
    sendChat(aid);
}

function pushChat(role, text, a) {
    const stream = document.getElementById('chat-stream');
    const row = document.createElement('div');
    row.className = `chat-row ${role === 'user' ? 'user' : 'bot'}`;
    const c = a ? CAT_MAP[a.cat] : null;
    const av = role === 'user'
        ? `<div class="chat-av user">${(Auth.getCurrentUser()?.name || '我').slice(0,1).toUpperCase()}</div>`
        : `<div class="chat-av" style="background:${c?.soft};color:${c?.color}"><i class="ph-fill ${a?.icon}"></i></div>`;
    row.innerHTML = `${av}<div class="chat-bubble"><div class="md">${role === 'user' ? escapeHtml(text) : mdToHtml(text)}</div></div>`;
    stream.appendChild(row);
    stream.scrollTop = stream.scrollHeight;   // 仅在聊天窗口内部滚动，不带动整页
    return row.querySelector('.md');
}

async function sendChat(aid) {
    const a = AGENTS.find(x => x.id === aid);
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    if (typeof requireLogin === 'function' && !requireLogin(null, '请先登录后使用智能体')) return;

    document.getElementById('chat-starters')?.remove();   // 发首条后收起引导问题
    pushChat('user', text, a);
    _chatHistory.push({ role: 'user', content: text });
    input.value = ''; autoGrow(input);
    const sendBtn = document.getElementById('chat-send');
    sendBtn.disabled = true;
    const stream = document.getElementById('chat-stream');

    const target = pushChat('bot', '', a);
    target.parentElement.parentElement.classList.add('cursor-blink');
    let assistantText = '';
    const runSeq = ++_chatRunSeq;
    const ownerUid = currentAuthUid();
    try {
        await callAgentAPI({
            agent: a, inputs: {}, history: _chatHistory,
            onToken: (full) => {
                if (runSeq !== _chatRunSeq || currentAuthUid() !== ownerUid) return;
                assistantText = full; target.innerHTML = mdToHtml(full); stream.scrollTop = stream.scrollHeight;
            }
        });
        if (runSeq !== _chatRunSeq || currentAuthUid() !== ownerUid) return;
        _chatHistory.push({ role: 'assistant', content: assistantText });
        if (window.DB && DB.bumpAgentUsage) DB.bumpAgentUsage(aid);   // 使用计数（用于「热门」印章）
        if (window.Analytics) Analytics.track('agent_run', {
            feature: 'agents',
            targetId: aid,
            targetName: a ? a.name : '',
            meta: { agentType: 'chat' }
        });
        updateChatActions();
    } catch (e) {
        if (runSeq !== _chatRunSeq || currentAuthUid() !== ownerUid) return;
        const last = _chatHistory[_chatHistory.length - 1];
        if (last?.role === 'user' && last.content === text) _chatHistory.pop();
        target.innerHTML = `<span style="color:var(--brand)">出错了：${e.message}</span>`;
        updateChatActions();
    }
    if (runSeq === _chatRunSeq && currentAuthUid() === ownerUid) {
        target.parentElement.parentElement.classList.remove('cursor-blink');
        sendBtn.disabled = false;
        input.focus();
    }
}

function chatTranscript(aid) {
    const a = AGENTS.find(x => x.id === aid);
    if (!_chatHistory.length) return '';
    const title = a ? a.name : '智能体对话';
    const date = new Date().toLocaleString('zh-CN', { hour12: false });
    const lines = [`# ${title}对话记录`, '', `> 保存时间：${date}`, ''];
    _chatHistory.forEach(m => {
        lines.push(`## ${m.role === 'user' ? '我' : title}`, '', m.content || '', '');
    });
    return lines.join('\n').trim();
}

function chatWorkTitle(aid) {
    const a = AGENTS.find(x => x.id === aid);
    const firstUser = _chatHistory.find(m => m.role === 'user')?.content || '';
    const topic = firstUser.replace(/\s+/g, ' ').trim().slice(0, 18);
    return topic
        ? `${a ? a.name : '智能体'}对话 · ${topic}`
        : `${a ? a.name : '智能体'}对话 · ${new Date().toLocaleDateString('zh-CN')}`;
}

function updateChatActions() {
    const actions = document.getElementById('chat-actions');
    if (!actions) return;
    actions.style.display = _chatHistory.length ? 'flex' : 'none';
}

async function saveChatToWorkbook(aid) {
    const content = chatTranscript(aid);
    if (!content) { showToast('还没有可保存的对话'); return; }
    if (typeof requireLogin === 'function' && !requireLogin(null, '请先登录后保存')) return;
    const a = AGENTS.find(x => x.id === aid);
    const user = Auth.getCurrentUser();
    if (!user) { showToast('请先登录后保存'); return; }
    const title = await confirmWorkbookTitle(chatWorkTitle(aid), a ? a.name : '智能体');
    if (!title) return;
    const btn = document.getElementById('chat-save-btn');
    const orig = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<i class="ph ph-spinner-gap ph-spin"></i> 保存中…';
    try {
        await DB.saveWork({
            uid: user.uid,
            agentId: aid,
            agentName: a ? a.name : '',
            agentType: 'chat',
            workType: 'chat',
            title,
            content
        });
        if (window.Analytics) Analytics.track('workbook_save', {
            feature: 'workspace',
            targetId: aid,
            targetName: a ? a.name : '',
            meta: { source: 'agent_chat' }
        });
        btn.classList.add('copied'); btn.innerHTML = '<i class="ph ph-check"></i> 已保存';
        showToast('对话已保存到「我的备课本」✓');
        setTimeout(() => { btn.classList.remove('copied'); btn.disabled = false; btn.innerHTML = orig; }, 1800);
    } catch (e) {
        btn.disabled = false; btn.innerHTML = orig;
        showToast('保存失败：' + (e.message || '请稍后重试'));
    }
}

function copyChatTranscript(aid) {
    const content = chatTranscript(aid);
    if (!content) return;
    navigator.clipboard.writeText(content).then(() => {
        const b = document.getElementById('chat-copy-btn');
        b.classList.add('copied'); b.innerHTML = '<i class="ph ph-check"></i> 已复制';
        showToast('对话已复制到剪贴板 ✓');
        setTimeout(() => { b.classList.remove('copied'); b.innerHTML = '<i class="ph ph-copy"></i> 复制对话'; }, 1800);
    });
}

function clearChat(aid) {
    if (_chatHistory.length && !confirm('确定清空当前对话吗？')) return;
    const a = AGENTS.find(x => x.id === aid);
    _chatHistory = [];
    const stream = document.getElementById('chat-stream');
    if (stream) {
        stream.innerHTML = '';
        pushChat('bot', a?.greeting || '你好，我可以帮你什么？', a);
    }
    updateChatActions();
}

/* ===================================================================
   智能体执行：调用同源后端代理 /api/agent
   （由 functions/api/agent.js 持模型密钥转发，密钥永不出现在前端）
   前端只负责：① 组装发给模型的消息  ② 带上登录令牌  ③ 读流式纯文本
   =================================================================== */
async function callAgentAPI({ agent, inputs, history, onToken }) {
    // ① 组装消息
    let messages;
    if (agent.type === 'chat') {
        messages = [{ role: 'system', content: agent.system },
                    ...history.map(h => ({ role: h.role, content: h.content }))];
    } else {
        messages = [{ role: 'system', content: agent.system },
                    { role: 'user', content: buildUserPrompt(agent, inputs) }];
    }

    // ② 登录令牌（后端据此校验，防止接口被盗刷）
    let idToken = '';
    try { idToken = await Auth.getIdToken(); } catch {}

    const res = await fetch('/api/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, idToken, agentId: agent.id })
    });
    if (!res.ok || !res.body) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.msg || `请求失败（${res.status}）`);
    }
    const provider = res.headers.get('X-Agent-Provider');
    const model = res.headers.get('X-Agent-Model');
    const fallbackFrom = res.headers.get('X-Agent-Fallback-From');
    const providerLabel = PROVIDER_LABELS[provider] || provider;
    const fallbackLabel = PROVIDER_LABELS[fallbackFrom] || fallbackFrom;
    const modelLabel = providerLabel && model ? `${providerLabel} · ${model}` : (providerLabel || model || '');
    if (modelLabel) setAgentModelLabel(fallbackLabel ? `${modelLabel}（由 ${fallbackLabel} 回退）` : modelLabel);

    // ③ 读取后端转发的纯文本增量流
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        full += decoder.decode(value, { stream: true });
        onToken(full);
    }
    if (!full.trim()) throw new Error('模型没有返回内容，请稍后重试');
    return full;
}

// 把表单输入拼成一段给模型的提示
function curriculumGuard(agent) {
    const config = CURRICULUM_VALIDATION[agent.id];
    if (!config) return '';
    const dimensions = [];
    if (!config.ignoreSubject && (config.subjectKey === undefined || config.subjectKey)) dimensions.push('学科');
    if (config.gradeKey === undefined || config.gradeKey) dimensions.push('年级/学段');
    dimensions.push(config.textLabel || '内容');
    const action = config.action || '继续生成';
    return `请先在内部判断${dimensions.join('、')}是否匹配现行中小学课程体系和学生认知基础；如果明显不匹配，请不要${action}，先输出“参数需要调整”，说明原因，并给出适合当前学科/学段的替代建议，或建议用户调整学科/年级。如果匹配，不要输出任何适配判断过程或通过性说明，直接进入结果正文。\n\n`;
}

function buildUserPrompt(agent, inputs) {
    const lines = agent.fields.map(f => {
        const v = inputs[f.key];
        const val = Array.isArray(v) ? v.join('、') : (v || '');
        return val ? `【${f.label}】${val}` : null;
    }).filter(Boolean);
    const guard = curriculumGuard(agent);
    return `${guard}请根据以下信息完成任务：\n\n${lines.join('\n')}\n\n请直接输出可用的结果，使用 Markdown 格式，条理清晰，贴合中小学教学实际。不要输出适配判断过程、通过性说明或地域政治表述；除非参数明显不匹配，否则不要出现“参数需要调整”。必要时使用“现行课程标准”“教材要求”“教学实际”等中性说法。`;
}

/* ---------- 工具函数 ---------- */
function mdToHtml(md) {
    try { return window.marked ? marked.parse(md, { breaks: true }) : escapeHtml(md).replace(/\n/g, '<br>'); }
    catch { return escapeHtml(md).replace(/\n/g, '<br>'); }
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
