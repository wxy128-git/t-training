    <link rel="stylesheet" href="css/style.css?v=20260610">
    <style>
        /* ===== 智能体空间 · 页面专属样式（基于全站 editorial token） ===== */
        .page-kicker { font-family: var(--font-mono); font-size: 11.5px; color: var(--brand); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; font-weight: 500; }
        .page-title { font-size: clamp(32px, 4.6vw, 52px); font-weight: 800; color: var(--ink); letter-spacing: -0.03em; line-height: 1.1; margin: 0; }
        .page-title em { font-style: italic; color: var(--brand); }
        .page-sub { font-size: 14.5px; color: var(--muted); margin-top: 14px; line-height: 1.75; max-width: 620px; }

        /* 搜索 + 筛选条 */
        .agents-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 30px 0 8px; }
        .agent-search { position: relative; flex: 1; min-width: 240px; max-width: 380px; }
        .agent-search i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--subtle); font-size: 17px; }
        .agent-search input { width: 100%; padding: 11px 16px 11px 42px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 14px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
        .agent-search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
        .agent-count { font-family: var(--font-mono); font-size: 12px; color: var(--subtle); white-space: nowrap; }

        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 36px; }
        .filter-pill { padding: 8px 16px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; cursor: pointer; font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
        .filter-pill:hover { color: var(--ink); border-color: var(--subtle); }
        .filter-pill.active { background: var(--ink); color: var(--soft); border-color: var(--ink); }
        .filter-pill .dot { width: 7px; height: 7px; border-radius: 50%; }

        /* 卡片墙 */
        .agent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        @media (max-width: 920px) { .agent-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .agent-grid { grid-template-columns: 1fr; } }

        .agent-card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; overflow: hidden; }
        .agent-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--cat-color, var(--brand)); opacity: 0; transition: opacity .18s; }
        .agent-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--cat-color, var(--line)); }
        .agent-card:hover::before { opacity: 1; }
        .agent-card-top { display: flex; align-items: center; gap: 13px; }
        .agent-ico { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 23px; flex-shrink: 0; }
        .agent-card-name { font-size: 15.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
        .agent-card-tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--cat-color, var(--muted)); }
        .agent-card-desc { font-size: 13px; line-height: 1.7; color: var(--text-soft); flex: 1; }
        .agent-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
        .agent-chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--soft-2); color: var(--muted); font-weight: 500; }
        .agent-chip.chat { background: var(--brand-soft); color: var(--brand-dark); }
        .agent-go { font-size: 13px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 5px; transition: gap .15s, color .15s; }
        .agent-card:hover .agent-go { color: var(--cat-color, var(--brand)); gap: 9px; }

        .empty-hint { grid-column: 1/-1; text-align: center; padding: 70px 20px; color: var(--subtle); }
        .empty-hint i { font-size: 46px; display: block; margin-bottom: 12px; }

        /* 分区陈列 + 精选 */
        .agent-section { margin-bottom: 38px; }
        .agent-section-head { display: flex; align-items: center; gap: 10px; padding-top: 20px; margin-bottom: 18px; border-top: 1px solid var(--line); }
        .agent-section-head.featured-head { border-top: none; padding-top: 0; }
        .agent-section-head .sec-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
        .agent-section-head .sec-title { font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
        .agent-section-head .sec-count { font-family: var(--font-mono); font-size: 11px; color: var(--subtle); background: var(--soft-2); padding: 1px 8px; border-radius: 999px; }
        .agent-section-head .sec-sub { font-size: 12.5px; color: var(--muted); }
        .featured-grid { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 980px) { .featured-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .featured-grid { grid-template-columns: 1fr; } }
        /* 精选卡片：细品牌色顶饰，强化「起点」感 */
        .featured-grid .agent-card { border-color: var(--brand-soft); }
        .featured-grid .agent-card::before { opacity: .5; background: var(--brand); }

        /* ===== 工作台 ===== */
        .ws-wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }
        .ws-top { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 22px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
        .ws-back { flex-shrink: 0; width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 19px; transition: background .15s, border-color .15s; }
        .ws-back:hover { background: var(--soft-2); border-color: var(--subtle); }
        .ws-ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 27px; flex-shrink: 0; }
        .ws-titles h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; color: var(--ink); margin: 0; letter-spacing: -0.02em; }
        .ws-titles p { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.7; max-width: 640px; }
        .ws-cat-tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; margin-bottom: 4px; }

        /* form 工作台：左输入右输出 */
        .ws-form-layout { display: grid; grid-template-columns: minmax(300px, 0.85fr) 1.15fr; gap: 26px; align-items: start; }
        @media (max-width: 860px) { .ws-form-layout { grid-template-columns: 1fr; } }
        /* 左侧参数栏吸顶跟随，避免与右侧长结果产生突兀高度差 */
        .ws-input-col { position: sticky; top: 18px; align-self: start; }
        @media (max-width: 860px) { .ws-input-col { position: static; } }

        .ws-panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; }
        .ws-panel-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 18px; }
        .ws-panel-head .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--subtle); margin-left: auto; letter-spacing: .05em; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
        .field label .req { color: var(--brand); margin-left: 2px; }
        .field label .hint { font-weight: 400; color: var(--subtle); font-size: 11.5px; margin-left: 6px; }
        .field input, .field select, .field textarea { width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--soft); font-size: 13.5px; color: var(--ink); outline: none; font-family: inherit; transition: border-color .15s, box-shadow .15s, background .15s; }
        .field textarea { resize: vertical; line-height: 1.65; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); background: var(--paper); box-shadow: 0 0 0 3px var(--brand-soft); }
        .field .chips { display: flex; flex-wrap: wrap; gap: 7px; }
        .field .chip-opt { padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); font-size: 12.5px; color: var(--text); cursor: pointer; transition: all .14s; user-select: none; }
        .field .chip-opt.on { background: var(--ink); color: var(--soft); border-color: var(--ink); }

        .ws-run { width: 100%; margin-top: 6px; padding: 13px; border: none; border-radius: var(--r-md); background: var(--brand); color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .1s; }
        .ws-run:hover { background: var(--brand-dark); }
        .ws-run:active { transform: scale(.99); }
        .ws-run:disabled { opacity: .55; cursor: not-allowed; }

        /* 输出区 */
        .ws-out-panel { min-height: 340px; display: flex; flex-direction: column; }
        .ws-edit-area { width: 100%; flex: 1; min-height: 360px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--soft); padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.7; color: var(--ink); resize: vertical; outline: none; }
        .ws-edit-area:focus { border-color: var(--brand); background: var(--paper); box-shadow: 0 0 0 3px var(--brand-soft); }
        .ws-mini-btn.active { background: var(--ink); color: var(--soft); border-color: var(--ink); }
        .ws-out-head { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
        .ws-out-head .label { font-size: 13px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 7px; }
        .ws-out-actions { margin-left: auto; display: flex; gap: 7px; }
        .ws-mini-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-sm); font-size: 12px; color: var(--text); cursor: pointer; font-family: inherit; transition: all .14s; }
        .ws-mini-btn:hover { background: var(--soft-2); color: var(--ink); }
        .ws-mini-btn.copied { color: var(--success); border-color: var(--success); }
        .ws-out-body { flex: 1; font-size: 14px; line-height: 1.85; color: var(--text); }
        .ws-out-body.placeholder { display: grid; place-items: center; text-align: center; color: var(--subtle); }
        .ws-out-body.placeholder .ph { font-size: 50px; display: block; margin-bottom: 14px; opacity: .6; }
        /* markdown 渲染样式 */
        .md h1, .md h2, .md h3 { color: var(--ink); font-weight: 700; line-height: 1.3; margin: 1.2em 0 .5em; }
        .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
        .md h2 { padding-top: .4em; border-top: 1px solid var(--line-soft); }
        .md p { margin: .6em 0; }
        .md ul, .md ol { margin: .5em 0; padding-left: 1.4em; }
        .md li { margin: .3em 0; }
        .md strong { color: var(--ink); font-weight: 700; }
        .md code { background: var(--soft-2); padding: 1px 6px; border-radius: 5px; font-family: var(--font-mono); font-size: 12.5px; }
        .md blockquote { border-left: 3px solid var(--brand); padding: 2px 14px; margin: .8em 0; color: var(--muted); background: var(--brand-soft); border-radius: 0 8px 8px 0; }
        .md table { width: 100%; border-collapse: collapse; margin: .9em 0; font-size: 13px; }
        .md th, .md td { border: 1px solid var(--line); padding: 8px 11px; text-align: left; }
        .md th { background: var(--soft-2); font-weight: 700; color: var(--ink); }
        .md hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
        .cursor-blink::after { content: "▋"; color: var(--brand); animation: blink 1s steps(2) infinite; margin-left: 1px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* chat 工作台 —— 独立聊天窗口，内部滚动（不带动整页与底部色块）*/
        .ws-chat-layout { max-width: 840px; margin: 0 auto; }
        .chat-window { display: flex; flex-direction: column; height: min(66vh, 600px); border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--soft); overflow: hidden; box-shadow: var(--shadow-sm); }
        .chat-stream { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px; padding: 22px 20px; }
        .chat-row { display: flex; gap: 12px; max-width: 88%; }
        .chat-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .chat-av { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; font-size: 17px; box-shadow: var(--shadow-xs); }
        .chat-av.user { background: var(--ink); color: var(--soft); font-size: 13px; font-weight: 700; }
        .chat-bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.8; }
        .chat-row.bot .chat-bubble { background: var(--paper); border: 1px solid var(--line); border-top-left-radius: 5px; color: var(--text); box-shadow: var(--shadow-xs); }
        .chat-row.user .chat-bubble { background: var(--ink); color: var(--soft); border-top-right-radius: 5px; }
        .chat-row.user .chat-bubble .md strong { color: #fff; }
        .chat-foot { border-top: 1px solid var(--line); background: var(--paper); padding: 12px 14px; }
        .chat-starter-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .chat-starter-chips button { padding: 7px 13px; border: 1px solid var(--line); background: var(--soft); border-radius: 999px; font-size: 12.5px; color: var(--text); cursor: pointer; font-family: inherit; transition: all .14s; }
        .chat-starter-chips button:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
        .chat-input-bar { display: flex; gap: 10px; align-items: flex-end; }
        .chat-input-bar textarea { flex: 1; border: 1px solid var(--line); border-radius: var(--r-md); outline: none; resize: none; font-family: inherit; font-size: 14px; line-height: 1.6; background: var(--soft); color: var(--ink); max-height: 120px; padding: 10px 12px; transition: border-color .15s, box-shadow .15s, background .15s; }
        .chat-input-bar textarea:focus { border-color: var(--brand); background: var(--paper); box-shadow: 0 0 0 3px var(--brand-soft); }
        .chat-send { flex-shrink: 0; width: 42px; height: 42px; border-radius: var(--r-md); border: none; background: var(--brand); color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 19px; transition: background .15s; }
        .chat-send:hover { background: var(--brand-dark); }
        .chat-send:disabled { opacity: .5; cursor: not-allowed; }

        .api-note { display: flex; align-items: flex-start; gap: 9px; margin-top: 24px; padding: 13px 16px; background: var(--soft-2); border: 1px dashed var(--line); border-radius: var(--r-md); font-size: 12.5px; color: var(--muted); line-height: 1.7; }
        .api-note i { color: var(--ochre); font-size: 16px; margin-top: 1px; flex-shrink: 0; }
    </style>
</head>

<script>
/* ===================================================================
   智能体空间 · 页面逻辑
   智能体清单数据在 js/agents-data.js（window.AGENTS / window.AGENT_CATS）
   =================================================================== */
const CATS = window.AGENT_CATS;
const AGENTS = window.AGENTS;
const CAT_MAP = Object.fromEntries(CATS.map(c => [c.key, c]));
let currentCat = 'all';

/* ---------- 卡片墙 ---------- */
function renderFilterBar() {
    const all = `<button class="filter-pill active" data-cat="all" onclick="setCat('all')">全部</button>`;
    const rest = CATS.map(c =>
        `<button class="filter-pill" data-cat="${c.key}" onclick="setCat('${c.key}')"><span class="dot" style="background:${c.color}"></span>${c.name}</button>`
    ).join('');
    document.getElementById('filter-bar').innerHTML = all + rest;
}

function setCat(key) {
    currentCat = key;
    document.querySelectorAll('#filter-bar .filter-pill').forEach(b =>
        b.classList.toggle('active', b.dataset.cat === key));
    applyFilter();
}

const FEATURED = ['lesson-design', 'quiz-gen', 'homework-grader', 'parent-comm'];
const CAT_ICONS = { plan: 'ph-blueprint', class: 'ph-chalkboard-teacher', assess: 'ph-check-square', home: 'ph-house-line', growth: 'ph-trend-up' };

function cardHtml(a) {
    const c = CAT_MAP[a.cat];
    return `<div class="agent-card" style="--cat-color:${c.color}" onclick="openAgent('${a.id}')">
        <div class="agent-card-top">
            <div class="agent-ico" style="background:${c.soft};color:${c.color}"><i class="ph-fill ${a.icon}"></i></div>
            <div>
                <div class="agent-card-name">${a.name}</div>
                <div class="agent-card-tag"><i class="ph ph-circle-fill" style="font-size:6px"></i>${c.name}</div>
            </div>
        </div>
        <div class="agent-card-desc">${a.desc}</div>
        <div class="agent-card-foot">
            <span class="agent-chip ${a.type === 'chat' ? 'chat' : ''}">${a.type === 'chat' ? '对话式' : '一键生成'}</span>
            <span class="agent-go">进入 <i class="ph ph-arrow-right"></i></span>
        </div>
    </div>`;
}

function applyFilter() {
    const q = document.getElementById('agent-search').value.trim().toLowerCase();
    if (currentCat === 'all' && !q) renderHome();
    else renderFiltered(q);
}

// 默认视图：顶部精选 + 按 5 大类分区陈列（降低「一片卡海」的认知负荷）
function renderHome() {
    document.getElementById('agent-count').textContent = `${AGENTS.length} 个智能体 · 按教学场景分类`;
    let html = '';
    const feat = FEATURED.map(id => AGENTS.find(a => a.id === id)).filter(Boolean);
    if (feat.length) {
        html += `<div class="agent-section">
            <div class="agent-section-head featured-head">
                <div class="sec-ico" style="background:var(--brand-soft);color:var(--brand)"><i class="ph-fill ph-star"></i></div>
                <span class="sec-title">常用推荐</span>
                <span class="sec-sub">不知从哪开始？先试这几个</span>
            </div>
            <div class="agent-grid featured-grid">${feat.map(cardHtml).join('')}</div>
        </div>`;
    }
    CATS.forEach(c => {
        const list = AGENTS.filter(a => a.cat === c.key);
        if (!list.length) return;
        html += `<div class="agent-section">
            <div class="agent-section-head">
                <div class="sec-ico" style="background:${c.soft};color:${c.color}"><i class="ph-fill ${CAT_ICONS[c.key] || 'ph-folder-simple'}"></i></div>
                <span class="sec-title">${c.name}</span>
                <span class="sec-count">${list.length}</span>
            </div>
            <div class="agent-grid">${list.map(cardHtml).join('')}</div>
        </div>`;
    });
    document.getElementById('agent-content').innerHTML = html;
}

// 筛选 / 搜索视图：单层网格
function renderFiltered(q) {
    const list = AGENTS.filter(a => {
        const catOk = currentCat === 'all' || a.cat === currentCat;
        const qOk = !q || (a.name + a.tagline + a.desc + (a.keywords || '')).toLowerCase().includes(q);
        return catOk && qOk;
    });
    document.getElementById('agent-count').textContent = `共 ${list.length} 个智能体`;
    const content = document.getElementById('agent-content');
    if (!list.length) {
        content.innerHTML = `<div class="agent-grid"><div class="empty-hint"><i class="ph ph-robot"></i><p>没有匹配的智能体，换个关键词试试</p></div></div>`;
        return;
    }
    content.innerHTML = `<div class="agent-grid">${list.map(cardHtml).join('')}</div>`;
}

/* ---------- 打开 / 返回 ---------- */
function openAgent(id, skipGuard) {
    const a = AGENTS.find(x => x.id === id);
    if (!a) return;
    // 登录门禁：使用智能体需要登录
    if (!skipGuard && typeof requireLogin === 'function' && !requireLogin(() => openAgent(id, true), '请先登录后使用智能体')) return;

    const c = CAT_MAP[a.cat];
    document.getElementById('view-home').style.display = 'none';
    document.getElementById('view-workspace').style.display = '';
    const ico = document.getElementById('ws-ico');
    ico.style.background = c.soft; ico.style.color = c.color;
    ico.innerHTML = `<i class="ph-fill ${a.icon}"></i>`;
    document.getElementById('ws-cat').innerHTML = `<i class="ph ph-circle-fill" style="font-size:6px;color:${c.color}"></i><span style="color:${c.color}">${c.name}</span>`;
    document.getElementById('ws-name').textContent = a.name;
    document.getElementById('ws-intro').textContent = a.intro || a.desc;

    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

    if (a.type === 'chat') buildChat(a);
    else buildForm(a);
}

function backToHome() {
    document.getElementById('view-workspace').style.display = 'none';
    document.getElementById('view-home').style.display = '';
    history.replaceState(null, '', location.pathname);
    document.title = '智能体空间 · AI 教师培训中心';
}

/* ---------- form 工作台 ---------- */
function buildForm(a) {
    const fieldsHtml = a.fields.map(f => renderField(a.id, f)).join('');
    document.getElementById('ws-body').innerHTML = `
    <div class="ws-form-layout">
        <div class="ws-panel ws-input-col">
            <div class="ws-panel-head"><i class="ph ph-sliders-horizontal"></i> 填写信息 <span class="mono">INPUT</span></div>
            <form id="agent-form" onsubmit="runForm('${a.id}'); return false;">
                ${fieldsHtml}
                <button type="submit" class="ws-run" id="run-btn"><i class="ph-fill ph-sparkle"></i> 开始生成</button>
            </form>
        </div>
        <div class="ws-panel ws-out-panel">
            <div class="ws-out-head">
                <span class="label"><i class="ph ph-file-text"></i> 生成结果</span>
                <div class="ws-out-actions" id="out-actions" style="display:none">
                    <button class="ws-mini-btn" id="edit-btn" onclick="toggleEdit()"><i class="ph ph-pencil-simple"></i> 编辑</button>
                    <button class="ws-mini-btn" id="copy-btn" onclick="copyResult()"><i class="ph ph-copy"></i> 复制</button>
                    <button class="ws-mini-btn" onclick="runForm('${a.id}')"><i class="ph ph-arrows-clockwise"></i> 重新生成</button>
                </div>
            </div>
            <div class="ws-out-body placeholder" id="out-body">
                <div><i class="ph ph-cursor-click"></i><p>填好左侧信息后点击「开始生成」<br>结果会显示在这里</p></div>
            </div>
        </div>
    </div>`;
    // 恢复 chip 多选监听
    document.querySelectorAll('#agent-form .chip-opt').forEach(ch => {
        ch.addEventListener('click', () => ch.classList.toggle('on'));
    });
}

function renderField(aid, f) {
    const req = f.required ? '<span class="req">*</span>' : '';
    const hint = f.hint ? `<span class="hint">${f.hint}</span>` : '';
    const label = `<label>${f.label}${req}${hint}</label>`;
    let control = '';
    if (f.type === 'textarea') {
        control = `<textarea name="${f.key}" rows="${f.rows || 4}" placeholder="${f.placeholder || ''}"></textarea>`;
    } else if (f.type === 'select') {
        control = `<select name="${f.key}">${f.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
    } else if (f.type === 'chips') {
        control = `<div class="chips" data-key="${f.key}">${f.options.map(o => `<span class="chip-opt">${o}</span>`).join('')}</div>`;
    } else {
        control = `<input type="${f.type || 'text'}" name="${f.key}" placeholder="${f.placeholder || ''}">`;
    }
    return `<div class="field">${label}${control}</div>`;
}

function collectInputs(a) {
    const form = document.getElementById('agent-form');
    const data = {};
    a.fields.forEach(f => {
        if (f.type === 'chips') {
            const sel = [...form.querySelectorAll(`.chips[data-key="${f.key}"] .chip-opt.on`)].map(e => e.textContent);
            data[f.key] = sel;
        } else {
            const el = form.querySelector(`[name="${f.key}"]`);
            data[f.key] = el ? el.value.trim() : '';
        }
    });
    return data;
}

let _lastResult = '';
async function runForm(aid) {
    const a = AGENTS.find(x => x.id === aid);
    if (typeof requireLogin === 'function' && !requireLogin(null, '请先登录后使用智能体')) return false;
    const inputs = collectInputs(a);
    // 必填校验
    const missing = a.fields.filter(f => f.required && (!inputs[f.key] || (Array.isArray(inputs[f.key]) && !inputs[f.key].length)));
    if (missing.length) { showToast(`请填写：${missing.map(m => m.label).join('、')}`); return false; }

    const btn = document.getElementById('run-btn');
    const body = document.getElementById('out-body');
    const actions = document.getElementById('out-actions');
    btn.disabled = true; btn.innerHTML = '<i class="ph ph-spinner-gap ph-spin"></i> 生成中…';
    actions.style.display = 'none';
    body.className = 'ws-out-body md';
    body.innerHTML = '';
    _lastResult = '';
    _editing = false;
    const editBtn = document.getElementById('edit-btn');
    if (editBtn) { editBtn.classList.remove('active'); editBtn.innerHTML = '<i class="ph ph-pencil-simple"></i> 编辑'; }

    try {
        await callAgentAPI({
            agent: a, inputs,
            onToken: (full) => { _lastResult = full; body.innerHTML = mdToHtml(full) + ' '; body.classList.add('cursor-blink'); }
        });
        body.classList.remove('cursor-blink');
        body.innerHTML = mdToHtml(_lastResult);
        actions.style.display = 'flex';
    } catch (e) {
        body.className = 'ws-out-body placeholder';
        body.innerHTML = `<div><i class="ph ph-warning"></i><p>生成失败：${e.message}</p></div>`;
    }
    btn.disabled = false; btn.innerHTML = '<i class="ph-fill ph-sparkle"></i> 开始生成';
    return false;
}

function copyResult() {
    // 编辑态下先把最新文本存回
    if (_editing) { const ta = document.getElementById('edit-area'); if (ta) _lastResult = ta.value; }
    if (!_lastResult) return;
    navigator.clipboard.writeText(_lastResult).then(() => {
        const b = document.getElementById('copy-btn');
        b.classList.add('copied'); b.innerHTML = '<i class="ph ph-check"></i> 已复制';
        showToast('已复制到剪贴板 ✓');
        setTimeout(() => { b.classList.remove('copied'); b.innerHTML = '<i class="ph ph-copy"></i> 复制'; }, 1800);
    });
}

// 编辑生成结果：渲染态 ↔ 编辑原始文本 切换
let _editing = false;
function toggleEdit() {
    const body = document.getElementById('out-body');
    const btn = document.getElementById('edit-btn');
    if (!_editing) {
        _editing = true;
        body.className = 'ws-out-body';
        body.innerHTML = `<textarea class="ws-edit-area" id="edit-area"></textarea>`;
        const ta = document.getElementById('edit-area');
        ta.value = _lastResult;
        ta.style.height = 'auto'; ta.style.height = Math.max(360, ta.scrollHeight + 8) + 'px';
        ta.focus();
        btn.classList.add('active');
        btn.innerHTML = '<i class="ph ph-check"></i> 完成';
    } else {
        const ta = document.getElementById('edit-area');
        if (ta) _lastResult = ta.value;
        _editing = false;
        body.className = 'ws-out-body md';
        body.innerHTML = mdToHtml(_lastResult);
        btn.classList.remove('active');
        btn.innerHTML = '<i class="ph ph-pencil-simple"></i> 编辑';
    }
}

/* ---------- chat 工作台 ---------- */
let _chatHistory = [];
function buildChat(a) {
    _chatHistory = [];
    const starters = (a.starters || []).map(s =>
        `<button onclick="quickChat('${a.id}', this.textContent)">${s}</button>`).join('');
    document.getElementById('ws-body').innerHTML = `
    <div class="ws-chat-layout">
        <div class="chat-window">
            <div class="chat-stream" id="chat-stream"></div>
            <div class="chat-foot">
                ${starters ? `<div class="chat-starter-chips" id="chat-starters">${starters}</div>` : ''}
                <div class="chat-input-bar">
                    <textarea id="chat-input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"
                        oninput="autoGrow(this)" onkeydown="chatKey(event,'${a.id}')"></textarea>
                    <button class="chat-send" id="chat-send" onclick="sendChat('${a.id}')"><i class="ph-fill ph-paper-plane-right"></i></button>
                </div>
            </div>
        </div>
    </div>`;
    // 智能体开场白
    pushChat('bot', a.greeting || '你好，我可以帮你什么？', a);
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
function chatKey(ev, aid) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendChat(aid); }
}
function quickChat(aid, text) {
    document.getElementById('chat-input').value = text;
    sendChat(aid);
}

function pushChat(role, text, a) {
    const stream = document.getElementById('chat-stream');
    const row = document.createElement('div');
    row.className = `chat-row ${role === 'user' ? 'user' : 'bot'}`;
    const c = a ? CAT_MAP[a.cat] : null;
    const av = role === 'user'
        ? `<div class="chat-av user">${(Auth.getCurrentUser()?.name || '我').slice(0,1).toUpperCase()}</div>`
        : `<div class="chat-av" style="background:${c?.soft};color:${c?.color}"><i class="ph-fill ${a?.icon}"></i></div>`;
    row.innerHTML = `${av}<div class="chat-bubble"><div class="md">${role === 'user' ? escapeHtml(text) : mdToHtml(text)}</div></div>`;
    stream.appendChild(row);
    stream.scrollTop = stream.scrollHeight;   // 仅在聊天窗口内部滚动，不带动整页
    return row.querySelector('.md');
}

async function sendChat(aid) {
    const a = AGENTS.find(x => x.id === aid);
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    if (typeof requireLogin === 'function' && !requireLogin(null, '请先登录后使用智能体')) return;

    document.getElementById('chat-starters')?.remove();   // 发首条后收起引导问题
    pushChat('user', text, a);
    _chatHistory.push({ role: 'user', content: text });
    input.value = ''; autoGrow(input);
    const sendBtn = document.getElementById('chat-send');
    sendBtn.disabled = true;
    const stream = document.getElementById('chat-stream');

    const target = pushChat('bot', '', a);
    target.parentElement.parentElement.classList.add('cursor-blink');
    try {
        await callAgentAPI({
            agent: a, inputs: {}, history: _chatHistory,
            onToken: (full) => { target.innerHTML = mdToHtml(full); stream.scrollTop = stream.scrollHeight; }
        });
        _chatHistory.push({ role: 'assistant', content: target.textContent });
    } catch (e) {
        target.innerHTML = `<span style="color:var(--brand)">出错了：${e.message}</span>`;
    }
    target.parentElement.parentElement.classList.remove('cursor-blink');
    sendBtn.disabled = false;
    input.focus();
}

/* ===================================================================
   智能体执行：调用同源后端代理 /api/agent
   （由 functions/api/agent.js 持 DeepSeek 密钥转发，密钥永不出现在前端）
   前端只负责：① 组装发给模型的消息  ② 带上登录令牌  ③ 读流式纯文本
   =================================================================== */
async function callAgentAPI({ agent, inputs, history, onToken }) {
    // ① 组装消息
    let messages;
    if (agent.type === 'chat') {
        messages = [{ role: 'system', content: agent.system },
                    ...history.map(h => ({ role: h.role, content: h.content }))];
    } else {
        messages = [{ role: 'system', content: agent.system },
                    { role: 'user', content: buildUserPrompt(agent, inputs) }];
    }

    // ② 登录令牌（后端据此校验，防止接口被盗刷）
    let idToken = '';
    try { idToken = await Auth.getIdToken(); } catch {}

    const res = await fetch('/api/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, idToken })
    });
    if (!res.ok || !res.body) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.msg || `请求失败（${res.status}）`);
    }

    // ③ 读取后端转发的纯文本增量流
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        full += decoder.decode(value, { stream: true });
        onToken(full);
    }
    if (!full.trim()) throw new Error('模型没有返回内容，请稍后重试');
    return full;
}

// 把表单输入拼成一段给模型的提示
function buildUserPrompt(agent, inputs) {
    const lines = agent.fields.map(f => {
        const v = inputs[f.key];
        const val = Array.isArray(v) ? v.join('、') : (v || '');
        return val ? `【${f.label}】${val}` : null;
    }).filter(Boolean);
    return `请根据以下信息完成任务：\n\n${lines.join('\n')}\n\n请直接输出可用的结果，使用 Markdown 格式，条理清晰，贴合中国大陆中小学教学实际。`;
}

/* ---------- 工具函数 ---------- */
function mdToHtml(md) {
    try { return window.marked ? marked.parse(md, { breaks: true }) : escapeHtml(md).replace(/\n/g, '<br>'); }
    catch { return escapeHtml(md).replace(/\n/g, '<br>'); }
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

/* ---------- 初始化 ---------- */
renderFilterBar();
applyFilter();
renderNav('agents');
renderFooter();

// hash 深链：直接进入某个智能体
function routeFromHash(skipGuard) {
    const id = location.hash.replace('#', '');
    if (id && AGENTS.find(a => a.id === id)) openAgent(id, skipGuard);
}
routeFromHash(true); // 首次进入不强制登录拦截（避免落地即弹窗），实际调用时再拦

// 浏览器前进/后退或手动改 hash 时响应（openAgent/backToHome 用 replaceState，不会触发本监听，避免循环）
window.addEventListener('hashchange', () => {
    if (location.hash && location.hash !== '#') routeFromHash(true);
    else if (document.getElementById('view-workspace').style.display !== 'none') backToHome();
});

onAuthReady(() => {
    renderNav('agents');
    renderFooter();
});
</script>
