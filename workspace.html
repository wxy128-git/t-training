<main class="wb-wrap" id="main-content">
    <div class="breadcrumb"><a href="/">首页</a><i class="ph ph-caret-right" aria-hidden="true"></i><span>我的备课本</span></div>
    <header class="wb-head">
        <div>
            <h1 data-site-copy-headline="heroTitle" data-site-copy-accent="heroAccent">我的<em>备课本</em></h1>
            <p data-site-copy="heroIntro">查看、筛选和导出智能体成果。</p>
        </div>
        <span class="wb-head-mark" aria-hidden="true"><i class="ph ph-notebook"></i></span>
    </header>

    <section id="login-gate" class="wb-state" aria-label="登录查看备课本">
        <i class="ph ph-lock-key" aria-hidden="true"></i>
        <h2 data-site-copy="loginPrompt">登录后即可查看你保存的备课内容</h2>
        <button class="btn-primary" onclick="showAuthModal('login')" data-site-copy="loginAction">登录查看</button>
    </section>

    <div id="wb-app" style="display:none">
        <section class="wb-library" aria-labelledby="wb-library-title">
            <h2 id="wb-library-title" class="wb-sr-only" data-site-copy="directoryTitle">成果目录</h2>
            <div class="wb-library-header">
                <div class="wb-controls" id="wb-controls">
                    <div class="wb-search-row">
                        <label class="wb-search">
                            <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                            <input id="wb-search" type="search" aria-label="搜索备课内容" autocomplete="off" placeholder="查找课题、项目或智能体" data-site-copy-placeholder="searchPlaceholder" oninput="updateWorkbookState({ q: this.value })">
                        </label>
                        <select class="wb-select" id="wb-project-filter" onchange="updateWorkbookState({ project: this.value })" aria-label="按教学项目筛选"></select>
                        <select class="wb-select" id="wb-agent-filter" onchange="updateWorkbookState({ agent: this.value })" aria-label="按智能体筛选"></select>
                    </div>
                </div>
                <div class="wb-filterbar">
                    <nav class="wb-index-tabs" aria-label="按内容类型筛选">
                        <button type="button" class="wb-index-tab active" data-type="all" onclick="setWorkType('all')" aria-pressed="true"><span data-site-copy="filterAll">全部</span><b id="wb-total-metric">0</b></button>
                        <button type="button" class="wb-index-tab" data-type="draft" onclick="setWorkType('draft')" aria-pressed="false"><span data-site-copy="filterDraft">生成文稿</span><b id="wb-draft-metric">0</b></button>
                        <button type="button" class="wb-index-tab" data-type="chat" onclick="setWorkType('chat')" aria-pressed="false"><span data-site-copy="filterChat">对话记录</span><b id="wb-chat-metric">0</b></button>
                    </nav>
                    <div class="wb-display-controls">
                        <label class="wb-sort-wrap">
                            <i class="ph ph-sort-descending" aria-hidden="true"></i>
                            <span class="wb-sr-only" data-site-copy="sortLabel">目录排序</span>
                            <select class="wb-select" id="wb-sort" onchange="updateWorkbookState({ sort: this.value })" aria-label="排序方式">
                                <option value="updated-desc" data-site-copy="sortUpdated">最近更新</option>
                                <option value="created-desc" data-site-copy="sortCreated">最近保存</option>
                                <option value="project-asc" data-site-copy="sortProject">按教学项目</option>
                                <option value="title-asc" data-site-copy="sortTitle">标题 A-Z</option>
                                <option value="agent-asc" data-site-copy="sortAgent">智能体名称</option>
                            </select>
                        </label>
                        <div class="wb-view-toggle" role="group" aria-label="切换显示方式">
                            <button type="button" data-view="list" class="active" onclick="setWorkbookView('list')" title="列表视图" aria-label="列表视图" aria-pressed="true"><i class="ph ph-list-bullets" aria-hidden="true"></i><span>列表</span></button>
                            <button type="button" data-view="cards" onclick="setWorkbookView('cards')" title="卡片视图" aria-label="卡片视图" aria-pressed="false"><i class="ph ph-squares-four" aria-hidden="true"></i><span>卡片</span></button>
                        </div>
                    </div>
                </div>
                <div class="wb-results-line">
                    <div class="wb-statline" id="wb-statline" role="status" aria-live="polite"></div>
                    <button type="button" class="wb-clear" id="wb-clear" onclick="resetWorkbookFilters()" data-site-copy="clearFilters" hidden>清除筛选</button>
                </div>
            </div>
            <div class="wb-library-content">
                <div class="wb-loading" id="wb-loading" role="status"><i class="ph ph-hourglass" aria-hidden="true"></i><span>正在读取你的备课内容…</span></div>
                <div id="wb-empty" class="wb-state">
                    <i class="ph ph-notebook" aria-hidden="true"></i>
                    <h3 data-site-copy="emptyTitle">备课本还是空的</h3>
                    <p data-site-copy="emptyHint">先完成一项教学任务，再将初稿保存到这里。</p>
                    <div class="ui-secondary-actions"><a class="ui-action-link primary" href="/agents#lesson-design">备一节课</a><a class="ui-action-link" href="/research">开始科研写作</a></div>
                </div>
                <div class="wb-filter-empty wb-state" id="wb-filter-empty">
                    <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                    <h3>没有符合条件的内容</h3>
                    <p>换个关键词，或清除筛选后再看。</p>
                    <div class="ui-secondary-actions"><button type="button" class="ui-action-link" onclick="resetWorkbookFilters()">清除筛选</button></div>
                </div>
                <div id="wb-error" class="wb-state" role="alert">
                    <i class="ph ph-cloud-slash" aria-hidden="true"></i>
                    <h3>备课本加载失败</h3>
                    <p id="wb-error-msg">请稍后重试。</p>
                    <div class="ui-secondary-actions"><button type="button" class="ui-action-link" onclick="loadWorks()"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i>重新加载</button></div>
                </div>
                <div id="wb-grid" class="wb-list" aria-label="已保存的成果"></div>
            </div>
            <footer class="wb-library-foot">
                <span><i class="ph ph-lock-simple" aria-hidden="true"></i>仅当前账号可见</span>
                <span id="wb-directory-range"></span>
            </footer>
        </section>
    </div>
</main>

<script>
let workspacePageCopy = SiteCopy.defaults('workspace');
SiteCopy.load('workspace').then(copy => {
    workspacePageCopy = SiteCopy.applyToDocument('workspace', copy);
    renderWorks();
});

let _works = [];
let _activeWorkId = null;
let _workModalReturnFocus = null;
let _workbookViewTracked = false;
let _requestedWorkOpenedFor = '';
let _wbState = { q: '', type: 'all', project: 'all', agent: 'all', sort: 'updated-desc', view: 'list' };
let _wbError = '';
let _worksLoading = false;

function fmtDate(s) { const date = new Date(s); return Number.isFinite(date.getTime()) ? date.toLocaleDateString('zh-CN', { year:'numeric', month:'short', day:'numeric' }) : '日期未知'; }
function escapeHtml(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function mdToHtml(md) { return window.SafeRender ? SafeRender.markdown(md) : escapeHtml(md).replace(/\n/g, '<br>'); }
function previewText(md) { const t = String(md || '').replace(/^#[^\n]*\n?/, '').replace(/[#*_>`!\[\]()-]/g, '').replace(/\s+/g, ' ').trim(); return t.length > 130 ? t.slice(0, 130) + '…' : t; }
function findWork(id) { return _works.find(w => w.id === id); }
function safeName(s) { return (String(s || '备课内容').replace(/[\\/:*?"<>|]/g, '_').trim() || '备课内容').slice(0, 60); }
function timeValue(s) { const n = Date.parse(s || ''); return Number.isFinite(n) ? n : 0; }
function workType(w) {
    if (w.workType) return w.workType;
    if (w.agentType === 'chat' || /对话/.test(w.title || '') || /^# .*对话记录/m.test(w.content || '')) return 'chat';
    return 'draft';
}
function workTypeLabel(w) { return workType(w) === 'chat' ? workspacePageCopy.filterChat : workspacePageCopy.filterDraft; }
function workTypeIcon(w) { return workType(w) === 'chat' ? 'ph-chats-circle' : 'ph-file-text'; }
function agentKey(w) { return w.agentId || w.agentName || 'unknown'; }
function workProjectId(w) { return w.inputs?._projectId || 'unassigned'; }
function workProjectTitle(w) { return w.inputs?._projectTitle || '未归入项目'; }

function workDirectoryState(w) {
    return { label: workTypeLabel(w), className: workType(w) };
}

function titlePart(value, max = 28) {
    const raw = Array.isArray(value) ? value.join('、') : String(value || '');
    return raw.replace(/[#*_>`\[\]（）()《》]/g, '').replace(/\s+/g, ' ').trim().slice(0, max);
}
function firstInput(inputs, keys, max) {
    for (const key of keys) {
        const val = titlePart(inputs?.[key], max);
        if (val) return val;
    }
    return '';
}
function contentHeading(content) {
    const match = String(content || '').match(/^#{1,3}\s+(.+)$/m);
    return match ? titlePart(match[1], 36) : '';
}
function isGenericWorkTitle(w) {
    const title = String(w.title || '').trim();
    const agent = String(w.agentName || '').trim();
    if (!title) return true;
    if (agent && (title === agent || title.startsWith(`${agent} ·`) || title.startsWith(`${agent}对话 ·`))) return true;
    return /^(生成结果|智能体)\s*[·-]/.test(title);
}
function inferredWorkTitle(w) {
    const inputs = w.inputs || {};
    const subject = firstInput(inputs, ['subject'], 10);
    const grade = firstInput(inputs, ['grade'], 12);
    const topic = firstInput(inputs, ['topic','point','concept','scope','theme','title','scene','name'], 30);
    const excerpt = firstInput(inputs, ['question','errors','detail','happened','text'], 28);
    const base = topic || excerpt || contentHeading(w.content);
    const id = w.agentId || '';
    const partsByAgent = {
        'lesson-design': [grade, subject, base, '教学设计'],
        'courseware-outline': [grade, subject, base, '课件大纲'],
        'micro-script': [grade, base, '微课脚本'],
        'lesson-hook': [grade, subject, base, '情境导入'],
        'layered-q': [grade, subject, base, '分层提问'],
        'concept-explainer': [grade, base, '概念解释'],
        'class-activity': [subject, base, '课堂活动'],
        'quiz-gen': [grade, subject, base, firstInput(inputs, ['types'], 18) || '练习题'],
        'homework-grader': [subject, excerpt || base, '作业批改'],
        'essay-review': [grade, base ? `《${base}》` : '', '作文评改'],
        'exam-paper': [grade, subject, base, '单元组卷'],
        'error-diagnosis': [grade, subject, excerpt || base, '错题诊断'],
        'parent-comm': [base || excerpt, '家校沟通'],
        'student-comment': [base, '学生评语'],
        'class-meeting': [grade, base, '班会方案'],
        'teaching-reflection': [base, '教学反思'],
        'lesson-observe': [base, '听评课观察']
    };
    const parts = partsByAgent[id] || [grade, subject, base || w.agentName];
    return (parts.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim() || w.title || '未命名').slice(0, 72);
}
function displayWorkTitle(w) {
    return isGenericWorkTitle(w) ? inferredWorkTitle(w) : (w.title || inferredWorkTitle(w));
}
function downloadBlob(filename, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function updateWorkbookState(next) {
    _wbState = { ..._wbState, ...next };
    renderWorks();
}

function setWorkType(type) {
    _wbState.type = type;
    renderWorks();
}

function resetWorkbookFilters() {
    _wbState = { q: '', type: 'all', project: 'all', agent: 'all', sort: 'updated-desc', view: _wbState.view || 'cards' };
    renderWorks();
}

function setWorkbookView(view) {
    _wbState.view = view === 'list' ? 'list' : 'cards';
    renderWorks();
}

function renderFilterControls() {
    const controls = document.getElementById('wb-controls');
    if (controls) controls.classList.toggle('active', _works.length > 0);
    const clear = document.getElementById('wb-clear');
    if (clear) clear.hidden = !_wbState.q && _wbState.type === 'all' && _wbState.project === 'all' && _wbState.agent === 'all';

    const q = document.getElementById('wb-search');
    if (q && q.value !== _wbState.q) q.value = _wbState.q;

    document.querySelectorAll('.wb-index-tab').forEach(btn => {
        const active = btn.dataset.type === _wbState.type;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', String(active));
    });

    const sort = document.getElementById('wb-sort');
    if (sort) sort.value = _wbState.sort;

    document.querySelectorAll('.wb-view-toggle button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === _wbState.view);
        btn.setAttribute('aria-pressed', String(btn.dataset.view === _wbState.view));
    });

    const projectSelect = document.getElementById('wb-project-filter');
    if (projectSelect) {
        const projects = [...new Map(_works.map(w => [workProjectId(w), workProjectTitle(w)]))]
            .sort((a, b) => a[1].localeCompare(b[1], 'zh-CN'));
        if (_wbState.project !== 'all' && !projects.some(([key]) => key === _wbState.project)) _wbState.project = 'all';
        projectSelect.innerHTML = `<option value="all">${escapeHtml(workspacePageCopy.projectFilterAll)}</option>` + projects
            .map(([key, name]) => `<option value="${escapeHtml(key)}">${escapeHtml(name)}</option>`).join('');
        projectSelect.value = _wbState.project;
    }

    const agentSelect = document.getElementById('wb-agent-filter');
    if (!agentSelect) return;
    const agents = [...new Map(_works.map(w => [agentKey(w), w.agentName || '未知智能体']))]
        .sort((a, b) => a[1].localeCompare(b[1], 'zh-CN'));
    if (_wbState.agent !== 'all' && !agents.some(([key]) => key === _wbState.agent)) _wbState.agent = 'all';
    agentSelect.innerHTML = `<option value="all">${escapeHtml(workspacePageCopy.agentFilterAll)}</option>` + agents
        .map(([key, name]) => `<option value="${escapeHtml(key)}">${escapeHtml(name)}</option>`)
        .join('');
    agentSelect.value = _wbState.agent;
}

function filteredWorks() {
    const q = _wbState.q.trim().toLowerCase();
    const list = _works.filter(w => {
        const typeOk = _wbState.type === 'all'
            || workType(w) === _wbState.type;
        const projectOk = _wbState.project === 'all' || workProjectId(w) === _wbState.project;
        const agentOk = _wbState.agent === 'all' || agentKey(w) === _wbState.agent;
        const haystack = `${displayWorkTitle(w)} ${w.title || ''} ${workProjectTitle(w)} ${w.agentName || ''} ${w.content || ''}`.toLowerCase();
        const qOk = !q || haystack.includes(q);
        return typeOk && projectOk && agentOk && qOk;
    });
    return list.sort((a, b) => {
        if (_wbState.sort === 'created-desc') return timeValue(b.createdAt) - timeValue(a.createdAt);
        if (_wbState.sort === 'project-asc') return workProjectTitle(a).localeCompare(workProjectTitle(b), 'zh-CN') || timeValue(b.updatedAt || b.createdAt) - timeValue(a.updatedAt || a.createdAt);
        if (_wbState.sort === 'title-asc') return displayWorkTitle(a).localeCompare(displayWorkTitle(b), 'zh-CN');
        if (_wbState.sort === 'agent-asc') return (a.agentName || '').localeCompare(b.agentName || '', 'zh-CN');
        return timeValue(b.updatedAt || b.createdAt) - timeValue(a.updatedAt || a.createdAt);
    });
}

function renderWorks() {
    const grid = document.getElementById('wb-grid');
    const empty = document.getElementById('wb-empty');
    const errorBox = document.getElementById('wb-error');
    const errorMsg = document.getElementById('wb-error-msg');
    const filterEmpty = document.getElementById('wb-filter-empty');
    const statline = document.getElementById('wb-statline');
    renderFilterControls();
    const totalMetric = document.getElementById('wb-total-metric');
    const draftMetric = document.getElementById('wb-draft-metric');
    const chatMetric = document.getElementById('wb-chat-metric');
    const directoryRange = document.getElementById('wb-directory-range');
    const loading = document.getElementById('wb-loading');
    const library = document.querySelector('.wb-library');
    library?.setAttribute('aria-busy', String(_worksLoading));
    if (totalMetric) totalMetric.textContent = _worksLoading ? '—' : _works.length;
    if (draftMetric) draftMetric.textContent = _worksLoading ? '—' : _works.filter(w => workType(w) === 'draft').length;
    if (chatMetric) chatMetric.textContent = _worksLoading ? '—' : _works.filter(w => workType(w) === 'chat').length;
    if (loading) loading.style.display = _worksLoading ? 'flex' : 'none';
    if (_worksLoading) {
        empty.style.display = 'none';
        if (errorBox) errorBox.style.display = 'none';
        if (filterEmpty) filterEmpty.style.display = 'none';
        grid.style.display = 'none';
        if (statline) statline.textContent = '';
        if (directoryRange) directoryRange.textContent = '';
        return;
    }
    if (_wbError) {
        if (errorBox) errorBox.style.display = 'grid';
        if (errorMsg) errorMsg.textContent = _wbError;
        empty.style.display = 'none';
        if (filterEmpty) filterEmpty.style.display = 'none';
        grid.style.display = 'none';
        grid.innerHTML = '';
        if (statline) statline.textContent = '';
        if (directoryRange) directoryRange.textContent = '';
        return;
    }
    if (errorBox) errorBox.style.display = 'none';
    if (!_works.length) {
        empty.style.display = 'grid';
        if (filterEmpty) filterEmpty.style.display = 'none';
        grid.style.display = 'none';
        grid.innerHTML = '';
        if (statline) statline.textContent = '';
        if (directoryRange) directoryRange.textContent = '共 0 份成果';
        return;
    }
    const list = filteredWorks();
    empty.style.display = 'none';
    if (statline) statline.textContent = list.length === _works.length ? `已保存 ${_works.length} 份成果` : `找到 ${list.length} 份成果`;
    if (directoryRange) directoryRange.textContent = list.length === _works.length ? `共 ${_works.length} 份成果` : `显示 ${list.length} / ${_works.length} 份成果`;
    if (!list.length) {
        if (filterEmpty) filterEmpty.style.display = 'grid';
        grid.style.display = 'none';
        grid.innerHTML = '';
        return;
    }
    if (filterEmpty) filterEmpty.style.display = 'none';
    grid.style.display = '';
    grid.classList.toggle('wb-list', _wbState.view === 'list');
    grid.innerHTML = list.map(w => {
        const state = workDirectoryState(w);
        const id = escapeHtml(JSON.stringify(w.id));
        const project = workProjectId(w) !== 'unassigned' ? `<span class="wb-entry-project"><i class="ph ph-folder-notch" aria-hidden="true"></i>${escapeHtml(workProjectTitle(w))}</span>` : '';
        return `
        <article class="wb-card ${state.className}">
            <button type="button" class="wb-card-open" onclick="viewWork(${id})" aria-label="打开：${escapeHtml(displayWorkTitle(w))}">
                <span class="wb-document-icon" aria-hidden="true"><i class="ph ${workTypeIcon(w)}"></i></span>
                <span class="wb-entry-copy">
                    <strong>${escapeHtml(displayWorkTitle(w))}</strong>
                    <span class="wb-entry-preview">${escapeHtml(previewText(w.content) || '打开查看完整内容')}</span>
                    <span class="wb-entry-meta"><span>${escapeHtml(state.label)}</span><span>${escapeHtml(w.agentName || '智能体')}</span>${project}</span>
                </span>
                <time class="wb-entry-date" datetime="${escapeHtml(w.updatedAt || w.createdAt || '')}">${fmtDate(w.updatedAt || w.createdAt)}</time>
            </button>
            <details class="wb-card-more">
                <summary aria-label="${escapeHtml(workspacePageCopy.moreActions)}：${escapeHtml(displayWorkTitle(w))}" title="${escapeHtml(workspacePageCopy.moreActions)}"><i class="ph ph-dots-three" aria-hidden="true"></i></summary>
                <div class="wb-card-actions">
                    <button type="button" class="primary" onclick="viewWork(${id})"><i class="ph ph-eye" aria-hidden="true"></i> 查看</button>
                    <button type="button" onclick="copyWork(${id})"><i class="ph ph-copy" aria-hidden="true"></i> 复制</button>
                    <button type="button" onclick="exportPdf(${id})"><i class="ph ph-file-pdf" aria-hidden="true"></i> 导出 PDF</button>
                    <button type="button" onclick="exportWord(${id})"><i class="ph ph-file-doc" aria-hidden="true"></i> 导出 Word</button>
                    <button type="button" onclick="exportMd(${id})"><i class="ph ph-file-text" aria-hidden="true"></i> 导出 Markdown</button>
                    <button type="button" onclick="doRename(${id})"><i class="ph ph-pencil-simple" aria-hidden="true"></i> 重命名</button>
                    <button type="button" class="danger" onclick="doDelete(${id})"><i class="ph ph-trash" aria-hidden="true"></i> 删除</button>
                </div>
            </details>
        </article>`;
    }).join('');
}

document.addEventListener('toggle', event => {
    const menu = event.target;
    if (!menu.matches?.('.wb-card-more') || !menu.open) return;
    document.querySelectorAll('.wb-card-more[open]').forEach(other => { if (other !== menu) other.open = false; });
}, true);
document.addEventListener('click', event => {
    document.querySelectorAll('.wb-card-more[open]').forEach(menu => { if (!menu.contains(event.target)) menu.open = false; });
});
document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    document.querySelectorAll('.wb-card-more[open]').forEach(menu => { menu.open = false; menu.querySelector('summary')?.focus(); });
});

let _workEditing = false;
let _workSaving = false;
let _workEditOriginal = '';
let _worksUid = null;
let _worksLoadSequence = 0;

function workEditValues() {
    return { title: document.getElementById('wb-edit-title')?.value || '', content: document.getElementById('wb-edit-content')?.value || '' };
}
function workEditDirty() { return _workEditing && JSON.stringify(workEditValues()) !== _workEditOriginal; }
function workEditKey() { return 'xylaoshiWorkbookEdit:' + encodeURIComponent(_worksUid || '') + ':' + encodeURIComponent(_activeWorkId || ''); }
function persistWorkEdit() {
    if (!_workEditing || !_worksUid || !_activeWorkId) return;
    try { localStorage.setItem(workEditKey(), JSON.stringify(workEditValues())); } catch (_) {}
}
function discardWorkEdit() { try { localStorage.removeItem(workEditKey()); } catch (_) {} }

function viewWork(id) {
    _workEditing = false;
    document.querySelector('.wb-modal-foot').hidden = false;
    document.getElementById('wb-edit-button').hidden = false;
    const w = findWork(id); if (!w) return;
    _activeWorkId = id;
    if (!document.getElementById('wb-modal').classList.contains('active')) {
        const trigger = document.activeElement;
        _workModalReturnFocus = trigger?.closest('.wb-card-more')?.querySelector('summary') || trigger;
    }
    document.querySelectorAll('.wb-card-more[open]').forEach(menu => { menu.open = false; });
    if (window.OperationsAnalytics) OperationsAnalytics.track('workbook_open', {
        feature: 'workspace',
        targetId: w.agentId || '',
        targetName: w.agentName || '',
        meta: { workType: workType(w) }
    });
    document.getElementById('wb-modal-title').textContent = displayWorkTitle(w);
    document.getElementById('wb-modal-meta').innerHTML = `
        <span class="wb-modal-chip"><i class="ph ${workTypeIcon(w)}"></i>${escapeHtml(workTypeLabel(w))}</span>
        <span class="wb-modal-chip"><i class="ph ph-folder-notch"></i>${escapeHtml(workProjectTitle(w))}</span>
        <span class="wb-modal-chip"><i class="ph ph-robot"></i>${escapeHtml(w.agentName || '智能体')}</span>
        <span class="wb-modal-chip"><i class="ph ph-calendar-blank"></i>${fmtDate(w.updatedAt || w.createdAt)}</span>`;
    document.getElementById('wb-modal-body').innerHTML = mdToHtml(w.content);
    const parent = findWork(w.inputs?._sourceWorkId);
    if (parent) {
        const link = document.createElement('button');
        link.type = 'button'; link.className = 'wb-version-link'; link.textContent = '查看上一版：' + displayWorkTitle(parent);
        link.addEventListener('click', () => viewWork(parent.id));
        document.getElementById('wb-modal-body').prepend(link);
    }
    const agentLink = document.getElementById('wb-modal-agent');
    if (agentLink && w.agentId) {
        const isResearch = w.inputs?._module === 'research' || /^research-/.test(w.agentId || '');
        agentLink.href = isResearch
            ? `/research?work=${encodeURIComponent(w.id)}#${encodeURIComponent(w.agentId)}`
            : `/agents?work=${encodeURIComponent(w.id)}#${encodeURIComponent(w.agentId)}`;
        agentLink.onclick = () => resumeWorkContext(w);
        agentLink.style.display = 'inline-flex';
    } else if (agentLink) {
        agentLink.onclick = null;
        agentLink.style.display = 'none';
    }
    const modal = document.getElementById('wb-modal');
    modal.classList.add('active');
    document.body.classList.add('workbook-work-open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => modal.querySelector('.wb-modal-head button')?.focus());
}
function resumeWorkContext(w) {
    const inputs = w?.inputs || {};
    if (!inputs._projectId && !inputs._projectTitle) return;
    window.TeachingProjects?.setActiveProject?.({
        id: inputs._projectId,
        title: inputs._projectTitle,
        subject: inputs._projectSubject || inputs.subject || '',
        grade: inputs._projectGrade || inputs.grade || '',
        topic: inputs.topic || inputs.point || inputs.concept || inputs.scope || '',
        goal: inputs.goal || '',
        classProfile: inputs.note || ''
    });
}
function editActiveWork() {
    const work = findWork(_activeWorkId);
    if (!work) return;
    _workEditing = true;
    const values = { title: displayWorkTitle(work), content: work.content || '' };
    _workEditOriginal = JSON.stringify(values);
    let recovered = null;
    try { recovered = JSON.parse(localStorage.getItem(workEditKey())); } catch (_) {}
    document.getElementById('wb-edit-button').hidden = true;
    document.querySelector('.wb-modal-foot').hidden = true;
    const body = document.getElementById('wb-modal-body');
    body.innerHTML = `<div class="wb-editor"><p>修改会保存为新版本，原稿继续保留。</p><label for="wb-edit-title">作品标题</label><input id="wb-edit-title" maxlength="160"><label for="wb-edit-content">正文（Markdown）</label><textarea id="wb-edit-content"></textarea><div class="wb-editor-actions"><button type="button" onclick="saveWorkRevision(this)">保存为新版本</button><button type="button" onclick="cancelWorkEdit()">取消编辑</button></div><p id="wb-edit-status" role="status"></p></div>`;
    document.getElementById('wb-edit-title').value = recovered?.title ?? values.title;
    document.getElementById('wb-edit-content').value = recovered?.content ?? values.content;
    body.querySelectorAll('input, textarea, select').forEach(el => el.addEventListener('input', persistWorkEdit));
    if (recovered) document.getElementById('wb-edit-status').textContent = '已恢复此账号在本机尚未保存的修改。';
    document.getElementById('wb-edit-content').focus();
}
function cancelWorkEdit() {
    if (_workSaving) return;
    if (workEditDirty() && !confirm('放弃这次尚未保存的修改？原稿不会改变。')) return;
    discardWorkEdit();
    viewWork(_activeWorkId);
}
async function saveWorkRevision(button) {
    if (_workSaving) return;
    const work = findWork(_activeWorkId);
    const user = Auth.getCurrentUser();
    if (!work || !user) return;
    const content = document.getElementById('wb-edit-content').value.trim();
    const title = document.getElementById('wb-edit-title').value.trim();
    const message = document.getElementById('wb-edit-status');
    if (!content || !title) { message.textContent = '请填写标题和正文'; return; }
    const inputs = { ...(work.inputs || {}), _sourceWorkId: work.id };
    delete inputs._reviewStatus;
    delete inputs._reviewChecks;
    delete inputs._reviewDecisions;
    _workSaving = true; button.disabled = true; message.textContent = '正在保存新版本…';
    try {
        const id = await DB.saveWork({ uid: user.uid, agentId: work.agentId, agentName: work.agentName, agentType: work.agentType || 'form', workType: work.workType || 'draft', title, content, inputs });
        if (Auth.getCurrentUser()?.uid !== user.uid) return;
        discardWorkEdit();
        _workEditing = false;
        await loadWorks();
        if (Auth.getCurrentUser()?.uid !== user.uid) return;
        if (id) viewWork(id);
        showToast('新版本已保存，原稿仍在备课本中');
    } catch (error) { message.textContent = '保存未成功：' + (error.message || '请重试，编辑内容仍保留'); }
    finally { _workSaving = false; button.disabled = false; }
}

function closeModal() {
    if (_workSaving) { showToast('正在保存，请稍候'); return; }
    if (workEditDirty() && !confirm('关闭会放弃尚未保存的修改，是否继续？')) return;
    if (_workEditing) discardWorkEdit();
    _workEditing = false;
    const modal = document.getElementById('wb-modal');
    if (!modal.classList.contains('active')) return;
    modal.classList.remove('active');
    document.body.classList.remove('workbook-work-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    _activeWorkId = null;
    if (_workModalReturnFocus && document.contains(_workModalReturnFocus)) _workModalReturnFocus.focus();
    else document.querySelector('.wb-card-open, #wb-search')?.focus();
    _workModalReturnFocus = null;
}
document.addEventListener('keydown', e => {
    const modal = document.getElementById('wb-modal');
    if (!modal.classList.contains('active')) return;
    if (e.key === 'Escape') closeModal();
    else trapModalFocus(e, modal);
});

function copyWork(id) { const w = findWork(id); if (!w) return; navigator.clipboard.writeText(w.content || '').then(() => showToast('已复制到剪贴板 ✓')); }
function exportMd(id) { const w = findWork(id); if (!w) return; downloadBlob(safeName(displayWorkTitle(w)) + '.md', new Blob([w.content || ''], { type: 'text/markdown;charset=utf-8' })); }
function copyActiveWork() { if (_activeWorkId) copyWork(_activeWorkId); }
function exportMdActive() { if (_activeWorkId) exportMd(_activeWorkId); }

// 「教学文稿」排版样式：宋体正文 + 黑体标题 + 朱红点睛 + 表格/引用 + 落款；导出 Word / PDF 共用
function docStyles() {
    return `
        @page { margin: 2.2cm 2.4cm; }
        * { box-sizing: border-box; }
        body { font-family: "Songti SC","SimSun","宋体",serif; font-size: 15px; line-height: 1.9; color: #1a1612; max-width: 800px; margin: 0 auto; padding: 28px; background: #fff; }
        .doc-meta { text-align: right; font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 11px; color: #8a7d6d; letter-spacing: .04em; border-bottom: 2px solid #c0392b; padding-bottom: 8px; margin-bottom: 26px; }
        h1 { font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 24px; font-weight: 800; color: #1a1612; line-height: 1.3; text-align: center; margin: .2em 0 .8em; }
        h2 { font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 18px; font-weight: 700; color: #1a1612; margin: 1.5em 0 .6em; padding: 2px 0 2px 12px; border-left: 4px solid #c0392b; }
        h3 { font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 15.5px; font-weight: 700; color: #9a2b1f; margin: 1.2em 0 .4em; }
        p { margin: .65em 0; text-align: justify; }
        ul, ol { margin: .5em 0; padding-left: 1.9em; }
        li { margin: .38em 0; }
        strong { color: #9a2b1f; font-weight: 700; }
        em { color: #574a3d; font-style: italic; }
        blockquote { border-left: 3px solid #c0392b; background: #fbeae6; padding: 9px 15px; margin: 1em 0; color: #574a3d; }
        table { width: 100%; border-collapse: collapse; margin: 1.1em 0; font-size: 14px; }
        th, td { border: 1px solid #d9cdb8; padding: 8px 11px; text-align: left; vertical-align: top; }
        th { background: #f3ede0; font-weight: 700; color: #1a1612; }
        hr { border: none; border-top: 1px solid #d9cdb8; margin: 1.5em 0; }
        code { font-family: "Courier New",monospace; background: #f3ede0; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        pre { background: #f3ede0; padding: 12px 15px; border-radius: 8px; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        .doc-foot { margin-top: 36px; padding-top: 14px; border-top: 1px solid #d9cdb8; text-align: right; font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 11px; color: #8a7d6d; }
        .doc-foot .seal { display: inline-block; border: 1.5px solid #c0392b; color: #c0392b; font-family: "KaiTi","STKaiti","楷体",serif; font-weight: 700; padding: 3px 9px; border-radius: 4px; margin-left: 10px; letter-spacing: 3px; }
    `;
}
function docHtml(w) {
    const meta = `AI 教师培训中心 · ${escapeHtml(w.agentName || '智能体')} · ${fmtDate(w.updatedAt || w.createdAt)}`;
    return `<!DOCTYPE html><html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${escapeHtml(displayWorkTitle(w))}</title><style>${docStyles()}</style>    <link rel="stylesheet" href="css/privacy.css?v=20260930-privacy-service">
</head><body><div class="doc-meta">${meta}</div>${mdToHtml(w.content)}<div class="doc-foot">本文由 AI 起草、教师修改定稿<span class="seal">教研甄选</span></div></body></html>`;
}
function exportWord(id) {
    const w = findWork(id); if (!w) return;
    downloadBlob(safeName(displayWorkTitle(w)) + '.doc', new Blob(['﻿', docHtml(w)], { type: 'application/msword' }));
}
function exportPdf(id) {
    const w = findWork(id); if (!w) return;
    const win = window.open('', '_blank');
    if (!win) { showToast('请允许弹出窗口后重试'); return; }
    win.document.write(docHtml(w));
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 350);
    showToast('已打开打印窗口，选「另存为 PDF」即可');
}
function exportWordActive() { if (_activeWorkId) exportWord(_activeWorkId); }
function exportPdfActive() { if (_activeWorkId) exportPdf(_activeWorkId); }

async function doRename(id) {
    const w = findWork(id); if (!w) return;
    const t = prompt('重命名为：', w.title || '');
    if (t === null) return;
    const title = t.trim(); if (!title) return;
    try { await DB.renameWork(id, title); w.title = title; w.updatedAt = new Date().toISOString(); renderWorks(); showToast('已重命名'); }
    catch (e) { showToast('重命名失败：' + (e.message || '请稍后重试')); }
}
async function doDelete(id) {
    if (!confirm('确定删除这条内容？删除后无法恢复。')) return;
    try { await DB.deleteWork(id); _works = _works.filter(w => w.id !== id); renderWorks(); showToast('已删除'); }
    catch (e) { showToast('删除失败：' + (e.message || '请稍后重试')); }
}

async function loadWorks() {
    const user = Auth.getCurrentUser();
    const sequence = ++_worksLoadSequence;
    const uid = user?.uid || null;
    if (_worksUid !== uid) {
        persistWorkEdit();
        _worksUid = uid;
        _works = [];
        _worksLoading = false;
        _workEditing = false;
        _activeWorkId = null;
        _workbookViewTracked = false;
        const modal = document.getElementById('wb-modal');
        modal.classList.remove('active');
        document.body.classList.remove('workbook-work-open');
        modal.setAttribute('aria-hidden', 'true');
        document.getElementById('wb-modal-body').replaceChildren();
        document.body.style.overflow = '';
        renderWorks();
    }
    if (!user || !Auth.canUseFeatures()) {
        _worksLoading = false;
        _wbError = '';
        document.getElementById('login-gate').style.display = 'grid';
        document.getElementById('wb-app').style.display = 'none';
        window.syncEmailGate?.();
        return;
    }
    document.getElementById('login-gate').style.display = 'none'; document.getElementById('wb-app').style.display = '';
    _worksLoading = true;
    renderWorks();
    try {
        const works = await DB.getMyWorks(user.uid);
        if (sequence !== _worksLoadSequence || Auth.getCurrentUser()?.uid !== uid) return;
        _works = works;
        _wbError = '';
    } catch (e) {
        if (sequence !== _worksLoadSequence || Auth.getCurrentUser()?.uid !== uid) return;
        _works = [];
        _wbError = e.message || '无法读取已保存的备课内容，请稍后重试。';
        console.warn('getMyWorks:', e.message);
        showToast('备课本加载失败，请稍后重试');
    }
    _worksLoading = false;
    renderWorks();
    const requestedWork = new URLSearchParams(location.search).get('work');
    if (requestedWork && !_wbError && _requestedWorkOpenedFor !== uid + ':' + requestedWork) {
        _requestedWorkOpenedFor = uid + ':' + requestedWork;
        if (findWork(requestedWork)) viewWork(requestedWork);
        else showToast('这份成果未找到，可在目录中重新查找');
    }
    if (!_workbookViewTracked && window.OperationsAnalytics) {
        _workbookViewTracked = true;
        OperationsAnalytics.track('workbook_view', { feature: 'workspace', meta: { workCount: _works.length } });
    }
}

renderNav('workspace');
renderFooter();
loadWorks();                                  // 乐观渲染（用缓存登录态）
onAuthReady(() => { renderNav('workspace'); renderFooter(); loadWorks(); });  // Firebase 就绪后校正
document.addEventListener('authRefresh', () => loadWorks());  // 在本页登录后原地加载内容（不整页刷新）
document.addEventListener('authChanged', () => loadWorks());
window.addEventListener('pagehide', persistWorkEdit);
</script>
