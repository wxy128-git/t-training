<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优秀案例展示 · AI 教师培训中心</title>
    <meta name="description" content="来自一线教师的真实 AI 教学实践案例，分享经验，共同成长。">
    <meta property="og:title" content="一线教师的 AI 教学案例">
    <meta property="og:description" content="来自一线教师的真实 AI 教学实践案例，分享经验，共同成长。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://xylaoshi.pages.dev/showcase.html">
    <meta property="og:image" content="https://xylaoshi.pages.dev/assets/og/showcase.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://xylaoshi.pages.dev/assets/og/showcase.jpg">
    <link rel="canonical" href="https://xylaoshi.pages.dev/showcase.html">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=20260604">
    <style>
        .showcase-empty { text-align:center; padding:80px 20px; color:#94a3b8; grid-column:1/-1; }
        .showcase-empty i { font-size:56px; display:block; margin-bottom:16px; }
    </style>
</head>
<body>
<div id="main-nav"></div>

<main style="max-width:1240px;margin:0 auto;padding:56px 24px 88px">
    <div class="breadcrumb"><a href="index.html">首页</a><i class="ph ph-caret-right"></i><span>案例展示</span></div>

    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px;flex-wrap:wrap;gap:14px">
        <div>
            <div style="font-family:var(--font-mono);font-size:11.5px;color:var(--brand);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:14px;font-weight:500">Showcase · 教师案例</div>
            <h1 style="font-family:var(--font-display);font-size:clamp(32px,4.6vw,52px);font-weight:800;color:var(--ink);letter-spacing:-0.03em;line-height:1.1;margin:0">一线教师的<span style="font-style:italic;color:var(--brand)">真实实践</span></h1>
            <p style="font-size:14.5px;color:var(--muted);margin-top:14px;line-height:1.7">来自全国课堂的 AI 教学案例，分享经验，共同成长。</p>
        </div>
        <button id="submit-btn" onclick="openSubmitModal()" style="display:none;align-items:center;gap:8px;padding:11px 22px;background:var(--ink);color:var(--soft);border:1px solid var(--ink);border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s,border-color 0.15s" onmouseover="this.style.background='var(--brand)';this.style.borderColor='var(--brand)'" onmouseout="this.style.background='var(--ink)';this.style.borderColor='var(--ink)'">
            <i class="ph ph-plus"></i> 提交我的案例
        </button>
    </div>

    <!-- Filter -->
    <div class="filter-bar" id="filter-bar">
        <button class="filter-pill active" onclick="setFilter('all',this)">全部</button>
        <button class="filter-pill" onclick="setFilter('teaching',this)">教学设计</button>
        <button class="filter-pill" onclick="setFilter('creation',this)">内容创作</button>
        <button class="filter-pill" onclick="setFilter('assessment',this)">评估反馈</button>
        <button class="filter-pill" onclick="setFilter('management',this)">班级管理</button>
        <button class="filter-pill" onclick="setFilter('communication',this)">家校沟通</button>
    </div>

    <div id="showcase-grid" class="cards-grid cards-grid-3" style="margin-top:24px"></div>
</main>

<!-- Submit Modal -->
<div class="modal-overlay" id="submit-modal">
    <div class="modal-box" style="max-width:600px" onclick="event.stopPropagation()">
        <div class="modal-tabs">
            <span style="font-size:16px;font-weight:700;color:var(--ink);padding:0 4px">提交教学案例</span>
            <button onclick="closeSubmitModal()" style="margin-left:auto;padding:0 16px;color:var(--subtle);background:none;border:none;cursor:pointer;font-size:22px;transition:color 0.15s" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--subtle)'">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">案例标题 *</label>
                <input type="text" id="sc-title" class="form-input" placeholder="例：用 Gamma 一键生成《唐诗三百首》专题 PPT">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div class="form-group">
                    <label class="form-label">学科/年级</label>
                    <input type="text" id="sc-subject" class="form-input" placeholder="例：初中语文 / 小学数学">
                </div>
                <div class="form-group">
                    <label class="form-label">使用工具</label>
                    <input type="text" id="sc-tool" class="form-input" placeholder="例：Gamma、快出题">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">分类 *</label>
                <select id="sc-cat" class="form-input">
                    <option value="teaching">教学设计</option>
                    <option value="creation">内容创作</option>
                    <option value="assessment">评估反馈</option>
                    <option value="management">班级管理</option>
                    <option value="communication">家校沟通</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">案例描述 *</label>
                <textarea id="sc-desc" class="form-input" rows="5" placeholder="请描述你的使用场景、具体做法、遇到的挑战以及最终效果（建议200字以上）…" style="resize:vertical"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">效果/收获</label>
                <input type="text" id="sc-result" class="form-input" placeholder="例：备课时间缩短60%，学生参与度显著提升">
            </div>
            <div id="sc-err" class="form-error" style="display:none"></div>
            <div style="margin-top:20px;display:flex;gap:8px">
                <button class="btn-primary" id="sc-submit-btn" onclick="submitShowcase()" style="flex:1">提交审核</button>
                <button onclick="closeSubmitModal()" style="flex:1;padding:12px;border:1px solid #e2e8f0;border-radius:12px;font-size:14px;cursor:pointer;background:white;font-family:inherit">取消</button>
            </div>
            <p style="font-size:12px;color:#94a3b8;margin-top:12px;text-align:center">提交后将由管理员审核，通过后公开展示</p>
        </div>
    </div>
</div>

<div id="main-footer"></div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=20260530-admin-delete"></script>
<script src="js/data.js?v=20260601-resources"></script>
<script src="js/auth.js?v=20260601-hamburger"></script>
<script>
const CAT_LABELS = {
    teaching:'教学设计', creation:'内容创作',
    assessment:'评估反馈', management:'班级管理', communication:'家校沟通'
};
const CAT_COLORS = {
    teaching: '#2d4a3a', creation: '#c0392b',
    assessment: '#2c5282', management: '#b08642', communication: '#574a3d'
};

let _allShowcases = [];
let _currentFilter = 'all';
let _currentUser = null;

function setFilter(key, btn) {
    _currentFilter = key;
    document.querySelectorAll('#filter-bar .filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderShowcases();
}

function renderShowcases() {
    const list = _currentFilter === 'all' ? _allShowcases : _allShowcases.filter(s => s.category === _currentFilter);
    const grid = document.getElementById('showcase-grid');
    if (!list.length) {
        grid.innerHTML = `<div class="showcase-empty">
            <i class="ph ph-shooting-star"></i>
            <p style="font-size:16px;font-weight:600;margin-bottom:6px">暂无案例</p>
            <p style="font-size:13px">成为第一个分享经验的教师吧！</p>
        </div>`;
        return;
    }
    const uid = _currentUser?.uid;
    grid.innerHTML = list.map(s => {
        const catColor = CAT_COLORS[s.category] || '#64748b';
        const catLabel = CAT_LABELS[s.category] || s.category;
        const date = (() => { try { return new Date(s.createdAt).toLocaleDateString('zh-CN',{year:'numeric',month:'short',day:'numeric'}); } catch{return '';} })();
        return `
        <div class="showcase-card">
            <div class="showcase-card-body">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
                    <span class="showcase-tag" style="background:${catColor}1a;color:${catColor};border:1px solid ${catColor}33">${catLabel}</span>
                    <span style="font-size:11.5px;color:var(--subtle)">${date}</span>
                </div>
                <h3 style="font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:12px;letter-spacing:-0.012em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${s.title}</h3>
                ${s.tool ? `<div style="font-size:12.5px;color:var(--brand);margin-bottom:10px;display:flex;align-items:center;gap:5px;font-weight:500"><i class="ph ph-wrench"></i>${s.tool}</div>` : ''}
                <p style="font-size:13.5px;color:var(--muted);line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden">${s.description}</p>
                ${s.result ? `<div style="margin-top:12px;padding:10px 14px;background:#ecf3ee;border:1px solid #c7d8cc;border-radius:var(--r-sm);font-size:12.5px;color:#1f4f37;display:flex;align-items:flex-start;gap:6px;line-height:1.6"><i class="ph ph-check-circle" style="flex-shrink:0;margin-top:2px"></i>${s.result}</div>` : ''}
                <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between">
                    <div style="display:flex;align-items:center;gap:10px">
                        <div style="width:30px;height:30px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--soft);flex-shrink:0;box-shadow:0 2px 5px rgba(150,43,31,0.22)">${s.authorName?.charAt(0) || '?'}</div>
                        <div>
                            <div style="font-size:12.5px;font-weight:600;color:var(--ink)">${s.authorName || '匿名教师'}</div>
                            ${s.subject ? `<div style="font-size:11.5px;color:var(--subtle);margin-top:1px">${s.subject}</div>` : ''}
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');
}

function openSubmitModal() {
    if (!_currentUser) { showAuthModal('register'); return; }
    document.getElementById('submit-modal').classList.add('active');
}

function closeSubmitModal() {
    document.getElementById('submit-modal').classList.remove('active');
    ['sc-title','sc-subject','sc-tool','sc-result'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('sc-desc').value = '';
    const err = document.getElementById('sc-err');
    err.style.display = 'none';
}

async function submitShowcase() {
    const title = document.getElementById('sc-title').value.trim();
    const desc = document.getElementById('sc-desc').value.trim();
    const err = document.getElementById('sc-err');
    const btn = document.getElementById('sc-submit-btn');
    err.style.display = 'none';
    if (!title || !desc) { err.textContent = '请填写案例标题和描述'; err.style.display = ''; return; }
    btn.disabled = true; btn.textContent = '提交中…';
    try {
        await DB.submitShowcase(_currentUser.uid, _currentUser.name, {
            title,
            description: desc,
            subject: document.getElementById('sc-subject').value.trim(),
            tool: document.getElementById('sc-tool').value.trim(),
            result: document.getElementById('sc-result').value.trim(),
            category: document.getElementById('sc-cat').value
        });
        closeSubmitModal();
        showToast('案例已提交，等待管理员审核');
    } catch(e) {
        err.textContent = '提交失败：' + e.message;
        err.style.display = '';
    }
    btn.disabled = false; btn.textContent = '提交审核';
}

document.getElementById('submit-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('submit-modal')) closeSubmitModal();
});

renderNav('showcase');
renderFooter();

// Load showcases immediately
DB.getShowcases('approved').then(list => {
    _allShowcases = list;
    renderShowcases();
});

onAuthReady((user) => {
    _currentUser = user;
    renderNav('showcase');
    renderFooter();
    if (user) document.getElementById('submit-btn').style.display = 'flex';
    if (_allShowcases.length) renderShowcases(); // re-render for like state
});
</script>
<script src="js/assistant.js"></script>
</body>
</html>
