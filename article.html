<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 · AI 教师培训中心</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .article-page-cover {
            width: 100%; height: 280px;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; position: relative; overflow: hidden;
            border-radius: 20px; margin-bottom: 36px;
        }
        .article-page-cover::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.25));
        }
        @media(max-width:640px){ .article-page-cover{ height: 180px; font-size: 56px; } }
    </style>
</head>
<body>
<div id="main-nav"></div>

<main style="max-width:800px;margin:0 auto;padding:40px 16px 80px">
    <div class="breadcrumb">
        <a href="index.html">首页</a>
        <i class="ph ph-caret-right"></i>
        <a href="articles.html">精选文章</a>
        <i class="ph ph-caret-right"></i>
        <span id="bc-title">文章详情</span>
    </div>

    <!-- Loading state -->
    <div id="article-loading" style="padding:60px 20px;text-align:center;color:#94a3b8">
        <div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#4F46E5;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px"></div>
        <p>正在加载文章…</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <!-- Article content -->
    <article id="article-body" style="display:none">
        <div id="article-cover" class="article-page-cover"></div>

        <!-- Header -->
        <div style="margin-bottom:32px">
            <div id="article-cat" style="margin-bottom:12px"></div>
            <h1 id="article-title" style="font-size:1.9rem;font-weight:800;color:#0f172a;line-height:1.4;margin-bottom:16px"></h1>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 0;border-top:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9">
                <div style="display:flex;align-items:center;gap:8px">
                    <div id="author-avatar" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white"></div>
                    <div>
                        <div id="author-name" style="font-size:13px;font-weight:600;color:#374151"></div>
                        <div id="article-date" style="font-size:11px;color:#94a3b8;margin-top:1px"></div>
                    </div>
                </div>
                <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
                    <span id="read-count" style="font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:4px"></span>
                    <a href="articles.html" style="font-size:12px;color:#4F46E5;display:flex;align-items:center;gap:4px;text-decoration:none;border:1px solid #c7d2fe;padding:5px 12px;border-radius:8px">
                        <i class="ph ph-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div id="article-content" class="prose"></div>

        <!-- Footer actions -->
        <div style="margin-top:48px;padding-top:24px;border-top:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <a href="articles.html" style="display:flex;align-items:center;gap:6px;font-size:14px;color:#4F46E5;font-weight:500;text-decoration:none">
                <i class="ph ph-arrow-left"></i> 返回文章列表
            </a>
            <button onclick="copyPageUrl()" style="display:flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid #e2e8f0;border-radius:10px;background:white;font-size:13px;color:#64748b;cursor:pointer;font-family:inherit;transition:all 0.15s" onmouseover="this.style.borderColor='#c7d2fe';this.style.color='#4F46E5'" onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#64748b'">
                <i class="ph ph-link"></i> 复制链接
            </button>
        </div>
    </article>

    <!-- Error state -->
    <div id="article-error" style="display:none;text-align:center;padding:80px 20px;color:#94a3b8">
        <i class="ph ph-file-x" style="font-size:56px;display:block;margin-bottom:16px"></i>
        <p style="font-size:16px;font-weight:600;margin-bottom:8px">文章不存在或已删除</p>
        <a href="articles.html" style="font-size:14px;color:#4F46E5">← 返回文章列表</a>
    </div>
</main>

<div id="main-footer"></div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
const CAT_CONFIG = {
    learning: { label:'学习指南', color:'#4F46E5', bg:'#EEF2FF' },
    tools:    { label:'工具推荐', color:'#10B981', bg:'#F0FDF4' },
    case:     { label:'教学案例', color:'#F59E0B', bg:'#FFFBEB' },
    tips:     { label:'实战技巧', color:'#EC4899', bg:'#FDF2F8' },
    news:     { label:'行业动态', color:'#3B82F6', bg:'#EFF6FF' },
    other:    { label:'其他',     color:'#64748b', bg:'#F8FAFC' }
};

const COVER_GRADIENTS = [
    'linear-gradient(135deg,#4F46E5,#7C3AED)',
    'linear-gradient(135deg,#10B981,#0D9488)',
    'linear-gradient(135deg,#F59E0B,#EF4444)',
    'linear-gradient(135deg,#3B82F6,#4F46E5)',
    'linear-gradient(135deg,#EC4899,#8B5CF6)',
    'linear-gradient(135deg,#06B6D4,#3B82F6)'
];

function copyPageUrl() {
    navigator.clipboard.writeText(location.href).then(() => showToast('链接已复制'));
}

// Get article ID from URL
const urlParams = new URLSearchParams(location.search);
const articleId = urlParams.get('id');

renderNav('articles');
renderFooter();

async function loadArticle() {
    if (!articleId) {
        document.getElementById('article-loading').style.display = 'none';
        document.getElementById('article-error').style.display = '';
        return;
    }

    const article = await DB.getArticle(articleId);

    document.getElementById('article-loading').style.display = 'none';

    if (!article || article.status !== 'published') {
        document.getElementById('article-error').style.display = '';
        return;
    }

    // Update page title
    document.title = article.title + ' · AI 教师培训中心';
    document.getElementById('bc-title').textContent = article.title.length > 20 ? article.title.slice(0, 20) + '…' : article.title;

    // Cover
    const gradient = article.coverColor || COVER_GRADIENTS[Math.abs(articleId.charCodeAt(0)) % COVER_GRADIENTS.length];
    const emoji = article.coverEmoji || '📝';
    document.getElementById('article-cover').style.background = gradient;
    document.getElementById('article-cover').innerHTML = `<span style="position:relative;z-index:1">${emoji}</span>`;

    // Category tag
    const cat = CAT_CONFIG[article.category] || CAT_CONFIG.other;
    document.getElementById('article-cat').innerHTML = `<span style="display:inline-flex;align-items:center;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;background:${cat.bg};color:${cat.color}">${cat.label}</span>`;

    // Title & meta
    document.getElementById('article-title').textContent = article.title;
    const authorName = article.author || '编辑部';
    document.getElementById('author-avatar').textContent = authorName.charAt(0);
    document.getElementById('author-name').textContent = authorName;
    const date = (() => { try { return new Date(article.publishedAt).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}); } catch{return '';} })();
    document.getElementById('article-date').textContent = date;
    if (article.readCount) {
        document.getElementById('read-count').innerHTML = `<i class="ph ph-eye"></i>${article.readCount} 次阅读`;
    }

    // Content — render markdown
    if (article.content) {
        marked.setOptions({ breaks: true, gfm: true });
        document.getElementById('article-content').innerHTML = marked.parse(article.content);
    } else if (article.type === 'external' && article.externalUrl) {
        document.getElementById('article-content').innerHTML = `
            <div style="text-align:center;padding:40px 20px;background:#f8fafc;border-radius:16px">
                <i class="ph ph-arrow-up-right" style="font-size:40px;color:#4F46E5;display:block;margin-bottom:12px"></i>
                <p style="font-size:15px;color:#374151;margin-bottom:20px">此文章来自外部链接，点击下方按钮跳转阅读原文</p>
                <a href="${article.externalUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:white;font-size:14px;font-weight:600;border-radius:12px;text-decoration:none">
                    阅读原文 <i class="ph ph-arrow-up-right"></i>
                </a>
            </div>`;
    }

    // Show article
    document.getElementById('article-body').style.display = '';
}

loadArticle();

onAuthReady((user) => {
    renderNav('articles');
    renderFooter();
});
</script>
<script src="js/assistant.js"></script>
</body>
</html>
