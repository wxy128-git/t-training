<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>if(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true)document.documentElement.classList.add('pwa-app-mode');</script>
    <meta name="theme-color" content="#17212b">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/css/pwa.css?v=20260822-phase1">
    <title>当前离线 · AI 教师培训中心</title>
    <style>
        * { box-sizing: border-box; }
        html { color-scheme: light; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f6f8;
            color: #3d4a57;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        main {
            width: min(100%, 580px);
            padding: clamp(28px, 6vw, 48px);
            border: 1px solid #d7e0e6;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 14px 40px -34px rgba(23, 33, 43, .5);
        }
        .state {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            color: #a76f18;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .04em;
        }
        .state::before {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: currentColor;
            content: "";
            box-shadow: 0 0 0 4px #fbf2df;
        }
        h1 { margin: 0 0 14px; color: #17212b; font-size: clamp(28px, 7vw, 40px); line-height: 1.18; }
        p { margin: 0; font-size: 16px; line-height: 1.8; }
        .note {
            margin-top: 24px;
            padding: 14px 16px;
            border-left: 3px solid #245b78;
            background: #e7f0f5;
            color: #24313d;
            font-size: 14px;
            line-height: 1.7;
        }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
        button, a {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            border-radius: 9px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        button { border: 1px solid #245b78; background: #245b78; color: #fff; }
        a { border: 1px solid #bdcbd4; background: #fff; color: #17212b; }
        button:focus-visible, a:focus-visible { outline: 3px solid rgba(36, 91, 120, .3); outline-offset: 3px; }
        #network-state { margin-top: 18px; color: #667482; font-size: 13px; }
    </style>
</head>
<body>
<main>
    <div class="state">离线模式</div>
    <h1>暂时无法连接网络</h1>
    <p>你仍可返回查看已经缓存的页面；登录、同步、AI 生成和媒体播放需要恢复网络后使用。</p>
    <div class="note">为保护教师数据，本应用不会把登录凭证、备课本内容或智能体接口响应写入离线缓存。</div>
    <div class="actions">
        <button type="button" id="retry-button">重新连接</button>
        <a href="/">返回首页</a>
    </div>
    <div id="network-state" role="status" aria-live="polite">正在检查网络状态…</div>
</main>
<script>
    const state = document.getElementById('network-state');
    const updateState = () => {
        state.textContent = navigator.onLine ? '网络已恢复，可以重新连接。' : '设备仍处于离线状态。';
    };
    document.getElementById('retry-button').addEventListener('click', () => location.reload());
    window.addEventListener('online', updateState);
    window.addEventListener('offline', updateState);
    updateState();
</script>
<script src="/js/pwa.js?v=20260822-phase1"></script>
</body>
</html>
