    <style>
        .tt-shell { max-width: 1280px; margin: 0 auto; padding: 42px 24px 88px; }
        .tt-hero { display: grid; grid-template-columns: minmax(0,1fr) minmax(280px,360px); gap: 30px; align-items: end; padding: 8px 0 28px; margin-bottom: 18px; border-bottom: 2px solid var(--ink); }
        .tt-kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); font-weight: 700; margin-bottom: 10px; }
        .tt-title { font-size: clamp(34px, 4.2vw, 52px); line-height: 1.02; font-weight: 850; color: var(--ink); letter-spacing: -.025em; margin: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .tt-title em { color: var(--brand); font-style: normal; }
        .tt-seal { font-family: "STKaiti","Kaiti SC","KaiTi","STSong","Songti SC",serif; display: inline-flex; align-items: center; justify-content: center; padding: 5px 10px; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #fff; background: #c8402e; border-radius: 5px; transform: rotate(-6deg); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.5), inset 0 0 0 3px #c8402e; }
        .tt-sub { font-size: 15px; color: var(--text); margin-top: 15px; max-width: 42em; line-height: 1.78; }
        .tt-brief { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
        .tt-brief span { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: rgba(255,255,255,.58); color: var(--text-soft); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 650; }
        .tt-brief i { color: var(--brand); font-size: 14px; }
        .tt-search-card { border: 1px solid var(--line); border-radius: 16px; background: var(--paper); padding: 16px; box-shadow: 0 12px 30px -26px rgba(26,22,18,.42); }
        .tt-search-label { font-size: 12px; font-weight: 750; color: var(--ink); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .tt-search-label small { font-family: var(--font-mono); color: var(--muted); font-weight: 500; }
        .tt-search { position: relative; }
        .tt-search i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .tt-search input { width: 100%; padding: 12px 14px 12px 40px; border: 1px solid var(--line); border-radius: 11px; font-size: 13.5px; font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s, background .15s; background: var(--soft); color: var(--ink); }
        .tt-search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: #fff; }
        .tt-filter-panel { display: grid; gap: 12px; margin: 20px 0 22px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.45); }
        .tt-filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .tt-filter-title { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; min-width: 58px; }
        .tt-filter-panel .filter-bar { margin: 0; gap: 7px; }
        .tt-filter-panel .filter-pill { padding: 7px 12px; font-size: 12.5px; background: var(--paper); }
        .tt-filter-panel .filter-pill.active { background: var(--ink); border-color: var(--ink); color: var(--soft); }
        .tt-count-line { font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); margin: 0 0 18px; }
        #tools-grid, #tools-grouped .cards-grid { grid-template-columns: repeat(auto-fit, minmax(224px, 268px)); justify-content: start; }
        .tt-section { margin-bottom: 50px; --cat: var(--brand); }
        .tt-section-head { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 0 0 13px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
        .tt-section-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--cat); font-size: 18px; box-shadow: 0 10px 20px -16px var(--cat); }
        .tt-section-title { margin: 0; font-size: 1.16rem; font-weight: 850; color: var(--ink); letter-spacing: -.01em; }
        .tt-section-desc { margin-top: 3px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
        .tt-section-count { font-family: var(--font-mono); color: var(--muted); font-size: 12px; white-space: nowrap; }
        .tt-tool-card { min-height: 254px; padding: 20px; cursor: pointer; overflow: hidden; }
        .tt-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .tt-tool-name { font-size: 15px; font-weight: 850; color: var(--ink); line-height: 1.3; margin-bottom: 7px; }
        .tt-tool-desc { font-size: 12.8px; color: var(--text-soft); line-height: 1.66; flex: 1; }
        .tt-fit { display: flex; gap: 6px; align-items: flex-start; margin-top: 12px; padding: 9px 10px; border-radius: 10px; background: var(--soft); color: var(--text); font-size: 11.8px; line-height: 1.55; }
        .tt-fit i { color: var(--brand); font-size: 13px; margin-top: 2px; }
        .tool-card-go { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--muted); transition: color .15s, gap .15s; }
        .tool-card:hover .tool-card-go { color: var(--brand); gap: 8px; }
        .tool-card:hover .tool-card-arrow { background: var(--brand); border-color: var(--brand); color: #fff; }
        .tt-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
        .tt-tag { font-size: 10.5px; font-weight: 650; padding: 2px 7px; border-radius: 6px; line-height: 1.55; }
        .tt-free { background: #e7f3ec; color: #2d6a4f; }
        .tt-neutral { background: var(--soft-2); color: var(--text-soft); }
        .tt-paid { background: var(--soft-2); color: var(--muted); }
        .tt-cn { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; }
        .tt-os { background: #e7edf6; color: #2c5282; }
        .tt-card-foot { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .tt-source-note { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
        @media (max-width: 820px) {
            .tt-shell { padding: 34px 18px 72px; }
            .tt-hero { grid-template-columns: 1fr; gap: 20px; }
            .tt-section-head { grid-template-columns: 34px minmax(0,1fr); }
            .tt-section-count { grid-column: 2; }
        }
        @media (max-width: 600px) {
            #tools-grid, #tools-grouped .cards-grid { grid-template-columns: 1fr; }
            .tt-filter-title { width: 100%; }
            .tt-title { font-size: 34px; }
        }
    </style>
</head>
<body>
<div id="main-nav"></div>

<main class="tt-shell" id="main-content">
    <div class="breadcrumb"><a href="/">首页</a><i class="ph ph-caret-right"></i><span>AI资源精选</span></div>

    <div class="tt-hero">
        <div>
            <div class="tt-kicker">AI · TOOLBOX</div>
            <h1 class="tt-title">AI 资源<em>精选</em> <span class="tt-seal">甄选</span></h1>
            <p class="tt-sub">把教师常用的第三方 AI 产品按真实教学任务重新整理：先看要解决什么问题，再判断免费、中文、海外服务等使用条件。</p>
            <div class="tt-brief">
                <span><i class="ph ph-compass"></i> 按教学任务选择</span>
                <span><i class="ph ph-tag"></i> 标注使用门槛</span>
                <span><i class="ph ph-arrow-square-out"></i> 外部官网直达</span>
            </div>
        </div>
        <div class="tt-search-card">
            <div class="tt-search-label"><span>快速查找</span><small>TOOL INDEX</small></div>
            <div class="tt-search">
                <i class="ph ph-magnifying-glass"></i>
                <input id="search" type="text" placeholder="搜索工具名称、用途或标签…" oninput="renderTools()">
            </div>
        </div>
    </div>

    <div class="tt-filter-panel">
        <div class="tt-filter-row">
            <span class="tt-filter-title">任务</span>
            <div class="filter-bar" id="filter-bar"></div>
        </div>
        <div class="tt-filter-row">
            <span class="tt-filter-title">条件</span>
            <div class="filter-bar" id="tag-filter-bar"></div>
        </div>
    </div>

    <div class="tt-count-line" id="count-label"></div>

    <!-- 默认「全部」按分类分组陈列；搜索或选具体分类时切换到下面的单层网格 -->
    <div id="tools-grouped"></div>
    <div class="cards-grid cards-grid-4" id="tools-grid" style="display:none"></div>

    <div id="empty-state" style="display:none;text-align:center;padding:60px 20px;color:var(--muted)">
        <i class="ph ph-magnifying-glass" style="font-size:48px;display:block;margin-bottom:12px"></i>
        <p style="font-size:15px;font-weight:500">没有找到匹配的工具</p>
        <p style="font-size:13px;margin-top:4px">换个关键词试试</p>
    </div>
</main>

<div id="main-footer"></div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/safe-render.js?v=20260719-security"></script>
<script src="js/firebase-config.js?v=20260718-adminemail"></script>
<script src="js/data.js?v=20260719-contentproxy"></script>
<script src="js/auth.js?v=20260719-securityreset"></script>
<script src="js/analytics.js?v=20260707-analytics"></script>
<script>
// 按「老师要做什么」重分类（2026-06）
const CAT_ORDER = ['plan','make','media','platform','more'];
const CAT_LABELS = { plan:'备课·出题·检索', make:'课件·演示·动画', media:'图像·音视频·数字人', platform:'教研·AI 平台', more:'更多工具' };
const CAT_DESCS = {
    plan:'从检索资料、整理提示词到生成题目，适合备课前半段的准备工作。',
    make:'把文本内容转成课件、演示稿、课堂动画或教学脚本。',
    media:'生成图片、视频、音乐、数字人等多模态教学素材。',
    platform:'搭建智能体、组织教研流程，或做课堂观察与评价。',
    more:'暂未归入固定任务线的工具，使用前先确认价格和适配场景。'
};
const CAT_ICONS = { plan:'ph-magnifying-glass', make:'ph-presentation-chart', media:'ph-images-square', platform:'ph-robot', more:'ph-dots-three-outline' };
const CAT_COLORS = { plan:'#2d6a4f', make:'#2c5282', media:'#a23a3a', platform:'#6a4a6b', more:'#8d8071' };
const CAT_FITS = {
    plan:'备课前先找资料、拆知识点、出练习时使用。',
    make:'已有教学内容，需要转成可展示素材时使用。',
    media:'课堂需要图片、视频、音频或数字人素材时使用。',
    platform:'需要组织工作流、搭建智能体或进行教研评价时使用。',
    more:'适合补充探索，使用前先做小范围测试。'
};
const TAG_FILTERS = ['免费','部分免费','中文','海外'];

// 工具元数据（按工具名）：cat=新分类 / tags=小标签。标签为先填的默认值，需核对。
const TOOL_META = {
    'PrompterHub':   { cat:'plan', tags:['免费','中文'] },
    'Prompt123':     { cat:'plan', tags:['免费','中文'] },
    '快出题':         { cat:'plan', tags:['部分免费','中文'] },
    '秘塔搜索':       { cat:'plan', tags:['免费','中文'] },
    'AI好记':         { cat:'plan', tags:['部分免费','中文'] },
    'Gamma':         { cat:'make', tags:['部分免费','海外'] },
    '讯飞智文':       { cat:'make', tags:['部分免费','中文'] },
    '飞象老师':       { cat:'make', tags:['部分免费','中文'] },
    'anygen.io':     { cat:'media', tags:['部分免费','中文'] },
    'Nano Banana':   { cat:'media', tags:['免费','海外'] },
    '即梦AI':         { cat:'media', tags:['免费','中文'] },
    '海绵音乐':       { cat:'media', tags:['部分免费','中文'] },
    '可灵AI':         { cat:'media', tags:['部分免费','中文'] },
    '飞影数字人':     { cat:'media', tags:['部分免费','中文'] },
    '棒棒糖AI听评课': { cat:'platform', tags:['部分免费','中文'] },
    'Coze':          { cat:'platform', tags:['免费','中文'] },
    'Flowin':        { cat:'platform', tags:['部分免费','中文'] },
    'WorkBuddy':     { cat:'platform', tags:['部分免费','中文'] },
    'Trae':          { cat:'platform', tags:['免费','中文'] }
};
const TAG_CLASS = { '免费':'tt-free', '部分免费':'tt-neutral', '付费':'tt-paid', '中文':'tt-cn', '海外':'tt-os' };

// 把工具的分类归一到新方案 + 附上标签（未登记的工具落入「更多工具」）
function applyMeta(list) {
    return (list || []).map(t => {
        const m = TOOL_META[t.name] || {};
        const category = m.cat || 'more';
        return Object.assign({}, t, { category, _tags: m.tags || [], _fit: m.fit || CAT_FITS[category] });
    });
}

let currentCat = 'all';
let currentTag = 'all';
let _allTools = [];
function esc(s) { return SafeRender.escape(s); }

// 筛选栏按「实际有工具的分类」动态生成（修掉以前漏列的分类）
function buildFilterBar() {
    const present = CAT_ORDER.filter(k => _allTools.some(t => t.category === k));
    const cats = [{ key:'all', label:'全部' }, ...present.map(k => ({ key:k, label:CAT_LABELS[k] }))];
    document.getElementById('filter-bar').innerHTML = cats.map(c =>
        `<button class="filter-pill${c.key===currentCat?' active':''}" onclick="setCat('${c.key}')">${c.label}</button>`
    ).join('');
    document.getElementById('tag-filter-bar').innerHTML = [{ key:'all', label:'全部条件' }, ...TAG_FILTERS.map(t => ({ key:t, label:t }))].map(c =>
        `<button class="filter-pill${c.key===currentTag?' active':''}" onclick="setTag('${c.key}')">${c.label}</button>`
    ).join('');
}

function setCat(key) {
    currentCat = key;
    buildFilterBar();
    renderTools();
}

function setTag(key) {
    currentTag = key;
    buildFilterBar();
    renderTools();
}

function toolCardHTML(t) {
    const tags = (t._tags || []).map(tg => `<span class="tt-tag ${TAG_CLASS[tg] || 'tt-neutral'}">${tg}</span>`).join('');
    const tagRow = tags ? `<div class="tt-tags">${tags}</div>` : '';
    const safeToolUrl = SafeRender.safeUrl(t.url);
    if (!safeToolUrl) return '';
    return `
        <a href="${esc(safeToolUrl)}" target="_blank" rel="noopener noreferrer" class="card tool-card tt-tool-card" style="display:flex;flex-direction:column;position:relative">
            <div class="tt-card-top">
                <div class="tool-card-icon ${SafeRender.classNames(t.bg)} ${SafeRender.classNames(t.color)}"><i class="ph-fill ${SafeRender.classNames(t.icon, 'ph-toolbox')}"></i></div>
                <div class="tool-card-arrow"><i class="ph-bold ph-arrow-up-right" style="font-size:11px"></i></div>
            </div>
            <div class="tt-tool-name">${esc(t.name)}</div>
            <div class="tt-tool-desc">${esc(t.desc)}</div>
            <div class="tt-fit"><i class="ph ph-check-circle"></i><span>${esc(t._fit)}</span></div>
            ${tagRow}
            <div class="tt-card-foot">
                <span class="tt-source-note">外部工具</span>
                <span class="tool-card-go">前往官网 <i class="ph-bold ph-arrow-right" style="font-size:11px"></i></span>
            </div>
        </a>`;
}

function renderTools() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const grid = document.getElementById('tools-grid');
    const grouped = document.getElementById('tools-grouped');

    // 搜索 或 选了具体分类 → 单层网格
    if (q || currentCat !== 'all') {
        const filtered = _allTools.filter(t => {
            const matchCat = currentCat === 'all' || t.category === currentCat;
            const matchTag = currentTag === 'all' || (t._tags || []).includes(currentTag);
            const text = `${t.name || ''} ${t.desc || ''} ${(t._tags || []).join(' ')} ${t._fit || ''}`.toLowerCase();
            const matchQ = !q || text.includes(q);
            return matchCat && matchTag && matchQ;
        });
        document.getElementById('count-label').textContent = `当前显示 ${filtered.length} / ${_allTools.length} 个工具`;
        document.getElementById('empty-state').style.display = filtered.length ? 'none' : 'block';
        grouped.style.display = 'none'; grouped.innerHTML = '';
        grid.style.display = ''; grid.innerHTML = filtered.map(toolCardHTML).join('');
        return;
    }

    // 默认「全部」且无搜索 → 按分类分组陈列，缓解一屏展示全部工具的选择过载
    const visibleCount = _allTools.filter(t => currentTag === 'all' || (t._tags || []).includes(currentTag)).length;
    document.getElementById('count-label').textContent = currentTag === 'all'
        ? `共 ${_allTools.length} 个工具，按教学任务分组`
        : `当前显示 ${visibleCount} / ${_allTools.length} 个工具，按教学任务分组`;
    document.getElementById('empty-state').style.display = visibleCount ? 'none' : 'block';
    grid.style.display = 'none'; grid.innerHTML = '';
    const known = new Set(CAT_ORDER);
    const present = CAT_ORDER.filter(k => _allTools.some(t => t.category === k));
    const others = [...new Set(_allTools.map(t => t.category).filter(c => !known.has(c)))];
    grouped.style.display = visibleCount ? '' : 'none';
    grouped.innerHTML = [...present, ...others].map(cat => {
        const items = _allTools.filter(t => t.category === cat && (currentTag === 'all' || (t._tags || []).includes(currentTag)));
        if (!items.length) return '';
        const catColor = CAT_COLORS[cat] || CAT_COLORS.more;
        return `
        <section class="tt-section" style="--cat:${catColor}">
            <div class="tt-section-head">
                <div class="tt-section-icon"><i class="ph ${CAT_ICONS[cat] || CAT_ICONS.more}"></i></div>
                <div>
                    <h2 class="tt-section-title">${CAT_LABELS[cat] || '其他'}</h2>
                    <div class="tt-section-desc">${CAT_DESCS[cat] || CAT_DESCS.more}</div>
                </div>
                <span class="tt-section-count">${items.length} 个</span>
            </div>
            <div class="cards-grid cards-grid-4">${items.map(toolCardHTML).join('')}</div>
        </section>`;
    }).join('');
}

renderNav('tools');
renderFooter();

// 先用完整的本地清单避免白屏；同源接口或 Firestore 数据到了再替换。
_allTools = applyMeta((typeof DEFAULT_TOOLS !== 'undefined') ? JSON.parse(JSON.stringify(DEFAULT_TOOLS)) : []);
buildFilterBar();
renderTools();
DB.getTools().then(tools => {
    if (Array.isArray(tools) && tools.length) {
        _allTools = applyMeta(tools);
        buildFilterBar();
        renderTools();
    }
}).catch(() => {
    // 保留本地默认工具，避免外部数据暂时不可用时资源页变空。
});

// Re-render nav after auth resolves
onAuthReady((user) => {
    renderNav('tools');
    renderFooter();
});
</script>
<script src="js/pwa.js?v=20260715-pwa2"></script>
<script src="js/assistant.js?v=20260719-a11ysecurity"></script>
</body>
