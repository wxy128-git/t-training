<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的备课本 · AI 教师培训中心</title>
    <meta name="description" content="保存、管理你在智能体空间生成的备课内容——查看、复制、导出 Word / Markdown。">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=20260712-usability">
    <style>
        .wb-wrap { max-width: 1240px; margin: 0 auto; padding: 40px 24px 88px; }
        .wb-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 24px; align-items: end; margin-bottom: 24px; padding: 6px 0 24px; border-bottom: 1px solid var(--line); }
        .wb-kicker { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); font-weight: 700; margin-bottom: 10px; }
        .wb-head h1 { font-family: var(--font-display); font-size: clamp(34px, 4vw, 48px); line-height: 1.08; font-weight: 760; color: var(--ink); margin: 0; letter-spacing: -0.03em; }
        .wb-head h1 em { color: var(--ink); font-style: normal; }
        .wb-head p { font-size: 14.5px; color: var(--text); margin: 12px 0 0; max-width: 43em; line-height: 1.75; }
        .wb-metrics { display: grid; grid-template-columns: repeat(4, minmax(72px,1fr)); gap: 8px; min-width: 372px; }
        .wb-metric { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 10px 12px; box-shadow: none; }
        .wb-metric b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1; color: var(--ink); }
        .wb-metric span { display: block; margin-top: 5px; font-size: 11.5px; color: var(--muted); }
        #wb-count { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }

        /* 检索栏：明确的工作台控制区 */
        .wb-controls { display: none; margin: 0 0 24px; padding: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: none; }
        .wb-controls.active { display: block; }
        .wb-search-row { display: grid; grid-template-columns: minmax(240px, 1fr) auto; gap: 12px; align-items: center; }
        .wb-search { position: relative; min-width: 0; }
        .wb-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--subtle); font-size: 17px; }
        .wb-search input { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--soft); color: var(--ink); outline: none; padding: 11px 14px 11px 40px; font-size: 14px; transition: border-color .15s, box-shadow .15s, background .15s; }
        .wb-search input:focus { border-color: var(--brand); background: var(--paper); box-shadow: 0 0 0 3px var(--brand-soft); }
        .wb-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .wb-filter-pill { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--soft); color: var(--text-soft); padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
        .wb-filter-pill:hover { color: var(--ink); border-color: var(--subtle); }
        .wb-filter-pill.active { color: #fff; border-color: var(--brand); background: var(--brand); }
        .wb-select { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--soft); color: var(--text); padding: 8px 30px 8px 10px; font-size: 12.5px; outline: none; min-height: 36px; }
        .wb-select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: var(--paper); }
        .wb-clear { margin-left: auto; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 12.5px; font-family: inherit; padding: 7px 4px; }
        .wb-clear:hover { color: var(--brand); }
        .wb-statline { font-size: 12px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
        .wb-view-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
        .wb-view-toggle button { width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; font-size: 16px; }
        .wb-view-toggle button.active { background: var(--ink); color: var(--soft); }
        @media (max-width: 720px) {
            .wb-head { grid-template-columns: 1fr; gap: 16px; }
            .wb-metrics { min-width: 0; width: 100%; }
            .wb-search-row { grid-template-columns: 1fr; }
            .wb-statline { white-space: normal; }
            .wb-clear { margin-left: 0; }
        }
        @media (max-width: 460px) { .wb-metrics { grid-template-columns: repeat(2, minmax(0,1fr)); } }

        /* 登录门 */
        #login-gate { display: none; min-height: 46vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; color: var(--muted); }
        #login-gate i { font-size: 52px; color: var(--subtle); }
        #login-gate .btn-primary { margin-top: 4px; width: auto; padding: 12px 30px; }

        /* 空状态 */
        #wb-empty { display: none; text-align: center; padding: 64px 20px; color: var(--muted); }
        #wb-empty i { font-size: 52px; display: block; margin-bottom: 14px; color: var(--subtle); }
        #wb-empty a { color: var(--brand); font-weight: 600; border-bottom: 1px solid var(--brand); }
        #wb-error { display: none; text-align: center; padding: 54px 20px; color: var(--muted); border: 1px dashed rgba(192,57,43,.35); border-radius: 16px; background: #fff7f5; }
        #wb-error i { font-size: 46px; display: block; margin-bottom: 12px; color: var(--brand); }
        #wb-error .btn-primary { margin-top: 14px; width: auto; padding: 10px 24px; }

        /* 卡片墙 */
        #wb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(308px, 1fr)); gap: 16px; }
        .wb-card { position: relative; display: flex; flex-direction: column; min-height: 252px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px;
            box-shadow: var(--shadow-xs); overflow: hidden; transition: transform .2s, box-shadow .2s, border-color .2s; }
        .wb-card:hover { transform: translateY(-1px); border-color: #bdcbd4; box-shadow: 0 10px 24px -22px rgba(23,33,43,.52); }
        .wb-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .wb-card-meta { min-width: 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); flex-wrap: wrap; }
        .wb-type { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 5px; background: var(--soft-2); color: var(--text-soft); font-family: var(--font-sans); font-size: 11px; font-weight: 750; }
        .wb-type.chat { background: var(--brand-soft); color: var(--brand-dark); }
        .wb-project-tag, .wb-review-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border: 1px solid #c5d7e0; border-radius: 5px; background: #f2f7f9; color: #245b78; font-family: var(--font-sans); font-size: 11px; font-weight: 650; }
        .wb-review-tag { border-color: #bedbd3; background: #eef8f5; color: #287a68; }
        .wb-card-agent { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wb-card-date { font-family: var(--font-mono); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
        .wb-card-title { font-size: 16px; font-weight: 850; color: var(--ink); line-height: 1.42; margin: 0 0 9px; cursor: pointer;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .wb-card-title:hover { color: var(--brand); }
        .wb-card-preview { font-size: 13px; color: var(--text-soft); line-height: 1.76; margin: 0 0 16px; flex: 1; cursor: pointer;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .wb-card-actions { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
        .wb-card-actions button { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-family: inherit; color: var(--text-soft);
            background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; cursor: pointer; transition: all .15s; }
        .wb-card-actions button.primary { color: #fff; background: var(--ink); border-color: var(--ink); }
        .wb-card-actions button:hover { border-color: var(--ink); color: var(--ink); background: var(--paper); }
        .wb-card-actions button.primary:hover { border-color: var(--brand); background: var(--brand); color: #fff; }
        .wb-card-actions button.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--brand-soft); }
        #wb-grid.wb-list { grid-template-columns: 1fr; }
        #wb-grid.wb-list .wb-card { min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; }
        #wb-grid.wb-list .wb-card-preview { -webkit-line-clamp: 2; margin-bottom: 0; }
        #wb-grid.wb-list .wb-card-actions { border-top: 0; padding-top: 0; justify-content: flex-end; max-width: 300px; }
        @media (max-width: 760px) {
            #wb-grid.wb-list .wb-card { grid-template-columns: 1fr; }
            #wb-grid.wb-list .wb-card-actions { justify-content: flex-start; max-width: none; border-top: 1px solid var(--line-soft); padding-top: 14px; }
        }
        .wb-filter-empty { display: none; text-align: center; padding: 54px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; background: rgba(255,255,255,.42); }
        .wb-filter-empty i { font-size: 44px; display: block; margin-bottom: 12px; color: var(--subtle); }

        /* 查看弹层 */
        .wb-modal { position: fixed; inset: 0; background: rgba(23,33,43,.48); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 24px; }
        .wb-modal.active { display: flex; }
        .wb-modal-box { background: var(--paper); border-radius: 12px; width: min(820px, 100%); max-height: 86vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden; }
        .wb-modal-head { padding: 22px 26px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; background: var(--paper); }
        .wb-modal-head h2 { font-family: var(--font-display); font-size: 20px; font-weight: 850; color: var(--ink); margin: 0 0 8px; line-height: 1.35; }
        .wb-modal-head .meta { font-size: 12px; color: var(--muted); font-family: var(--font-mono); display: flex; gap: 7px; flex-wrap: wrap; }
        .wb-modal-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.6); padding: 3px 8px; }
        .wb-modal-head .x { background: none; border: none; font-size: 24px; line-height: 1; color: var(--subtle); cursor: pointer; padding: 0 4px; }
        .wb-modal-body { padding: 28px 34px; overflow-y: auto; }
        .wb-modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 14px 24px; border-top: 1px solid var(--line); background: var(--soft); }
        .wb-modal-foot button, .wb-modal-foot a { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-family: inherit; color: var(--text-soft); background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; cursor: pointer; transition: all .15s; }
        .wb-modal-foot button:hover, .wb-modal-foot a:hover { border-color: var(--ink); color: var(--ink); }
        .wb-modal-foot a.primary { color: var(--soft); background: var(--ink); border-color: var(--ink); }
        .wb-modal-foot a.primary:hover { background: var(--brand); border-color: var(--brand); color: #fff; }

        /* markdown 渲染（弹层内） */
        .wb-md { color: var(--text); font-size: 14.5px; line-height: 1.9; }
        .wb-md h1 { font-size: 1.5em; font-weight: 800; color: var(--ink); line-height: 1.3; text-align: center; margin: 0.2em 0 0.7em; }
        .wb-md h2 { font-size: 1.25em; font-weight: 700; color: var(--ink); line-height: 1.3; margin: 1.4em 0 0.5em; padding: 2px 0 2px 12px; border-left: 4px solid var(--brand); }
        .wb-md h3 { font-size: 1.1em; font-weight: 700; color: var(--brand-dark); margin: 1.1em 0 0.4em; }
        .wb-md p { margin: 0.6em 0; }
        .wb-md ul, .wb-md ol { padding-left: 1.7em; margin: 0.6em 0; }
        .wb-md li { margin: 0.35em 0; }
        .wb-md strong { color: var(--brand-dark); font-weight: 700; }
        .wb-md code { background: var(--soft-2); padding: 1px 6px; border-radius: 5px; font-family: var(--font-mono); font-size: 0.9em; }
        .wb-md pre { background: var(--soft-2); padding: 14px 16px; border-radius: 10px; overflow-x: auto; }
        .wb-md pre code { background: none; padding: 0; }
        .wb-md blockquote { border-left: 3px solid var(--brand); background: var(--brand-soft); padding: 8px 14px; color: var(--text-soft); margin: 0.9em 0; border-radius: 0 8px 8px 0; }
        .wb-md table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.95em; }
        .wb-md th, .wb-md td { border: 1px solid var(--line); padding: 8px 11px; text-align: left; vertical-align: top; }
        .wb-md th { background: var(--soft-2); font-weight: 700; color: var(--ink); }
    </style>
</head>
<body>
<div id="main-nav"></div>

<main class="wb-wrap">
    <div class="breadcrumb"><a href="index.html">首页</a><i class="ph ph-caret-right"></i><span>我的备课本</span></div>

    <div class="wb-head">
        <div>
            <div class="wb-kicker">Personal workbench · 教学成果管理</div>
            <h1>我的<em>备课本</em></h1>
            <p>把智能体空间生成的教学设计、题目、批改建议和对话记录收进一个地方，随时查看、复制和导出成可继续修改的文稿。</p>
        </div>
        <div class="wb-metrics" aria-label="备课本统计">
            <div class="wb-metric"><b id="wb-total-metric">0</b><span>全部内容</span></div>
            <div class="wb-metric"><b id="wb-draft-metric">0</b><span>生成文稿</span></div>
            <div class="wb-metric"><b id="wb-chat-metric">0</b><span>对话记录</span></div>
            <div class="wb-metric"><b id="wb-reviewed-metric">0</b><span>完成核验</span></div>
        </div>
    </div>

    <!-- 未登录 -->
    <div id="login-gate">
        <i class="ph ph-notebook"></i>
        <p>登录后即可查看你保存的备课内容</p>
        <button class="btn-primary" onclick="showAuthModal('login')">登录 / 注册</button>
    </div>

    <!-- 已登录 -->
    <div id="wb-app" style="display:none">
        <div class="wb-controls" id="wb-controls">
            <div class="wb-search-row">
                <div class="wb-search">
                    <i class="ph ph-magnifying-glass"></i>
                    <input id="wb-search" type="search" aria-label="搜索备课内容" autocomplete="off" placeholder="搜索标题、智能体或正文内容…" oninput="updateWorkbookState({ q: this.value })">
                </div>
                <div class="wb-statline" id="wb-statline"></div>
            </div>
            <div class="wb-filter-row">
                <button class="wb-filter-pill active" data-type="all" onclick="setWorkType('all')"><i class="ph ph-stack"></i> 全部</button>
                <button class="wb-filter-pill" data-type="draft" onclick="setWorkType('draft')"><i class="ph ph-file-text"></i> 生成文稿</button>
                <button class="wb-filter-pill" data-type="chat" onclick="setWorkType('chat')"><i class="ph ph-chats-circle"></i> 对话记录</button>
                <select class="wb-select" id="wb-project-filter" onchange="updateWorkbookState({ project: this.value })" aria-label="按教学项目筛选"></select>
                <select class="wb-select" id="wb-agent-filter" onchange="updateWorkbookState({ agent: this.value })" aria-label="按智能体筛选"></select>
                <select class="wb-select" id="wb-sort" onchange="updateWorkbookState({ sort: this.value })" aria-label="排序方式">
                    <option value="updated-desc">最近更新</option>
                    <option value="created-desc">最近保存</option>
                    <option value="project-asc">按教学项目</option>
                    <option value="title-asc">标题 A-Z</option>
                    <option value="agent-asc">智能体名称</option>
                </select>
                <div class="wb-view-toggle" aria-label="切换显示方式">
                    <button type="button" data-view="cards" class="active" onclick="setWorkbookView('cards')" title="卡片视图" aria-label="卡片视图"><i class="ph ph-squares-four"></i></button>
                    <button type="button" data-view="list" onclick="setWorkbookView('list')" title="列表视图" aria-label="列表视图"><i class="ph ph-list-bullets"></i></button>
                </div>
                <button class="wb-clear" onclick="resetWorkbookFilters()">清除筛选</button>
            </div>
        </div>
        <div id="wb-empty">
            <i class="ph ph-folder-open"></i>
            <p style="font-size:16px;font-weight:600;margin-bottom:6px">备课本还是空的</p>
            <p style="font-size:13px">去 <a href="agents.html">智能体空间</a> 生成内容，点「保存到备课本」就会出现在这里。</p>
        </div>
        <div class="wb-filter-empty" id="wb-filter-empty">
            <i class="ph ph-funnel-simple"></i>
            <p style="font-size:15px;font-weight:700;margin:0 0 6px;color:var(--ink)">没有符合条件的内容</p>
            <p style="font-size:13px;margin:0">换个关键词，或清除筛选后再看。</p>
        </div>
        <div id="wb-error">
            <i class="ph ph-warning-circle"></i>
            <p style="font-size:16px;font-weight:700;margin:0 0 6px;color:var(--ink)">备课本加载失败</p>
            <p id="wb-error-msg" style="font-size:13px;margin:0">请稍后重试。</p>
            <button class="btn-primary" onclick="loadWorks()">重新加载</button>
        </div>
        <div id="wb-grid"></div>
    </div>
</main>

<!-- 查看弹层 -->
<div class="wb-modal" id="wb-modal" onclick="if(event.target===this)closeModal()">
    <div class="wb-modal-box">
        <div class="wb-modal-head">
            <div>
                <h2 id="wb-modal-title"></h2>
                <div class="meta" id="wb-modal-meta"></div>
            </div>
            <button class="x" onclick="closeModal()" aria-label="关闭">×</button>
        </div>
        <div class="wb-modal-body"><div class="wb-md" id="wb-modal-body"></div></div>
        <div class="wb-modal-foot">
            <a class="primary" id="wb-modal-agent" href="agents.html" style="display:none"><i class="ph ph-robot"></i> 继续用该智能体</a>
            <button onclick="copyActiveWork()"><i class="ph ph-copy"></i> 复制</button>
            <button onclick="exportPdfActive()"><i class="ph ph-file-pdf"></i> PDF</button>
            <button onclick="exportWordActive()"><i class="ph ph-file-doc"></i> Word</button>
            <button onclick="exportMdActive()"><i class="ph ph-file-text"></i> MD</button>
        </div>
    </div>
</div>

<div id="main-footer"></div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="js/firebase-config.js?v=20260615-authflash"></script>
<script src="js/data.js?v=20260709-proxyworks"></script>
<script src="js/auth.js?v=20260712-workbench"></script>
<script src="js/analytics.js?v=20260707-analytics"></script>
<script src="js/teaching-projects.js?v=20260712-project-flow"></script>
<script>
let _works = [];
let _activeWorkId = null;
let _workbookViewTracked = false;
let _wbState = { q: '', type: 'all', project: 'all', agent: 'all', sort: 'updated-desc', view: 'cards' };
let _wbError = '';

function fmtDate(s) { try { return new Date(s).toLocaleDateString('zh-CN', { year:'numeric', month:'short', day:'numeric' }); } catch { return ''; } }
function escapeHtml(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function mdToHtml(md) { try { return window.marked ? marked.parse(md, { breaks:true, gfm:true }) : escapeHtml(md).replace(/\n/g, '<br>'); } catch { return escapeHtml(md); } }
function previewText(md) { const t = String(md || '').replace(/[#*_>`!\[\]()-]/g, '').replace(/\s+/g, ' ').trim(); return t.length > 130 ? t.slice(0, 130) + '…' : t; }
function findWork(id) { return _works.find(w => w.id === id); }
function safeName(s) { return (String(s || '备课内容').replace(/[\\/:*?"<>|]/g, '_').trim() || '备课内容').slice(0, 60); }
function timeValue(s) { const n = Date.parse(s || ''); return Number.isFinite(n) ? n : 0; }
function workType(w) {
    if (w.workType) return w.workType;
    if (w.agentType === 'chat' || /对话/.test(w.title || '') || /^# .*对话记录/m.test(w.content || '')) return 'chat';
    return 'draft';
}
function workTypeLabel(w) { return workType(w) === 'chat' ? '对话记录' : '生成文稿'; }
function workTypeIcon(w) { return workType(w) === 'chat' ? 'ph-chats-circle' : 'ph-file-text'; }
function agentKey(w) { return w.agentId || w.agentName || 'unknown'; }
function workProjectId(w) { return w.inputs?._projectId || 'unassigned'; }
function workProjectTitle(w) { return w.inputs?._projectTitle || '未归入项目'; }
function workReviewed(w) { return w.inputs?._reviewStatus === 'reviewed' || (Array.isArray(w.inputs?._reviewChecks) && w.inputs._reviewChecks.length === 4); }
function titlePart(value, max = 28) {
    const raw = Array.isArray(value) ? value.join('、') : String(value || '');
    return raw.replace(/[#*_>`\[\]（）()《》]/g, '').replace(/\s+/g, ' ').trim().slice(0, max);
}
function firstInput(inputs, keys, max) {
    for (const key of keys) {
        const val = titlePart(inputs?.[key], max);
        if (val) return val;
    }
    return '';
}
function contentHeading(content) {
    const match = String(content || '').match(/^#{1,3}\s+(.+)$/m);
    return match ? titlePart(match[1], 36) : '';
}
function isGenericWorkTitle(w) {
    const title = String(w.title || '').trim();
    const agent = String(w.agentName || '').trim();
    if (!title) return true;
    if (agent && (title === agent || title.startsWith(`${agent} ·`) || title.startsWith(`${agent}对话 ·`))) return true;
    return /^(生成结果|智能体)\s*[·-]/.test(title);
}
function inferredWorkTitle(w) {
    const inputs = w.inputs || {};
    const subject = firstInput(inputs, ['subject'], 10);
    const grade = firstInput(inputs, ['grade'], 12);
    const topic = firstInput(inputs, ['topic','point','concept','scope','theme','title','scene','name'], 30);
    const excerpt = firstInput(inputs, ['question','errors','detail','happened','text'], 28);
    const base = topic || excerpt || contentHeading(w.content);
    const id = w.agentId || '';
    const partsByAgent = {
        'lesson-design': [grade, subject, base, '教学设计'],
        'courseware-outline': [grade, subject, base, '课件大纲'],
        'micro-script': [grade, base, '微课脚本'],
        'lesson-hook': [grade, subject, base, '情境导入'],
        'layered-q': [grade, subject, base, '分层提问'],
        'concept-explainer': [grade, base, '概念解释'],
        'class-activity': [subject, base, '课堂活动'],
        'quiz-gen': [grade, subject, base, firstInput(inputs, ['types'], 18) || '练习题'],
        'homework-grader': [subject, excerpt || base, '作业批改'],
        'essay-review': [grade, base ? `《${base}》` : '', '作文评改'],
        'exam-paper': [grade, subject, base, '单元组卷'],
        'error-diagnosis': [grade, subject, excerpt || base, '错题诊断'],
        'parent-comm': [base || excerpt, '家校沟通'],
        'student-comment': [base, '学生评语'],
        'class-meeting': [grade, base, '班会方案'],
        'teaching-reflection': [base, '教学反思'],
        'lesson-observe': [base, '听评课观察']
    };
    const parts = partsByAgent[id] || [grade, subject, base || w.agentName];
    return (parts.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim() || w.title || '未命名').slice(0, 72);
}
function displayWorkTitle(w) {
    return isGenericWorkTitle(w) ? inferredWorkTitle(w) : (w.title || inferredWorkTitle(w));
}
function downloadBlob(filename, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function updateWorkbookState(next) {
    _wbState = { ..._wbState, ...next };
    renderWorks();
}

function setWorkType(type) {
    _wbState.type = type;
    renderWorks();
}

function resetWorkbookFilters() {
    _wbState = { q: '', type: 'all', project: 'all', agent: 'all', sort: 'updated-desc', view: _wbState.view || 'cards' };
    renderWorks();
}

function setWorkbookView(view) {
    _wbState.view = view === 'list' ? 'list' : 'cards';
    renderWorks();
}

function renderFilterControls() {
    const controls = document.getElementById('wb-controls');
    if (controls) controls.classList.toggle('active', _works.length > 0);

    const q = document.getElementById('wb-search');
    if (q && q.value !== _wbState.q) q.value = _wbState.q;

    document.querySelectorAll('.wb-filter-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === _wbState.type);
    });

    const sort = document.getElementById('wb-sort');
    if (sort) sort.value = _wbState.sort;

    document.querySelectorAll('.wb-view-toggle button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === _wbState.view);
    });

    const projectSelect = document.getElementById('wb-project-filter');
    if (projectSelect) {
        const projects = [...new Map(_works.map(w => [workProjectId(w), workProjectTitle(w)]))]
            .sort((a, b) => a[1].localeCompare(b[1], 'zh-CN'));
        if (_wbState.project !== 'all' && !projects.some(([key]) => key === _wbState.project)) _wbState.project = 'all';
        projectSelect.innerHTML = '<option value="all">全部教学项目</option>' + projects
            .map(([key, name]) => `<option value="${escapeHtml(key)}">${escapeHtml(name)}</option>`).join('');
        projectSelect.value = _wbState.project;
    }

    const agentSelect = document.getElementById('wb-agent-filter');
    if (!agentSelect) return;
    const agents = [...new Map(_works.map(w => [agentKey(w), w.agentName || '未知智能体']))]
        .sort((a, b) => a[1].localeCompare(b[1], 'zh-CN'));
    if (_wbState.agent !== 'all' && !agents.some(([key]) => key === _wbState.agent)) _wbState.agent = 'all';
    agentSelect.innerHTML = `<option value="all">全部智能体</option>` + agents
        .map(([key, name]) => `<option value="${escapeHtml(key)}">${escapeHtml(name)}</option>`)
        .join('');
    agentSelect.value = _wbState.agent;
}

function filteredWorks() {
    const q = _wbState.q.trim().toLowerCase();
    const list = _works.filter(w => {
        const typeOk = _wbState.type === 'all' || workType(w) === _wbState.type;
        const projectOk = _wbState.project === 'all' || workProjectId(w) === _wbState.project;
        const agentOk = _wbState.agent === 'all' || agentKey(w) === _wbState.agent;
        const haystack = `${displayWorkTitle(w)} ${w.title || ''} ${workProjectTitle(w)} ${w.agentName || ''} ${w.content || ''}`.toLowerCase();
        const qOk = !q || haystack.includes(q);
        return typeOk && projectOk && agentOk && qOk;
    });
    return list.sort((a, b) => {
        if (_wbState.sort === 'created-desc') return timeValue(b.createdAt) - timeValue(a.createdAt);
        if (_wbState.sort === 'project-asc') return workProjectTitle(a).localeCompare(workProjectTitle(b), 'zh-CN') || timeValue(b.updatedAt || b.createdAt) - timeValue(a.updatedAt || a.createdAt);
        if (_wbState.sort === 'title-asc') return (a.title || '').localeCompare(b.title || '', 'zh-CN');
        if (_wbState.sort === 'agent-asc') return (a.agentName || '').localeCompare(b.agentName || '', 'zh-CN');
        return timeValue(b.updatedAt || b.createdAt) - timeValue(a.updatedAt || a.createdAt);
    });
}

function renderWorks() {
    const grid = document.getElementById('wb-grid');
    const empty = document.getElementById('wb-empty');
    const errorBox = document.getElementById('wb-error');
    const errorMsg = document.getElementById('wb-error-msg');
    const filterEmpty = document.getElementById('wb-filter-empty');
    const statline = document.getElementById('wb-statline');
    renderFilterControls();
    const totalMetric = document.getElementById('wb-total-metric');
    const draftMetric = document.getElementById('wb-draft-metric');
    const chatMetric = document.getElementById('wb-chat-metric');
    const reviewedMetric = document.getElementById('wb-reviewed-metric');
    if (totalMetric) totalMetric.textContent = _works.length;
    if (draftMetric) draftMetric.textContent = _works.filter(w => workType(w) === 'draft').length;
    if (chatMetric) chatMetric.textContent = _works.filter(w => workType(w) === 'chat').length;
    if (reviewedMetric) reviewedMetric.textContent = _works.filter(workReviewed).length;
    if (_wbError) {
        if (errorBox) errorBox.style.display = 'block';
        if (errorMsg) errorMsg.textContent = _wbError;
        empty.style.display = 'none';
        if (filterEmpty) filterEmpty.style.display = 'none';
        grid.style.display = 'none';
        grid.innerHTML = '';
        if (statline) statline.textContent = '';
        return;
    }
    if (errorBox) errorBox.style.display = 'none';
    if (!_works.length) {
        empty.style.display = '';
        if (filterEmpty) filterEmpty.style.display = 'none';
        grid.style.display = 'none';
        grid.innerHTML = '';
        if (statline) statline.textContent = '';
        return;
    }
    const list = filteredWorks();
    empty.style.display = 'none';
    if (statline) statline.textContent = list.length === _works.length ? `${_works.length} 条内容` : `${list.length} / ${_works.length} 条`;
    if (!list.length) {
        if (filterEmpty) filterEmpty.style.display = 'block';
        grid.style.display = 'none';
        grid.innerHTML = '';
        return;
    }
    if (filterEmpty) filterEmpty.style.display = 'none';
    grid.style.display = 'grid';
    grid.classList.toggle('wb-list', _wbState.view === 'list');
    grid.innerHTML = list.map(w => `
        <div class="wb-card ${workType(w)}">
            <div>
                <div class="wb-card-top">
                    <div class="wb-card-meta">
                        <span class="wb-type ${workType(w)}"><i class="ph ${workTypeIcon(w)}"></i>${workTypeLabel(w)}</span>
                        <span class="wb-project-tag"><i class="ph ph-folder-notch"></i>${escapeHtml(workProjectTitle(w))}</span>
                        ${workReviewed(w) ? '<span class="wb-review-tag"><i class="ph ph-shield-check"></i>已核验</span>' : ''}
                        <span class="wb-card-agent"><i class="ph ph-robot"></i>${escapeHtml(w.agentName || '智能体')}</span>
                    </div>
                    <span class="wb-card-date">${fmtDate(w.updatedAt || w.createdAt)}</span>
                </div>
                <h3 class="wb-card-title" onclick="viewWork('${w.id}')">${escapeHtml(displayWorkTitle(w))}</h3>
                <p class="wb-card-preview" onclick="viewWork('${w.id}')">${escapeHtml(previewText(w.content))}</p>
            </div>
            <div class="wb-card-actions">
                <button class="primary" onclick="viewWork('${w.id}')"><i class="ph ph-eye"></i> 查看</button>
                <button onclick="copyWork('${w.id}')"><i class="ph ph-copy"></i> 复制</button>
                <button onclick="exportPdf('${w.id}')"><i class="ph ph-file-pdf"></i> PDF</button>
                <button onclick="exportWord('${w.id}')"><i class="ph ph-file-doc"></i> Word</button>
                <button onclick="exportMd('${w.id}')"><i class="ph ph-file-text"></i> MD</button>
                <button onclick="doRename('${w.id}')"><i class="ph ph-pencil-simple"></i> 重命名</button>
                <button class="danger" onclick="doDelete('${w.id}')"><i class="ph ph-trash"></i> 删除</button>
            </div>
        </div>`).join('');
}

function viewWork(id) {
    const w = findWork(id); if (!w) return;
    _activeWorkId = id;
    if (window.Analytics) Analytics.track('workbook_open', {
        feature: 'workspace',
        targetId: w.agentId || '',
        targetName: w.agentName || '',
        meta: { workType: workType(w) }
    });
    document.getElementById('wb-modal-title').textContent = displayWorkTitle(w);
    document.getElementById('wb-modal-meta').innerHTML = `
        <span class="wb-modal-chip"><i class="ph ${workTypeIcon(w)}"></i>${escapeHtml(workTypeLabel(w))}</span>
        <span class="wb-modal-chip"><i class="ph ph-folder-notch"></i>${escapeHtml(workProjectTitle(w))}</span>
        ${workReviewed(w) ? '<span class="wb-modal-chip"><i class="ph ph-shield-check"></i>教师已核验</span>' : ''}
        <span class="wb-modal-chip"><i class="ph ph-robot"></i>${escapeHtml(w.agentName || '智能体')}</span>
        <span class="wb-modal-chip"><i class="ph ph-calendar-blank"></i>${fmtDate(w.updatedAt || w.createdAt)}</span>`;
    document.getElementById('wb-modal-body').innerHTML = mdToHtml(w.content);
    const agentLink = document.getElementById('wb-modal-agent');
    if (agentLink && w.agentId) {
        agentLink.href = `agents.html#${encodeURIComponent(w.agentId)}`;
        agentLink.onclick = () => resumeWorkContext(w);
        agentLink.style.display = 'inline-flex';
    } else if (agentLink) {
        agentLink.onclick = null;
        agentLink.style.display = 'none';
    }
    document.getElementById('wb-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function resumeWorkContext(w) {
    const inputs = w?.inputs || {};
    if (!inputs._projectId && !inputs._projectTitle) return;
    window.TeachingProjects?.setActiveProject?.({
        id: inputs._projectId,
        title: inputs._projectTitle,
        subject: inputs._projectSubject || inputs.subject || '',
        grade: inputs._projectGrade || inputs.grade || '',
        topic: inputs.topic || inputs.point || inputs.concept || inputs.scope || '',
        goal: inputs.goal || '',
        classProfile: inputs.note || ''
    });
}
function closeModal() { document.getElementById('wb-modal').classList.remove('active'); document.body.style.overflow = ''; _activeWorkId = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function copyWork(id) { const w = findWork(id); if (!w) return; navigator.clipboard.writeText(w.content || '').then(() => showToast('已复制到剪贴板 ✓')); }
function exportMd(id) { const w = findWork(id); if (!w) return; downloadBlob(safeName(displayWorkTitle(w)) + '.md', new Blob([w.content || ''], { type: 'text/markdown;charset=utf-8' })); }
function copyActiveWork() { if (_activeWorkId) copyWork(_activeWorkId); }
function exportMdActive() { if (_activeWorkId) exportMd(_activeWorkId); }

// 「教学文稿」排版样式：宋体正文 + 黑体标题 + 朱红点睛 + 表格/引用 + 落款；导出 Word / PDF 共用
function docStyles() {
    return `
        @page { margin: 2.2cm 2.4cm; }
        * { box-sizing: border-box; }
        body { font-family: "Songti SC","SimSun","宋体",serif; font-size: 15px; line-height: 1.9; color: #1a1612; max-width: 800px; margin: 0 auto; padding: 28px; background: #fff; }
        .doc-meta { text-align: right; font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 11px; color: #8a7d6d; letter-spacing: .04em; border-bottom: 2px solid #c0392b; padding-bottom: 8px; margin-bottom: 26px; }
        h1 { font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 24px; font-weight: 800; color: #1a1612; line-height: 1.3; text-align: center; margin: .2em 0 .8em; }
        h2 { font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 18px; font-weight: 700; color: #1a1612; margin: 1.5em 0 .6em; padding: 2px 0 2px 12px; border-left: 4px solid #c0392b; }
        h3 { font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 15.5px; font-weight: 700; color: #9a2b1f; margin: 1.2em 0 .4em; }
        p { margin: .65em 0; text-align: justify; }
        ul, ol { margin: .5em 0; padding-left: 1.9em; }
        li { margin: .38em 0; }
        strong { color: #9a2b1f; font-weight: 700; }
        em { color: #574a3d; font-style: italic; }
        blockquote { border-left: 3px solid #c0392b; background: #fbeae6; padding: 9px 15px; margin: 1em 0; color: #574a3d; }
        table { width: 100%; border-collapse: collapse; margin: 1.1em 0; font-size: 14px; }
        th, td { border: 1px solid #d9cdb8; padding: 8px 11px; text-align: left; vertical-align: top; }
        th { background: #f3ede0; font-weight: 700; color: #1a1612; }
        hr { border: none; border-top: 1px solid #d9cdb8; margin: 1.5em 0; }
        code { font-family: "Courier New",monospace; background: #f3ede0; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        pre { background: #f3ede0; padding: 12px 15px; border-radius: 8px; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        .doc-foot { margin-top: 36px; padding-top: 14px; border-top: 1px solid #d9cdb8; text-align: right; font-family: "Heiti SC","SimHei","微软雅黑",sans-serif; font-size: 11px; color: #8a7d6d; }
        .doc-foot .seal { display: inline-block; border: 1.5px solid #c0392b; color: #c0392b; font-family: "KaiTi","STKaiti","楷体",serif; font-weight: 700; padding: 3px 9px; border-radius: 4px; margin-left: 10px; letter-spacing: 3px; }
    `;
}
function docHtml(w) {
    const meta = `AI 教师培训中心 · ${escapeHtml(w.agentName || '智能体')} · ${fmtDate(w.updatedAt || w.createdAt)}`;
    return `<!DOCTYPE html><html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${escapeHtml(displayWorkTitle(w))}</title><style>${docStyles()}</style></head><body><div class="doc-meta">${meta}</div>${mdToHtml(w.content)}<div class="doc-foot">本文由 AI 起草、教师修改定稿<span class="seal">教研甄选</span></div></body></html>`;
}
function exportWord(id) {
    const w = findWork(id); if (!w) return;
    downloadBlob(safeName(displayWorkTitle(w)) + '.doc', new Blob(['﻿', docHtml(w)], { type: 'application/msword' }));
}
function exportPdf(id) {
    const w = findWork(id); if (!w) return;
    const win = window.open('', '_blank');
    if (!win) { showToast('请允许弹出窗口后重试'); return; }
    win.document.write(docHtml(w));
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 350);
    showToast('已打开打印窗口，选「另存为 PDF」即可');
}
function exportWordActive() { if (_activeWorkId) exportWord(_activeWorkId); }
function exportPdfActive() { if (_activeWorkId) exportPdf(_activeWorkId); }

async function doRename(id) {
    const w = findWork(id); if (!w) return;
    const t = prompt('重命名为：', w.title || '');
    if (t === null) return;
    const title = t.trim(); if (!title) return;
    try { await DB.renameWork(id, title); w.title = title; w.updatedAt = new Date().toISOString(); renderWorks(); showToast('已重命名'); }
    catch (e) { showToast('重命名失败：' + (e.message || '请稍后重试')); }
}
async function doDelete(id) {
    if (!confirm('确定删除这条内容？删除后无法恢复。')) return;
    try { await DB.deleteWork(id); _works = _works.filter(w => w.id !== id); renderWorks(); showToast('已删除'); }
    catch (e) { showToast('删除失败：' + (e.message || '请稍后重试')); }
}

async function loadWorks() {
    const user = Auth.getCurrentUser();
    if (!user) {
        _wbError = '';
        document.getElementById('login-gate').style.display = 'flex';
        document.getElementById('wb-app').style.display = 'none';
        return;
    }
    document.getElementById('login-gate').style.display = 'none'; document.getElementById('wb-app').style.display = '';
    try {
        _works = await DB.getMyWorks(user.uid);
        _wbError = '';
    } catch (e) {
        _works = [];
        _wbError = e.message || '无法读取已保存的备课内容，请稍后重试。';
        console.warn('getMyWorks:', e.message);
        showToast('备课本加载失败，请稍后重试');
    }
    renderWorks();
    if (!_workbookViewTracked && window.Analytics) {
        _workbookViewTracked = true;
        Analytics.track('workbook_view', { feature: 'workspace', meta: { workCount: _works.length } });
    }
}

renderNav('workspace');
renderFooter();
loadWorks();                                  // 乐观渲染（用缓存登录态）
onAuthReady(() => { renderNav('workspace'); renderFooter(); loadWorks(); });  // Firebase 就绪后校正
document.addEventListener('authRefresh', () => loadWorks());  // 在本页登录后原地加载内容（不整页刷新）
</script>
