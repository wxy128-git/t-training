<body>
<div id="main-nav"></div>

<main id="main-content" style="max-width:1240px;margin:0 auto;padding:56px 24px 88px">
    <div class="breadcrumb"><a href="/">首页</a><i class="ph ph-caret-right"></i><span>AI 资讯</span></div>

    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px;flex-wrap:wrap;gap:14px">
        <div>
            <div style="font-family:var(--font-mono);font-size:11.5px;color:var(--brand);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:14px;font-weight:500" data-site-copy="heroKicker">教育与 AI 动态</div>
            <h1 style="font-family:var(--font-display);font-size:clamp(32px,4.6vw,52px);font-weight:800;color:var(--ink);letter-spacing:-0.03em;line-height:1.1;margin:0" data-site-copy-headline="heroTitle" data-site-copy-accent="heroAccent">AI <span style="font-style:italic;color:var(--brand)">资讯</span></h1>
            <p style="font-size:14.5px;color:var(--muted);margin-top:14px;line-height:1.7" data-site-copy="heroIntro">点击标题阅读媒体原文。</p>
        </div>
        <button id="refresh-btn" onclick="refresh()" style="display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:13.5px;color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);cursor:pointer;transition:border-color 0.15s,color 0.15s" onmouseover="this.style.borderColor='var(--ink)';this.style.color='var(--ink)'" onmouseout="this.style.borderColor='var(--line)';this.style.color='var(--text)'">
            <i class="ph ph-arrows-clockwise" id="refresh-icon"></i><span data-site-copy="refreshAction">刷新</span>
        </button>
    </div>

    <!-- Feed selector -->
    <div class="filter-bar" id="feed-tabs"></div>

    <!-- Status -->
    <div id="fetch-status" style="font-size:12px;color:var(--subtle);margin-bottom:20px"></div>

    <!-- Grid -->
    <div class="cards-grid cards-grid-3" id="news-grid"></div>

    <p style="font-size:11.5px;color:var(--subtle);text-align:center;margin-top:36px" data-site-copy="sourceNote">内容来自第三方媒体，以原文语言呈现</p>
</main>

<div id="main-footer"></div>

<script src="/vendor/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/vendor/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/vendor/firebase/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/safe-render.js?v=20260719-security"></script>
<script src="js/firebase-config.js?v=20260822-phase1"></script>
<script src="js/data.js?v=20260823-page-copy"></script>
<script src="js/site-copy.js?v=20260823-page-copy"></script>
<script src="js/auth.js?v=20260823-content-team-workbook"></script>
<script src="js/analytics.js?v=20260707-analytics"></script>
<script>
SiteCopy.load('news').then(copy => SiteCopy.applyToDocument('news', copy));

renderNav('news');
renderFooter();
onAuthReady(user => { renderNav('news'); renderFooter(); });

let currentFeedKey = 'qbitai';

function buildFeedTabs() {
    document.getElementById('feed-tabs').innerHTML = Object.entries(RSS_FEEDS).map(([key, f]) =>
        `<button class="filter-pill${key === currentFeedKey ? ' active' : ''}" onclick="selectFeed('${key}',this)">${f.label}</button>`
    ).join('');
}

function selectFeed(key, btn) {
    currentFeedKey = key;
    document.querySelectorAll('#feed-tabs .filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadNews();
}

function showSkeletons(n = 9) {
    document.getElementById('news-grid').innerHTML = Array(n).fill(`
        <div class="card" style="padding:20px">
            <div class="skeleton" style="height:11px;width:35%;margin-bottom:12px"></div>
            <div class="skeleton" style="height:16px;margin-bottom:6px"></div>
            <div class="skeleton" style="height:16px;width:85%;margin-bottom:14px"></div>
            <div class="skeleton" style="height:12px;margin-bottom:5px"></div>
            <div class="skeleton" style="height:12px;width:75%;margin-bottom:5px"></div>
            <div class="skeleton" style="height:12px;width:55%"></div>
        </div>`).join('');
}

function renderItems(items) {
    const grid = document.getElementById('news-grid');
    if (!items || items.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">
            <i class="ph ph-wifi-slash" style="font-size:48px;display:block;margin-bottom:12px"></i>
            <p style="font-size:15px;font-weight:500;margin-bottom:6px">资讯获取失败</p>
            <p style="font-size:13px">可能是网络问题，请稍后点击"刷新"重试</p>
        </div>`;
        return;
    }
    grid.innerHTML = items.map(item => {
        const date = (() => { try { return new Date(item.pubDate).toLocaleDateString('zh-CN',{year:'numeric',month:'short',day:'numeric'}); } catch{return '近期';} })();
        const safeLink = SafeRender.safeUrl(item.link);
        if (!safeLink) return '';
        const domain = (() => { try { return new URL(safeLink).hostname.replace('www.',''); } catch{return '';} })();
        const desc = item.description ? item.description.substring(0, 96) : '';
        return `
        <a href="${SafeRender.escape(safeLink)}" target="_blank" rel="noopener noreferrer" class="card news-card" style="display:block">
            <div class="news-meta">
                <span class="news-source">${SafeRender.escape(domain)}</span>·<span>${SafeRender.escape(date)}</span>
            </div>
            <h3 class="line-clamp-2">${SafeRender.escape(item.title)}</h3>
            <p class="line-clamp-2" style="margin-top:10px;font-size:13px;color:var(--muted);line-height:1.7">${SafeRender.escape(desc)}${desc?'…':''}</p>
        </a>`;
    }).join('');

}

async function loadNews(force = false) {
    const status = document.getElementById('fetch-status');
    status.textContent = '正在获取最新资讯…';
    showSkeletons();
    const icon = document.getElementById('refresh-icon');
    icon.style.cssText = 'display:inline-block;animation:spin 1s linear infinite';
    if (!document.getElementById('spin-style')) {
        const s = document.createElement('style');
        s.id = 'spin-style';
        s.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(s);
    }

    if (force) {
        const cacheKey = 'rss_' + currentFeedKey;
        localStorage.removeItem(cacheKey);
    }

    const items = await fetchRSSFeed(currentFeedKey, 12);
    icon.style.cssText = '';
    if (items) {
        status.textContent = `已加载 ${items.length} 条资讯 · 来源：${RSS_FEEDS[currentFeedKey].label}`;
    } else {
        status.textContent = '获取失败 · 请换选其他资讯源，或稍后点击"刷新"重试';
    }
    renderItems(items);
}

function refresh() { loadNews(true); }

buildFeedTabs();
loadNews();
</script>
<script src="js/pwa.js?v=20260822-phase1"></script>
<script src="js/assistant.js?v=20260821-tencent"></script>
</body>
</html>
