<body>
<div id="main-nav"></div>

<main class="resource-page">
    <section class="resource-hero">
        <div>
            <div style="font-family:var(--font-mono);font-size:11.5px;color:var(--brand);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:14px;font-weight:500">Resources · 课件素材</div>
            <h1>课件素材<span style="font-style:italic;color:var(--brand)">速查库</span></h1>
            <p>为课件、海报、活动方案和 AI 创作整理的常用素材入口——图片、PNG、图标、抠图、AIGC 平台一网打尽。</p>
        </div>
        <div class="resource-search">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="搜索资源名称或描述...">
        </div>
    </section>

    <div id="content-area" class="resource-content"></div>

    <div id="no-results" class="resource-empty" hidden>
        <i class="ph ph-magnifying-glass"></i>
        <p>没有找到相关资源，换个关键词试试</p>
    </div>
</main>

<div id="main-footer"></div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=20260615-authflash"></script>
<script src="js/data.js?v=20260709-proxyworks"></script>
<script src="js/auth.js?v=20260715-pwa2"></script>
<script src="js/analytics.js?v=20260707-analytics"></script>
<script>
// Start with the in-code defaults so the page paints immediately,
// then swap in whatever Firestore returns.
let categories = JSON.parse(JSON.stringify(DEFAULT_RESOURCES));

function renderContent(filterText = '') {
    const container = document.getElementById('content-area');
    const noResults = document.getElementById('no-results');
    const query = filterText.toLowerCase();
    let hasResults = false;

    container.innerHTML = categories.map(category => {
        const filteredItems = category.items.filter(item =>
            item.name.toLowerCase().includes(query) ||
            item.desc.toLowerCase().includes(query) ||
            category.title.toLowerCase().includes(query)
        );
        if (!filteredItems.length) return '';
        hasResults = true;
        return `
            <section class="resource-section">
                <div class="resource-section-title">
                    <span class="${category.bg} ${category.color}"><i class="ph-fill ${category.icon}"></i></span>
                    <h2>${category.title}</h2>
                </div>
                <div class="resource-grid">
                    ${filteredItems.map(item => {
                        const domain = new URL(item.url).hostname.replace('www.', '');
                        return `
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="resource-card">
                                <div class="resource-card-top">
                                    <i class="ph-bold ${item.itemIcon}"></i>
                                    <h3>${item.name}</h3>
                                    <span><i class="ph-bold ph-arrow-up-right"></i></span>
                                </div>
                                <p>${item.desc}</p>
                                <div class="resource-domain">${domain}</div>
                            </a>
                        `;
                    }).join('')}
                </div>
            </section>
        `;
    }).join('');

    noResults.hidden = hasResults;
}

renderContent();
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', event => renderContent(event.target.value.trim()));

renderNav('resources');
renderFooter();
onAuthReady(() => { renderNav('resources'); renderFooter(); });

DB.getResources().then(data => {
    if (Array.isArray(data) && data.length) {
        categories = data;
        renderContent(searchInput.value.trim());
    }
});
</script>
<script src="js/pwa.js?v=20260715-pwa2"></script>
<script src="js/assistant.js?v=20260709-migration-title"></script>
</body>
</html>
