    <style>
        /* ===== 首页 · 现代教研工作台（2026-07-12） ===== */
        .th-root {
            --th-bg: #f3f6f8;
            --th-panel: #ffffff;
            --th-panel-muted: #eef3f6;
            --th-ink: #17212b;
            --th-text: #3d4a57;
            --th-muted: #667482;
            --th-subtle: #687785;
            --th-line: #d7e0e6;
            --th-line-strong: #bdcbd4;
            --th-blue: #245b78;
            --th-blue-dark: #19465f;
            --th-blue-soft: #e7f0f5;
            --th-brand: #b64235;
            --th-brand-dark: #8f3129;
            --th-brand-soft: #f7eae8;
            --th-teal: #287a68;
            --th-teal-soft: #e5f2ef;
            --th-amber: #a76f18;
            --th-amber-soft: #fbf2df;
            --th-red: #b83a32;
            color: var(--th-text);
            background: var(--th-bg);
        }
        .th-root * { box-sizing: border-box; }
        .th-root a { color: inherit; text-decoration: none; }
        .th-shell { width: min(1240px, calc(100% - 48px)); margin: 0 auto; }
        .th-system-bar {
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: 42px;
            border-bottom: 1px solid var(--th-line);
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: .06em;
            color: var(--th-muted);
        }
        .th-system-bar strong { color: var(--th-ink); font-weight: 600; }
        .th-system-state { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; }
        .th-system-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--th-teal);
            box-shadow: 0 0 0 3px var(--th-teal-soft);
        }

        .th-hero { padding: 70px 0 64px; border-bottom: 1px solid var(--th-line); }
        .th-hero-grid { display: block; }
        .th-hero-main { max-width: 920px; }
        .th-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--th-blue);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .th-eyebrow::before { content: ""; width: 24px; height: 2px; background: var(--th-blue); }
        .th-hero h1 {
            margin: 0;
            max-width: 14em;
            color: var(--th-ink);
            font-size: clamp(42px, 5vw, 64px);
            font-weight: 760;
            letter-spacing: -.035em;
            line-height: 1.08;
        }
        .th-hero h1 span { color: var(--th-brand); }
        .th-hero-copy {
            max-width: 43em;
            margin: 24px 0 0;
            color: var(--th-text);
            font-size: 16px;
            line-height: 1.8;
        }
        .th-hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
        .th-btn {
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 19px;
            border: 1px solid var(--th-line-strong);
            border-radius: 9px;
            background: var(--th-panel);
            color: var(--th-ink);
            font-size: 14px;
            font-weight: 650;
            transition: border-color .18s, background .18s, color .18s, transform .18s;
        }
        .th-btn:hover { border-color: var(--th-blue); color: var(--th-blue); transform: translateY(-1px); }
        .th-btn.primary { border-color: var(--th-brand); background: var(--th-brand); color: #fff; }
        .th-btn.primary:hover { border-color: var(--th-brand-dark); background: var(--th-brand-dark); color: #fff; }
        .th-resume { display: none; grid-template-columns: auto minmax(0,1fr) auto; gap: 11px; align-items: center; max-width: 680px; margin-top: 17px; padding: 12px 13px; border: 1px solid #bfd1dc; border-radius: 9px; background: #f7fafb; }
        .th-resume.active { display: grid; }
        .th-resume-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--th-blue-soft); color: var(--th-blue); font-size: 17px; }
        .th-resume-copy { min-width: 0; }
        .th-resume-copy small { display: block; color: var(--th-blue); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .07em; font-weight: 650; }
        .th-resume-copy b { display: block; margin-top: 3px; color: var(--th-ink); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .th-resume-copy span { display: block; margin-top: 2px; color: var(--th-muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .th-resume-link { min-height: 38px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid #9dbac9; border-radius: 7px; background: var(--th-panel); color: var(--th-blue); padding: 7px 10px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
        .th-section { padding: 54px 0; border-bottom: 1px solid var(--th-line); }
        .th-section-head {
            display: block;
            margin-bottom: 24px;
        }
        .th-section-head h2 { margin: 0; color: var(--th-ink); font-size: clamp(27px, 3vw, 36px); font-weight: 740; letter-spacing: -.025em; }
        .th-section-head p { margin: 0; color: var(--th-muted); font-size: 13.5px; line-height: 1.75; }
        .th-section-code {
            display: block;
            margin-bottom: 10px;
            color: var(--th-blue);
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .th-task-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--th-line-strong); border-left: 1px solid var(--th-line-strong); }
        .th-task {
            min-height: 176px;
            display: flex;
            flex-direction: column;
            padding: 22px;
            border-right: 1px solid var(--th-line-strong);
            border-bottom: 1px solid var(--th-line-strong);
            background: var(--th-panel);
            transition: background .18s, box-shadow .18s;
        }
        .th-task:hover { background: #f9fbfc; box-shadow: inset 0 -3px 0 var(--task-color, var(--th-blue)); }
        .th-task-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .th-task-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: var(--task-soft, var(--th-blue-soft));
            color: var(--task-color, var(--th-blue));
            font-size: 21px;
        }
        .th-task-kind { color: var(--th-subtle); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; }
        .th-task h3 { margin: 20px 0 7px; color: var(--th-ink); font-size: 17px; font-weight: 720; }
        .th-task p { margin: 0; color: var(--th-muted); font-size: 12.5px; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .th-task-output {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: auto;
            padding-top: 18px;
            color: var(--th-text);
            font-size: 11.5px;
            font-weight: 600;
        }
        .th-task-output i { margin-left: auto; color: var(--th-subtle); font-size: 16px; transition: transform .18s, color .18s; }
        .th-task:hover .th-task-output i { color: var(--task-color, var(--th-blue)); transform: translateX(3px); }

        .th-task-closure {
            margin-top: 16px;
            border: 1px solid var(--th-line-strong);
            border-radius: 10px;
            background: var(--th-panel);
            overflow: hidden;
        }
        .th-task-closure > summary {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 24px;
            min-height: 64px;
            padding: 10px 18px;
            cursor: pointer;
            list-style: none;
        }
        .th-task-closure > summary::-webkit-details-marker { display: none; }
        .th-closure-label { display: inline-flex; align-items: center; gap: 8px; color: var(--th-ink); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
        .th-closure-label i { color: var(--th-blue); font-size: 18px; }
        .th-closure-more { display: inline-flex; align-items: center; gap: 5px; color: var(--th-blue); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
        .th-closure-more i { transition: transform .18s; }
        .th-task-closure[open] .th-closure-more i { transform: rotate(180deg); }
        .th-closure-checks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--th-line); background: #f9fbfc; }
        .th-closure-check { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px; border-right: 1px solid var(--th-line); color: var(--th-muted); font-size: 11.5px; line-height: 1.55; }
        .th-closure-check:last-child { border-right: 0; }
        .th-closure-check i { flex: none; margin-top: 1px; color: var(--th-teal); font-size: 16px; }

        .th-method-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .th-method-card { border: 1px solid var(--th-line-strong); border-radius: 10px; background: var(--th-panel); overflow: hidden; }
        .th-method-title {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 48px;
            padding: 0 18px;
            border-bottom: 1px solid var(--th-line);
            color: var(--th-ink);
            background: #f9fbfc;
            font-size: 13px;
            font-weight: 700;
        }
        .th-method-title i { color: var(--th-blue); font-size: 17px; }
        summary.th-method-title { cursor: pointer; list-style: none; }
        summary.th-method-title::-webkit-details-marker { display: none; }
        summary.th-method-title::after { content: "+"; margin-left: auto; color: var(--th-muted); font-family: var(--font-mono); font-size: 17px; font-weight: 500; }
        details[open] > summary.th-method-title::after { content: "−"; }
        .th-table-wrap { overflow-x: auto; }
        .th-method-table { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 12.5px; }
        .th-method-table th,
        .th-method-table td { padding: 14px 16px; border-bottom: 1px solid var(--th-line); text-align: left; vertical-align: top; line-height: 1.65; }
        .th-method-table tr:last-child td { border-bottom: 0; }
        .th-method-table th { color: var(--th-muted); background: var(--th-panel-muted); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; font-weight: 600; }
        .th-method-table td:first-child { color: var(--th-ink); font-weight: 700; white-space: nowrap; }
        .th-method-table td:nth-child(2) { color: var(--th-text); }
        .th-method-table td:nth-child(3) { color: var(--th-muted); }
        .th-checks { padding: 6px 18px; }
        .th-check {
            display: grid;
            grid-template-columns: 22px minmax(0, 1fr);
            gap: 10px;
            align-items: start;
            padding: 14px 0;
            border-bottom: 1px solid var(--th-line);
        }
        .th-check:last-child { border-bottom: 0; }
        .th-check i { color: var(--th-teal); font-size: 18px; margin-top: 1px; }
        .th-check b { display: block; color: var(--th-ink); font-size: 12.5px; font-weight: 700; }
        .th-check span { display: block; margin-top: 3px; color: var(--th-muted); font-size: 11.5px; line-height: 1.6; }

        .th-index { border: 1px solid var(--th-line-strong); border-radius: 10px; background: var(--th-panel); overflow: hidden; }
        .th-index-row {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr) 92px;
            gap: 20px;
            align-items: center;
            min-height: 66px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--th-line);
            transition: background .18s;
        }
        .th-index-row:last-child { border-bottom: 0; }
        .th-index-row:hover { background: #f9fbfc; }
        .th-index-name { display: flex; align-items: center; gap: 10px; color: var(--th-ink); font-size: 13.5px; font-weight: 720; }
        .th-index-mark { width: 5px; height: 26px; border-radius: 2px; background: var(--cat-color, var(--th-blue)); }
        .th-index-list { color: var(--th-muted); font-size: 12px; line-height: 1.6; }
        .th-index-count { display: flex; align-items: center; justify-content: flex-end; gap: 9px; color: var(--th-blue); font-family: var(--font-mono); font-size: 10.5px; }
        .th-index-count b { color: var(--th-ink); font-size: 15px; }

        .th-resource-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .th-resource {
            display: grid;
            grid-template-columns: 38px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            min-height: 76px;
            padding: 12px 14px;
            border: 1px solid var(--th-line);
            border-radius: 9px;
            background: var(--th-panel);
            transition: border-color .18s, background .18s;
        }
        .th-resource:hover { border-color: var(--th-line-strong); background: #f9fbfc; }
        .th-resource-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; background: var(--th-panel-muted); color: var(--th-blue); font-size: 18px; }
        .th-resource b { display: block; color: var(--th-ink); font-size: 13px; font-weight: 700; }
        .th-resource span { display: block; margin-top: 3px; color: var(--th-muted); font-size: 11px; }
        .th-resource > i { color: var(--th-subtle); font-size: 15px; }
        .th-mobile-more {
            display: none;
            width: 100%; min-height: 46px; margin-top: 14px;
            align-items: center; justify-content: center; gap: 7px;
            border: 1px solid var(--th-line-strong); border-radius: 9px;
            background: var(--th-panel); color: var(--th-blue);
            font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .th-mobile-more:focus-visible { outline: 3px solid rgba(36,91,120,.28); outline-offset: 2px; }
        .th-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

        @media (max-width: 980px) {
            .th-task-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .th-method-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 760px) {
            .th-shell { width: min(100% - 32px, 1240px); }
            .th-system-bar { gap: 10px; }
            .th-system-bar > span:nth-child(2) { display: none; }
            .th-hero { padding: 40px 0; }
            .th-hero h1 { font-size: clamp(38px, 11vw, 52px); }
            .th-hero-copy { margin-top: 18px; font-size: 15px; }
            .th-hero-actions { margin-top: 22px; }
            .th-section { padding: 40px 0; }
            .th-section-head { grid-template-columns: 1fr; gap: 12px; }
            .th-task-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; border: 0; }
            .th-task { min-height: 142px; padding: 15px; border: 1px solid var(--th-line-strong); border-radius: 10px; }
            .th-task-icon { width: 36px; height: 36px; font-size: 18px; }
            .th-task-kind { font-size: 8.5px; }
            .th-task h3 { margin: 14px 0 0; font-size: 15px; }
            .th-task p { display: none; }
            .th-task-output { padding-top: 12px; font-size: 10.5px; line-height: 1.4; }
            .th-task-closure > summary { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 14px 15px; }
            .th-closure-checks { grid-template-columns: 1fr 1fr; }
            .th-closure-check:nth-child(2) { border-right: 0; }
            .th-closure-check:nth-child(-n + 2) { border-bottom: 1px solid var(--th-line); }
            .th-mobile-more { display: inline-flex; }
            #main-content:not(.mobile-expanded) .th-mobile-secondary { display: none; }
            .th-index-row { grid-template-columns: 112px minmax(0, 1fr) 70px; gap: 12px; }
            .th-resource-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 520px) {
            .th-hero-actions .th-btn { width: 100%; }
            .th-resume { grid-template-columns: auto minmax(0,1fr); }
            .th-resume-link { grid-column: 1 / -1; justify-content: center; }
            .th-closure-checks { grid-template-columns: 1fr; }
            .th-closure-check { border-right: 0; border-bottom: 1px solid var(--th-line); }
            .th-closure-check:nth-child(3) { border-bottom: 1px solid var(--th-line); }
            .th-closure-check:last-child { border-bottom: 0; }
            .th-index-row { grid-template-columns: 1fr auto; }
            .th-index-list { grid-column: 1 / -1; grid-row: 2; }
            .th-resource-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 350px) {
            .th-task-grid { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            .th-root *, .th-root *::before, .th-root *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
<div id="main-nav"></div>

<main id="main-content">
    <div class="th-root">
        <section class="th-hero">
            <div class="th-shell th-hero-grid">
                <div class="th-hero-main">
                    <div class="th-eyebrow" data-site-copy="heroEyebrow">教师 AI 教学实践平台</div>
                    <h1 data-site-copy-headline="heroTitle" data-site-copy-accent="heroAccent">让<span>AI</span>真正走进你的课堂</h1>
                    <p class="th-hero-copy" data-site-copy="heroIntro">从真实教学任务出发，填写背景并获得可编辑初稿；重要事实与课堂适配由教师核验。</p>
                    <div class="th-hero-actions">
                        <a class="th-btn primary" href="#task-start"><i class="ph ph-play-circle"></i><span data-site-copy="primaryAction">选择教学任务</span></a>
                        <a class="th-btn" id="th-personal-link" href="/workspace"><i class="ph ph-notebook"></i>打开我的备课本</a>
                    </div>
                    <div class="th-resume" id="th-resume" aria-live="polite">
                        <span class="th-resume-icon"><i class="ph ph-clock-counter-clockwise"></i></span>
                        <div class="th-resume-copy"><small>CONTINUE WORK</small><b id="th-resume-title"></b><span id="th-resume-meta"></span></div>
                        <a class="th-resume-link" id="th-resume-link" href="/agents"><span>继续</span><i class="ph ph-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </section>

        <section class="th-section" id="task-start">
            <div class="th-shell">
                <div class="th-section-head">
                    <div><h2 data-site-copy="taskHeading">今天要完成什么？</h2></div>
                </div>
                <div class="th-task-grid" id="th-task-grid"></div>
                <details class="th-task-closure th-mobile-secondary">
                    <summary>
                        <span class="th-closure-label"><i class="ph ph-shield-check"></i><span data-site-copy="checklistHeading">使用前核验</span></span>
                        <span class="th-closure-more"><span data-site-copy="checklistAction">查看 4 项</span> <i class="ph ph-caret-down"></i></span>
                    </summary>
                    <div class="th-closure-checks">
                        <div class="th-closure-check"><i class="ph ph-check-circle"></i><span>目标、活动与评价一致</span></div>
                        <div class="th-closure-check"><i class="ph ph-check-circle"></i><span>适合当前学生与课堂条件</span></div>
                        <div class="th-closure-check"><i class="ph ph-check-circle"></i><span>事实和课程依据已经核实</span></div>
                        <div class="th-closure-check"><i class="ph ph-check-circle"></i><span>不输入敏感信息，教师最终定稿</span></div>
                    </div>
                </details>
                <button type="button" class="th-mobile-more" id="th-mobile-more" aria-expanded="false" onclick="toggleHomeDetails()">
                    <span>查看使用提示与配套资源</span><i class="ph ph-caret-down" aria-hidden="true"></i>
                </button>
            </div>
        </section>

        <section class="th-section th-mobile-secondary">
            <div class="th-shell">
                <div class="th-section-head">
                    <div><h2 data-site-copy="resourcesHeading">学习与配套资源</h2></div>
                </div>
                <div class="th-resource-grid">
                    <a class="th-resource" href="/paths"><span class="th-resource-icon"><i class="ph ph-path"></i></span><div><b>学习路径</b><span>系统训练路线</span></div><i class="ph ph-arrow-up-right"></i></a>
                    <a class="th-resource" href="/articles"><span class="th-resource-icon"><i class="ph ph-article"></i></span><div><b>精选文章</b><span>方法、案例与实践</span></div><i class="ph ph-arrow-up-right"></i></a>
                    <a class="th-resource" href="/tools"><span class="th-resource-icon"><i class="ph ph-toolbox"></i></span><div><b>AI 资源精选</b><span>第三方产品导航</span></div><i class="ph ph-arrow-up-right"></i></a>
                    <a class="th-resource" href="/resources"><span class="th-resource-icon"><i class="ph ph-folder-open"></i></span><div><b>课件素材</b><span>图片、图标与免抠素材</span></div><i class="ph ph-arrow-up-right"></i></a>
                    <a class="th-resource" href="/news"><span class="th-resource-icon"><i class="ph ph-newspaper"></i></span><div><b>AI 资讯</b><span>教育 AI 动态</span></div><i class="ph ph-arrow-up-right"></i></a>
                    <a class="th-resource" href="/prompts"><span class="th-resource-icon"><i class="ph ph-quotes"></i></span><div><b>提示词库</b><span>可复用提示词</span></div><i class="ph ph-arrow-up-right"></i></a>
                </div>
            </div>
        </section>
    </div>

    <div class="home-main th-mobile-secondary" id="home-announcements" hidden>
        <div id="announcements-section"></div>
    </div>
</main>

<div id="main-footer"></div>

<script src="/vendor/firebase/10.12.0/firebase-app-compat.js"></script>

<script src="/vendor/firebase/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/safe-render.js?v=20260719-security"></script>
<script src="js/firebase-config.js?v=20260822-phase1"></script>
<script src="js/data.js?v=20260823-page-copy"></script>
<script src="js/site-copy.js?v=20260823-page-copy"></script>
<script src="js/auth.js?v=20260823-content-team-workbook"></script>
<script src="js/analytics.js?v=20260707-analytics"></script>
<script src="js/pwa.js?v=20260822-phase1"></script>
<script src="js/assistant.js?v=20260821-tencent"></script>
<script src="js/agents-data.js?v=20260712-workbench"></script>
<script src="js/teaching-projects.js?v=20260712-project-flow"></script>
<script>
renderNav('index');
renderFooter();

let homePageCopy = SiteCopy.defaults('home');
SiteCopy.load('home').then(copy => {
    homePageCopy = SiteCopy.applyToDocument('home', copy);
    updateHomePersonalLink(Auth.getCurrentUser());
});

function homeEscape(value) {
    return String(value || '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

DB.getAnnouncements().then(announcements => {
    if (!announcements || !announcements.length) return;
    document.getElementById('home-announcements').hidden = false;
    document.getElementById('announcements-section').innerHTML = `
        <section>
            <div class="section-header compact"><h2><i class="ph ph-megaphone" style="color:var(--brand);margin-right:8px"></i>平台公告</h2></div>
            ${announcements.map(item => `<div class="announcement"><strong>${homeEscape(item.title)}</strong><p>${homeEscape(item.content)}</p><small style="color:var(--muted);font-size:11px">${new Date(item.createdAt).toLocaleDateString('zh-CN')}</small></div>`).join('')}
        </section>`;
}).catch(() => {});

function updateHomeAccountState(user) {
    renderNav('index');
    renderFooter();
    updateHomePersonalLink(user);
    renderHomeContinuation();
}

function updateHomePersonalLink(user) {
    const link = document.getElementById('th-personal-link');
    if (!link) return;
    const icon = document.createElement('i');
    icon.className = 'ph ph-notebook';
    const label = user ? homePageCopy.workbookActionMember : homePageCopy.workbookActionGuest;
    link.replaceChildren(icon, document.createTextNode(label));
}

onAuthReady(updateHomeAccountState);

function renderHomeContinuation() {
    const box = document.getElementById('th-resume');
    if (!box || !window.TeachingProjects) return;
    const project = TeachingProjects.getActiveProject();
    const draft = TeachingProjects.listDrafts()[0];
    if (!project && !draft) {
        box.classList.remove('active');
        return;
    }
    const agent = (window.AGENTS || []).find(item => item.id === draft?.agentId);
    const context = project ? [project.grade, project.subject, project.topic].filter(Boolean).join(' · ') : '';
    document.getElementById('th-resume-title').textContent = project?.title || `${agent?.name || '智能体'}未完成草稿`;
    document.getElementById('th-resume-meta').textContent = [context, draft ? `${agent?.name || '任务'}草稿已自动保存` : '继续当前教学项目'].filter(Boolean).join(' · ');
    const link = document.getElementById('th-resume-link');
    link.href = draft?.agentId ? `/agents#${encodeURIComponent(draft.agentId)}` : '/agents#lesson-design';
    link.querySelector('span').textContent = draft ? '恢复草稿' : '继续项目';
    box.classList.add('active');
}

renderHomeContinuation();

function syncHomeDetailsToggle() {
    const main = document.getElementById('main-content');
    const button = document.getElementById('th-mobile-more');
    if (!main || !button) return;
    const expanded = main.classList.contains('mobile-expanded');
    button.setAttribute('aria-expanded', String(expanded));
    button.querySelector('span').textContent = expanded ? '收起使用提示与配套资源' : '查看使用提示与配套资源';
    button.querySelector('i').className = `ph ${expanded ? 'ph-caret-up' : 'ph-caret-down'}`;
}

function toggleHomeDetails() {
    const main = document.getElementById('main-content');
    if (!main) return;
    const expanded = main.classList.toggle('mobile-expanded');
    try { sessionStorage.setItem('xylaoshi:home-mobile-details', expanded ? '1' : '0'); } catch (_) {}
    syncHomeDetailsToggle();
}

try {
    if (sessionStorage.getItem('xylaoshi:home-mobile-details') === '1') {
        document.getElementById('main-content')?.classList.add('mobile-expanded');
    }
} catch (_) {}
syncHomeDetailsToggle();

(function renderHomeWorkbench() {
    const agents = window.AGENTS || [];
    const agentMap = Object.fromEntries(agents.map(agent => [agent.id, agent]));
    const count = agents.length || 19;
    document.querySelectorAll('.th-agent-count').forEach(element => { element.textContent = count; });

    const taskConfigs = [
        { id: 'lesson-design', title: '备一节课', output: '完整教学设计', kind: '备课设计', icon: 'ph-blueprint', color: '#287a68', soft: '#e5f2ef' },
        { id: 'quiz-gen', title: '设计练习与检测', output: '题目、答案与解析', kind: '作业评价', icon: 'ph-exam', color: '#245b78', soft: '#e7f0f5' },
        { id: 'homework-grader', title: '批改并诊断作业', output: '批改意见与改进建议', kind: '作业评价', icon: 'ph-check-square-offset', color: '#a24b45', soft: '#f8eceb' },
        { id: 'parent-comm', title: '准备家校沟通', output: '沟通文本或谈话提纲', kind: '班级家校', icon: 'ph-chats-teardrop', color: '#9a681d', soft: '#faf1df' },
        { id: 'class-activity', title: '设计课堂活动', output: '可执行的课堂活动方案', kind: '课堂教学', icon: 'ph-users-three', color: '#356b83', soft: '#e8f0f4' },
        { id: 'teaching-reflection', title: '完成教学复盘', output: '问题分析与改进计划', kind: '教师发展', icon: 'ph-notebook', color: '#5c6e7b', soft: '#edf1f3' }
    ];

    const taskGrid = document.getElementById('th-task-grid');
    taskGrid.innerHTML = taskConfigs.map(config => {
        const agent = agentMap[config.id] || {};
        const description = agent.desc || '进入相应工作台，按步骤完成任务。';
        return `<a class="th-task" href="/agents#${config.id}" style="--task-color:${config.color};--task-soft:${config.soft}">
            <div class="th-task-top"><span class="th-task-icon"><i class="ph ${config.icon}"></i></span><span class="th-task-kind">${config.kind}</span></div>
            <h3>${config.title}</h3>
            <p>${homeEscape(description)}</p>
            <div class="th-task-output"><span>输出：${config.output}</span><i class="ph ph-arrow-right"></i></div>
        </a>`;
    }).join('');

})();
</script>
</body>
</html>
