<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>重置登录密码</title></head>
<body style="margin:0;background:#f3f6f8;color:#3d4a57;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <div style="max-width:560px;margin:0 auto;padding:32px 18px">
    <div style="background:#ffffff;border:1px solid #d7e0e6;border-radius:14px;padding:30px">
      <div style="font-size:14px;font-weight:700;color:#17212b;margin-bottom:22px">AI 教师培训中心</div>
      <h1 style="font-size:26px;line-height:1.35;color:#17212b;margin:0 0 14px">重置登录密码</h1>
      <p style="font-size:15px;line-height:1.8;margin:0 0 22px">我们收到了您重置 AI 教师培训中心登录密码的请求。请通过下面的安全链接设置新密码，修改成功后其他设备上的旧登录会话将失效。</p>
      <p style="margin:0 0 22px"><a href="https://ai.teachailab.com/api/email-action?mode=localResetPassword&amp;token={{token}}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#245b78;color:#ffffff;text-decoration:none;font-weight:700">设置新密码</a></p>
      <p style="font-size:13px;line-height:1.7;color:#667482;margin:0">此链接在发送后 30 分钟内有效，且只能使用一次。如果这不是您本人操作，请忽略此邮件，原密码不会因此改变。</p>
      <p style="font-size:12px;line-height:1.7;color:#7c8994;word-break:break-all;margin:18px 0 0">按钮无法点击时，请复制以下地址到浏览器：<br>https://ai.teachailab.com/api/email-action?mode=localResetPassword&amp;token={{token}}</p>
    </div>
  </div>
</body>
</html>
