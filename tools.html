// 把工具的分类归一到新方案 + 附上标签（未登记的工具落入「更多工具」）
function applyMeta(list) {
    const seen = new Set();
    return (list || []).filter(tool => {
        let canonical = tool.url || '';
        try { const url = new URL(canonical); canonical = url.hostname.toLowerCase() + url.pathname.replace(/\/+$/, ''); } catch {}
        const key = String(tool.name || '').trim().toLowerCase() + '|' + canonical;
        if (seen.has(key)) return false;
        seen.add(key); return true;
    }).map(t => {
        const m = TOOL_META[t.name] || {};
        const legacyCategory = { teaching:'plan', search:'plan', creation:'make', dev:'platform' }[t.category];
        const inferredMedia = /数字人|视频|音乐|图像|绘图/.test((t.name || '') + (t.desc || '')) ? 'media' : '';
        const category = CAT_ORDER.includes(t.taskCategory) ? t.taskCategory : (m.cat || inferredMedia || legacyCategory || 'more');
        const tags = Array.isArray(t.tags) ? t.tags : String(t.tags || '').split(/[、,，]/).map(tag => tag.trim()).filter(Boolean);
        return { ...t, category, _tags: tags.length ? tags : (m.tags || []), _fit: t.fit || m.fit || CAT_FITS[category] };
    });
}

let currentCat = 'all';
let currentTag = 'all';
let _allTools = [];
function esc(s) { return SafeRender.escape(s); }

// 筛选栏按「实际有工具的分类」动态生成（修掉以前漏列的分类）
function buildFilterBar() {
    const present = CAT_ORDER.filter(k => _allTools.some(t => t.category === k));
    const cats = [{ key:'all', label:toolsPageCopy.allFilter }, ...present.map(k => ({ key:k, label:CAT_LABELS[k] }))];
    document.getElementById('filter-bar').innerHTML = cats.map(c =>
        `<button type="button" class="filter-pill${c.key===currentCat?' active':''}" aria-pressed="${c.key===currentCat}" onclick="setCat('${c.key}')">${c.label}</button>`
    ).join('');
    document.getElementById('tag-filter-bar').innerHTML = [{ key:'all', label:toolsPageCopy.allConditions }, ...TAG_FILTERS.map(t => ({ key:t, label:t }))].map(c =>
        `<button type="button" class="filter-pill${c.key===currentTag?' active':''}" aria-pressed="${c.key===currentTag}" onclick="setTag('${c.key}')">${c.label}</button>`
    ).join('');
}

function setCat(key) {
    currentCat = key;
    buildFilterBar();
    renderTools();
}

function setTag(key) {
    currentTag = key;
    buildFilterBar();
    renderTools();
}

function toolLogoMarkup(tool) {
    const name = String(tool.name || '工具').trim();
    const key = name.toLowerCase();
    const customLogo = typeof tool.logo === 'string' && /^\/assets\/resource-logos\/[a-z0-9-]+\.(?:png|svg|webp)$/i.test(tool.logo) ? tool.logo : '';
    const logo = TOOL_LOGOS[key] || customLogo;
    const fallback = `<span class="tt-tool-logo-fallback ${SafeRender.classNames(tool.bg)} ${SafeRender.classNames(tool.color)}" aria-hidden="true"><i class="ph-fill ${SafeRender.classNames(tool.icon, 'ph-toolbox')}"></i></span>`;
    return logo
        ? `<span class="tt-tool-logo"><img src="${esc(logo)}" alt="" loading="lazy" decoding="async" data-tool-logo>${fallback}</span>`
        : `<span class="tt-tool-logo is-fallback">${fallback}</span>`;
}

function bindToolLogoFallbacks(root) {
    root.querySelectorAll('[data-tool-logo]').forEach(image => {
        const showFallback = () => image.closest('.tt-tool-logo')?.classList.add('is-fallback');
        image.addEventListener('error', showFallback, { once:true });
        if (image.complete && !image.naturalWidth) showFallback();
    });
}

function toolCardHTML(t) {
    const safeToolUrl = SafeRender.safeUrl(t.url);
    if (!safeToolUrl) return '';
    return `
        <a href="${esc(safeToolUrl)}" target="_blank" rel="noopener noreferrer" class="card tool-card tt-tool-card" style="display:flex;flex-direction:column;position:relative">
            <div class="tt-card-top">
                ${toolLogoMarkup(t)}
                <div class="tt-tool-name">${esc(t.name)}</div>
            </div>
            <div class="tt-tool-desc">${esc(t.desc)}</div>
        </a>`;
}

function renderTools() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const grid = document.getElementById('tools-grid');
    const grouped = document.getElementById('tools-grouped');

    // 搜索 或 选了具体分类 → 单层网格
    if (q || currentCat !== 'all') {
        const filtered = _allTools.filter(t => {
            const matchCat = currentCat === 'all' || t.category === currentCat;
            const matchTag = currentTag === 'all' || (t._tags || []).includes(currentTag);
            const text = `${t.name || ''} ${t.desc || ''} ${(t._tags || []).join(' ')} ${t._fit || ''}`.toLowerCase();
            const matchQ = !q || text.includes(q);
            return matchCat && matchTag && matchQ;
        });
        document.getElementById('count-label').textContent = `当前显示 ${filtered.length} / ${_allTools.length} 个工具`;
        document.getElementById('empty-state').style.display = filtered.length ? 'none' : 'block';
        grouped.style.display = 'none'; grouped.innerHTML = '';
        grid.style.display = ''; grid.innerHTML = filtered.map(toolCardHTML).join('');
        bindToolLogoFallbacks(grid);
        return;
    }

    // 默认「全部」且无搜索 → 按分类分组陈列，缓解一屏展示全部工具的选择过载
    const visibleCount = _allTools.filter(t => currentTag === 'all' || (t._tags || []).includes(currentTag)).length;
    document.getElementById('count-label').textContent = currentTag === 'all'
        ? `共 ${_allTools.length} 个工具，按教学任务分组`
        : `当前显示 ${visibleCount} / ${_allTools.length} 个工具，按教学任务分组`;
    document.getElementById('empty-state').style.display = visibleCount ? 'none' : 'block';
    grid.style.display = 'none'; grid.innerHTML = '';
    const known = new Set(CAT_ORDER);
    const present = CAT_ORDER.filter(k => _allTools.some(t => t.category === k));
    const others = [...new Set(_allTools.map(t => t.category).filter(c => !known.has(c)))];
    grouped.style.display = visibleCount ? '' : 'none';
    grouped.innerHTML = [...present, ...others].map(cat => {
        const items = _allTools.filter(t => t.category === cat && (currentTag === 'all' || (t._tags || []).includes(currentTag)));
        if (!items.length) return '';
        const catColor = CAT_COLORS[cat] || CAT_COLORS.more;
        return `
        <section class="tt-section" style="--cat:${catColor}">
            <div class="tt-section-head">
                <div class="tt-section-icon"><i class="ph ${CAT_ICONS[cat] || CAT_ICONS.more}"></i></div>
                <div>
                    <h2 class="tt-section-title">${CAT_LABELS[cat] || '其他'}</h2>
                </div>
                <span class="tt-section-count">${items.length} 个</span>
            </div>
            <div class="cards-grid cards-grid-4">${items.map(toolCardHTML).join('')}</div>
        </section>`;
    }).join('');
    bindToolLogoFallbacks(grouped);
}
