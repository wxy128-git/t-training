    <meta charset="UTF-8">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://ai.teachailab.com/assets/og/resources.jpg">
    <link rel="canonical" href="https://ai.teachailab.com/resources">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png">
    <meta name="theme-color" content="#17212b">
    <meta name="application-name" content="AI 教师培训中心">

</head>
<body>
<div id="main-nav"></div>

<main class="resource-page" id="main-content">
    <section class="resource-hero">
        <div>
            <div style="font-family:var(--font-mono);font-size:11.5px;color:var(--brand);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:14px;font-weight:500" data-site-copy="heroKicker">素材入口</div>
            <h1 data-site-copy-headline="heroTitle" data-site-copy-accent="heroAccent">课件<span style="font-style:italic;color:var(--brand)">素材</span></h1>
            <p data-site-copy="heroIntro">搜索图片、图标、免抠素材与生成平台。</p>
        </div>
        <div class="resource-search">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="搜索资源名称或描述…" data-site-copy-placeholder="searchPlaceholder">
        </div>
    </section>

    <div id="content-area" class="resource-content"></div>

    <div id="no-results" class="resource-empty" hidden>
        <i class="ph ph-magnifying-glass"></i>
        <p data-site-copy="emptyMessage">没有找到相关资源，换个关键词试试</p>
    </div>
</main>

<div id="main-footer"></div>

<script src="/vendor/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/vendor/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/vendor/firebase/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/safe-render.js?v=20260719-security"></script>
<script src="js/firebase-config.js?v=20260822-phase1"></script>
<script src="js/data.js?v=20260823-page-copy"></script>
<script src="js/site-copy.js?v=20260824-agent-directory"></script>
<script src="js/auth.js?v=20260823-content-team-workbook"></script>
<script src="js/analytics.js?v=20260707-analytics"></script>
<script>
SiteCopy.load('resources').then(copy => SiteCopy.applyToDocument('resources', copy));

// Start with the in-code defaults so the page paints immediately,
// then swap in whatever Firestore returns.
let categories = JSON.parse(JSON.stringify(DEFAULT_RESOURCES));

function renderContent(filterText = '') {
    const container = document.getElementById('content-area');
    const noResults = document.getElementById('no-results');
    const query = filterText.toLowerCase();
    let hasResults = false;

    container.innerHTML = categories.map(category => {
        const filteredItems = (category.items || []).filter(item =>
            item.name.toLowerCase().includes(query) ||
            item.desc.toLowerCase().includes(query) ||
            category.title.toLowerCase().includes(query)
        );
        if (!filteredItems.length) return '';
        hasResults = true;
        return `
            <section class="resource-section">
                <div class="resource-section-title">
                    <span class="${SafeRender.classNames(category.bg)} ${SafeRender.classNames(category.color)}"><i class="ph-fill ${SafeRender.classNames(category.icon, 'ph-folder')}"></i></span>
                    <h2>${SafeRender.escape(category.title)}</h2>
                </div>
                <div class="resource-grid">
                    ${filteredItems.map(item => {
                        const safeItemUrl = SafeRender.safeUrl(item.url);
                        if (!safeItemUrl) return '';
                        const domain = new URL(safeItemUrl, location.href).hostname.replace('www.', '');
                        return `
                            <a href="${SafeRender.escape(safeItemUrl)}" target="_blank" rel="noopener noreferrer" class="resource-card">
                                <div class="resource-card-top">
                                    <i class="ph-bold ${SafeRender.classNames(item.itemIcon, 'ph-link')}"></i>
                                    <h3>${SafeRender.escape(item.name)}</h3>
                                    <span><i class="ph-bold ph-arrow-up-right"></i></span>
                                </div>
                                <p>${SafeRender.escape(item.desc)}</p>
                                <div class="resource-domain">${SafeRender.escape(domain)}</div>
                            </a>
                        `;
                    }).join('')}
                </div>
            </section>
        `;
    }).join('');

    noResults.hidden = hasResults;
}

renderContent();
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', event => renderContent(event.target.value.trim()));

renderNav('resources');
renderFooter();
onAuthReady(() => { renderNav('resources'); renderFooter(); });

DB.getResources().then(data => {
    if (Array.isArray(data) && data.length) {
        categories = data;
        renderContent(searchInput.value.trim());
    }
});
</script>
<script src="js/pwa.js?v=20260822-phase1"></script>
<script src="js/assistant.js?v=20260821-tencent"></script>
</body>
</html>
