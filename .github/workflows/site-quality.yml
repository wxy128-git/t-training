name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check site structure and security invariants
        run: node scripts/check-site.mjs
      - name: Test rendering and Pages Function behavior
        run: node scripts/test-functions.mjs
      - name: Test Tencent Cloud Node adapter
        run: node scripts/test-tencent-server.mjs
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Check Pages Functions syntax
        shell: bash
        run: |
          for file in functions/api/*.js; do
            cp "$file" /tmp/pages-function-check.mjs
            node --check /tmp/pages-function-check.mjs
          done
          node --check server/tencent-api.mjs
