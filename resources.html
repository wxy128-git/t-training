<body>
<div id="main-nav"></div>

<main class="resource-page" id="main-content">
    <section class="resource-hero resource-hero-directory">
        <div class="resource-hero-copy">
            <div class="resource-kicker">
                <span class="resource-kicker-mark" data-site-copy="heroKicker">素材入口</span>
                <span class="resource-kicker-note">课件设计常用网站</span>
            </div>
            <h1 data-site-copy-headline="heroTitle" data-site-copy-accent="heroAccent">课件<span class="site-copy-accent">素材</span></h1>
            <p data-site-copy="heroIntro">搜索图片、图标、免抠素材与生成平台。</p>
        </div>
        <div class="resource-hero-tools">
            <div class="resource-search-label">想找什么素材？</div>
            <label class="resource-search">
                <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="searchInput" placeholder="搜索资源名称或描述…" aria-label="搜索课件素材" data-site-copy-placeholder="searchPlaceholder">
                <button type="button" id="resource-search-clear" class="resource-search-clear" aria-label="清除搜索" hidden><i class="ph-bold ph-x" aria-hidden="true"></i></button>
            </label>
            <div class="resource-search-hint"><i class="ph ph-info" aria-hidden="true"></i><span>点击卡片会在新窗口打开对应官网。</span></div>
        </div>
    </section>

    <div class="resource-workbench resource-directory">
        <section class="resource-filter-bar" aria-label="筛选素材网站">
            <div class="resource-filter-summary"><strong>快速筛选</strong><span id="resource-match-count">全部 28 个入口</span></div>
            <div id="resource-category-pills" class="resource-category-pills"></div>
            <button type="button" id="resource-reset" class="resource-reset" hidden><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i>清除筛选</button>
        </section>
        <section class="resource-shelf" aria-label="素材网站列表">
            <div id="content-area" class="resource-content"></div>
            <div id="no-results" class="resource-empty" hidden>
                <div class="resource-empty-mark"><i class="ph ph-compass" aria-hidden="true"></i></div>
                <p data-site-copy="emptyMessage">没有找到相关资源，换个关键词试试</p>
                <span>可以试试网站名、用途或分类名称。</span>
            </div>
        </section>
    </div>
</main>

<div id="main-footer"></div>

<script src="/vendor/firebase/10.12.0/firebase-app-compat.js"></script>
<script src="/vendor/firebase/10.12.0/firebase-auth-compat.js"></script>
<script src="/vendor/firebase/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/safe-render.js?v=20260719-security"></script>
<script src="js/account-policy.js?v=20260924-local-email-direct"></script>
<script src="js/firebase-config.js?v=20260924-local-email-direct"></script>
<script src="js/data.js?v=20260924-local-email-direct"></script>
<script src="js/site-copy.js?v=20260924-local-email-direct"></script>
<script src="js/auth.js?v=20260924-local-email-direct"></script>
<script src="js/email-gate.js?v=20260924-local-email-direct"></script>
<script src="js/analytics.js?v=20260924-local-email-direct"></script>
<script>
SiteCopy.load('resources').then(copy => SiteCopy.applyToDocument('resources', copy));

// Start with the in-code defaults so the page paints immediately,
// then swap in whatever Firestore returns.
let categories = JSON.parse(JSON.stringify(DEFAULT_RESOURCES));
let activeCategory = 'all';

const RESOURCE_LOGOS = Object.freeze({
    unsplash: '/assets/resource-logos/unsplash.png',
    pexels: '/assets/resource-logos/pexels.png',
    pixabay: '/assets/resource-logos/pixabay.png',
    picjumbo: '/assets/resource-logos/picjumbo.png',
    lifeofpix: '/assets/resource-logos/lifeofpix.png',
    'life of pix': '/assets/resource-logos/lifeofpix.png',
    burst: '/assets/resource-logos/burst.png',
    cleanpng: '/assets/resource-logos/cleanpng.png',
    stickpng: '/assets/resource-logos/stickpng-icon.png',
    'stickpng.com': '/assets/resource-logos/stickpng-icon.png',
    pngtree: '/assets/resource-logos/pngtree.png',
    pngimg: '/assets/resource-logos/pngimg.png',
    iconfinder: '/assets/resource-logos/iconfinder.png',
    iconpark: '/assets/resource-logos/iconpark.png',
    iconfont: '/assets/resource-logos/iconfont.png',
    iconmonstr: '/assets/resource-logos/iconmonstr.png',
    bgsub: '/assets/resource-logos/bgsub.png',
    趣作图: '/assets/resource-logos/quzuotu-icon.png',
    quzuotu: '/assets/resource-logos/quzuotu-icon.png',
    'quzuotu.com': '/assets/resource-logos/quzuotu-icon.png',
    pixian: '/assets/resource-logos/pixian.png',
    ai好记: '/assets/resource-logos/aihaoji.png',
    aihaoji: '/assets/resource-logos/aihaoji.png',
    快出题: '/assets/resource-logos/kuaichuti.svg',
    kuaichuti: '/assets/resource-logos/kuaichuti.svg',
    棒棒糖ai: '/assets/resource-logos/bangbangtang.png',
    bangbangtang: '/assets/resource-logos/bangbangtang.png',
    'nano banana': '/assets/resource-logos/gemini.png',
    gemini: '/assets/resource-logos/gemini.png',
    gamma: '/assets/resource-logos/gamma.png',
    秘塔搜索: '/assets/resource-logos/metaso.png',
    metaso: '/assets/resource-logos/metaso.png',
    海绵音乐: '/assets/resource-logos/haimian.png',
    haimian: '/assets/resource-logos/haimian.png',
    飞象老师: '/assets/resource-logos/feixianglaoshi.webp',
    feixianglaoshi: '/assets/resource-logos/feixianglaoshi.webp',
    即梦ai: '/assets/resource-logos/jimeng.png',
    jimeng: '/assets/resource-logos/jimeng.png',
    coze: '/assets/resource-logos/coze.png',
    扣子: '/assets/resource-logos/coze.png',
    飞影数字人: '/assets/resource-logos/feiying.png',
    feiying: '/assets/resource-logos/feiying.png',
    字由: '/assets/resource-logos/hellofont-icon.png',
    hellofont: '/assets/resource-logos/hellofont-icon.png',
    'hellofont.cn': '/assets/resource-logos/hellofont-icon.png',
    '100font': '/assets/resource-logos/100font-icon.png',
    '100font.com': '/assets/resource-logos/100font-icon.png',
    字魂: '/assets/resource-logos/izihun-icon.png',
    izihun: '/assets/resource-logos/izihun-icon.png',
    'izihun.com': '/assets/resource-logos/izihun-icon.png'
});

function resourceLogoFor(item, domain) {
    const customLogo = typeof item.logo === 'string' && (
        /^\/assets\/resource-logos\/[a-z0-9-]+\.(?:png|svg|webp)$/i.test(item.logo)
        || /^\/api\/resource-logo\?file=[a-f0-9]{24}\.(?:png|jpg|webp|gif|ico)$/i.test(item.logo)
    ) ? item.logo : '';
    const name = String(item.name || '').trim().toLowerCase();
    return customLogo || RESOURCE_LOGOS[name] || RESOURCE_LOGOS[domain] || '';
}

function resourceInitials(name) {
    const compact = String(name || '网站').replace(/[^\p{L}\p{N}]/gu, '');
    return compact.slice(0, 2).toUpperCase() || '网站';
}

function resourceLogoMarkup(item, logo) {
    const name = String(item.name || '网站').trim();
    const normalized = name.toLowerCase();
    if (normalized === 'pngimg') {
        return '<span class="resource-logo-frame resource-logo-wordmark" aria-hidden="true"><span><b>pngimg</b>.com</span></span>';
    }
    const fallback = `<span class="resource-logo-fallback" aria-hidden="true">${SafeRender.escape(resourceInitials(name))}</span>`;
    return logo
        ? `<span class="resource-logo-frame"><img src="${SafeRender.escape(logo)}" alt="" loading="lazy" decoding="async" data-resource-logo>${fallback}</span>`
        : `<span class="resource-logo-frame is-fallback">${fallback}</span>`;
}

function resourceItemsCount() {
    return categories.reduce((total, category) => total + (Array.isArray(category.items) ? category.items.length : 0), 0);
}

function compactResourceDescription(value) {
    return reviewTeachingText(value)
        .replace('摄影与插图素材；使用范围与限制请查阅官方许可', '免费高分辨率摄影与插图素材')
        .replace('图片、视频与音频素材；使用前查阅官方许可及具体素材说明', '支持中文搜索的图片、视频与音频素材');
}

function renderCategoryPills() {
    const pills = document.getElementById('resource-category-pills');
    if (!pills) return;
    const allCount = resourceItemsCount();
    const entries = [{ id: 'all', title: '全部素材', count: allCount, icon: 'ph-squares-four' }, ...categories.map(category => ({
        id: String(category.id || category.title || '').toLowerCase(),
        title: String(category.title || '未分类'),
        count: Array.isArray(category.items) ? category.items.length : 0,
        icon: SafeRender.classNames(category.icon, 'ph-folder')
    }))];
    pills.innerHTML = entries.map(entry => `
        <button type="button" class="resource-category-pill${activeCategory === entry.id ? ' is-active' : ''}" data-resource-category="${SafeRender.escape(entry.id)}" aria-pressed="${activeCategory === entry.id}">
            <span class="resource-category-icon"><i class="ph ${entry.icon}" aria-hidden="true"></i></span>
            <span class="resource-category-copy"><strong>${SafeRender.escape(entry.title)}</strong><small>${entry.count} 个网站</small></span>
            <i class="ph ph-caret-right resource-category-caret" aria-hidden="true"></i>
        </button>
    `).join('');
    const categoryCount = document.getElementById('resource-category-count');
    if (categoryCount) categoryCount.textContent = `${categories.length} 类`;
}

function bindLogoFallbacks(container) {
    container.querySelectorAll('[data-resource-logo]').forEach(image => {
        image.addEventListener('error', () => {
            const frame = image.closest('.resource-logo-frame');
            if (frame) frame.classList.add('is-fallback');
            image.remove();
        }, { once: true });
    });
}

function renderContent(filterText = '') {
    const container = document.getElementById('content-area');
    const noResults = document.getElementById('no-results');
    const query = String(filterText || '').trim().toLocaleLowerCase();
    let hasResults = false;
    let matchCount = 0;
    const totalCount = resourceItemsCount();

    container.innerHTML = categories.map(category => {
        const categoryId = String(category.id || category.title || '').toLowerCase();
        if (activeCategory !== 'all' && categoryId !== activeCategory) return '';
        const filteredItems = (category.items || []).filter(item => {
            const haystack = [item.name, item.desc, category.title].map(value => String(value || '').toLocaleLowerCase()).join(' ');
            return !query || haystack.includes(query);
        });
        if (!filteredItems.length) return '';
        hasResults = true;
        matchCount += filteredItems.length;
        return `
            <section class="resource-section resource-section-${SafeRender.classNames(categoryId, 'resources')}" data-resource-section="${SafeRender.escape(categoryId)}">
                <div class="resource-section-title">
                    <span class="resource-section-icon ${SafeRender.classNames(category.bg)} ${SafeRender.classNames(category.color)}"><i class="ph-fill ${SafeRender.classNames(category.icon, 'ph-folder')}"></i></span>
                    <div><h2>${SafeRender.escape(category.title || '未分类')}</h2><p>${filteredItems.length} 个网站</p></div>
                    ${activeCategory === 'all' && !query ? `<button type="button" class="resource-section-more" data-resource-view="${SafeRender.escape(categoryId)}">更多 <i class="ph ph-caret-right" aria-hidden="true"></i></button>` : ''}
                </div>
                <div class="resource-grid">
                    ${filteredItems.map(item => {
                        const safeItemUrl = SafeRender.safeUrl(item.url);
                        if (!safeItemUrl) return '';
                        const domain = new URL(safeItemUrl, location.href).hostname.replace(/^www\./, '');
                        const logo = resourceLogoFor(item, domain);
                        return `
                            <div class="resource-entry">
                                <a href="${SafeRender.escape(safeItemUrl)}" target="_blank" rel="noopener noreferrer" class="resource-card">
                                    <div class="resource-card-top">
                                        ${resourceLogoMarkup(item, logo)}
                                        <div class="resource-card-name"><h3>${SafeRender.escape(item.name || '未命名资源')}</h3></div>
                                    </div>
                                    <p>${SafeRender.escape(compactResourceDescription(item.desc || '打开官网查看可用素材。'))}</p>
                                </a>
                            </div>
                        `;
                    }).join('')}
                </div>
            </section>
        `;
    }).join('');

    document.getElementById('resource-match-count').textContent = query || activeCategory !== 'all' ? `显示 ${matchCount} 个入口` : `全部 ${totalCount} 个入口`;
    noResults.hidden = hasResults;
    document.getElementById('resource-search-clear').hidden = !query;
    document.getElementById('resource-reset').hidden = !query && activeCategory === 'all';
    bindLogoFallbacks(container);
}

renderCategoryPills();
renderContent();
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', event => renderContent(event.target.value));
document.getElementById('resource-search-clear').addEventListener('click', () => {
    searchInput.value = '';
    searchInput.focus();
    renderContent();
});
document.getElementById('resource-reset').addEventListener('click', () => {
    activeCategory = 'all';
    searchInput.value = '';
    renderCategoryPills();
    renderContent();
});
document.getElementById('resource-category-pills').addEventListener('click', event => {
    const button = event.target.closest('[data-resource-category]');
    if (!button) return;
    activeCategory = button.dataset.resourceCategory || 'all';
    renderCategoryPills();
    renderContent(searchInput.value);
});
document.getElementById('content-area').addEventListener('click', event => {
    const button = event.target.closest('[data-resource-view]');
    if (!button) return;
    activeCategory = button.dataset.resourceView || 'all';
    renderCategoryPills();
    renderContent(searchInput.value);
    document.querySelector('.resource-filter-bar')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

renderNav('resources');
renderFooter();
onAuthReady(() => { renderNav('resources'); renderFooter(); });

DB.getResources().then(data => {
    if (Array.isArray(data) && data.length) {
        categories = data;
        renderCategoryPills();
        renderContent(searchInput.value);
    }
});
</script>
<script src="js/pwa.js?v=20260924-local-email-direct"></script>
<script src="js/assistant.js?v=20260924-local-email-direct"></script>
</body>
</html>
