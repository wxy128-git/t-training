<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 · AI 教师培训中心</title>
    <meta name="description" content="阅读教师 AI 教学领域的精选文章详情。">
    <meta property="og:title" content="文章详情">
    <meta property="og:description" content="阅读教师 AI 教学领域的精选文章详情。">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://xylaoshi.pages.dev/article">
    <meta property="og:image" content="https://xylaoshi.pages.dev/assets/og/article.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://xylaoshi.pages.dev/assets/og/article.jpg">
    <link rel="canonical" href="https://xylaoshi.pages.dev/article">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png">
    <meta name="theme-color" content="#17212b">
    <meta name="application-name" content="AI 教师培训中心">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AI 教研">
    <link rel="stylesheet" href="css/style.css?v=20260719-a11y">
    <link rel="stylesheet" href="css/pwa.css?v=20260715-pwa2">
    <script type="application/ld+json" id="article-jsonld">{}</script>
    <style>
        .article-page-cover {
            width: 100%; height: 260px;
            display: flex; align-items: center; justify-content: center;
            font-size: 76px; position: relative; overflow: hidden;
        }
        .article-page-cover::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 40%, rgba(26,22,18,0.18));
        }
        @media(max-width:640px){ .article-page-cover{ height: 180px; font-size: 56px; } }
    </style>
</head>
<body>
<div id="main-nav"></div>

<main id="main-content" style="max-width:840px;margin:0 auto;padding:56px 24px 88px">
    <div class="breadcrumb">
        <a href="/">首页</a>
        <i class="ph ph-caret-right"></i>
        <a href="/articles">精选文章</a>
        <i class="ph ph-caret-right"></i>
        <span id="bc-title">文章详情</span>
    </div>

    <!-- Loading state -->
    <div id="article-loading" style="padding:60px 20px;text-align:center;color:var(--subtle)">
        <div style="width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px"></div>
        <p>正在加载文章…</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <!-- Article content -->
    <article id="article-body" style="display:none">
        <div id="article-cover" class="article-page-cover" style="border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);margin-bottom:28px"></div>

        <!-- Header -->
        <div style="margin-bottom:32px">
            <div id="article-cat" style="margin-bottom:14px"></div>
            <h1 id="article-title" style="font-family:var(--font-display);font-size:clamp(28px,3.8vw,44px);font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:18px;letter-spacing:-0.028em"></h1>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)">
                <div style="display:flex;align-items:center;gap:10px">
                    <div id="author-avatar" style="width:36px;height:36px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--soft);box-shadow:0 2px 6px rgba(150,43,31,0.22)"></div>
                    <div>
                        <div id="author-name" style="font-size:13.5px;font-weight:600;color:var(--ink)"></div>
                        <div id="article-date" style="font-size:11.5px;color:var(--subtle);margin-top:1px"></div>
                    </div>
                </div>
                <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
                    <span id="read-count" style="font-size:12px;color:var(--subtle);display:flex;align-items:center;gap:4px"></span>
                    <a href="/articles" style="font-size:13px;color:var(--text);display:flex;align-items:center;gap:5px;text-decoration:none;border:1px solid var(--line);padding:6px 14px;border-radius:var(--r-sm);transition:border-color 0.15s,color 0.15s" onmouseover="this.style.borderColor='var(--ink)';this.style.color='var(--ink)'" onmouseout="this.style.borderColor='var(--line)';this.style.color='var(--text)'">
                        <i class="ph ph-arrow-left"></i> 返回列表
                    </a>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div id="article-content" class="prose"></div>

        <!-- Footer actions -->
        <div style="margin-top:56px;padding-top:28px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <a href="/articles" style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--brand);font-weight:600;text-decoration:none">
                <i class="ph ph-arrow-left"></i> 返回文章列表
            </a>
            <button onclick="copyPageUrl()" style="display:flex;align-items:center;gap:6px;padding:9px 18px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;transition:border-color 0.15s,color 0.15s" onmouseover="this.style.borderColor='var(--ink)';this.style.color='var(--ink)'" onmouseout="this.style.borderColor='var(--line)';this.style.color='var(--text)'">
                <i class="ph ph-link"></i> 复制链接
            </button>
        </div>
    </article>

    <!-- Error state -->
    <div id="article-error" style="display:none;text-align:center;padding:80px 20px;color:var(--subtle)">
        <i class="ph ph-file-x" style="font-size:56px;display:block;margin-bottom:16px"></i>
        <p style="font-size:16px;font-weight:600;margin-bottom:8px;color:var(--ink)">文章不存在或已删除</p>
        <a href="/articles" style="font-size:14px;color:var(--brand)">← 返回文章列表</a>
    </div>
</main>

<div id="main-footer"></div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="js/safe-render.js?v=20260719-security"></script>
<script src="js/firebase-config.js?v=20260718-adminemail"></script>
<script src="js/data.js?v=20260719-contentproxy"></script>
<script src="js/auth.js?v=20260719-securityreset"></script>
<script src="js/analytics.js?v=20260707-analytics"></script>
<script>
const CAT_CONFIG = {
    learning: { label:'学习指南', color:'#1f2f4a', bg:'#e3e7ee' },
    tools:    { label:'工具推荐', color:'#1f3a3e', bg:'#dde6e8' },
    case:     { label:'教学案例', color:'#332945', bg:'#e6e2ec' },
    tips:     { label:'实战技巧', color:'#3d242a', bg:'#ede1e3' },
    news:     { label:'行业动态', color:'#2c2f3a', bg:'#e4e5ea' },
    other:    { label:'其他',     color:'#252830', bg:'#e0e1e5' }
};

const COVER_GRADIENTS = [
    'linear-gradient(135deg,#1f2f4a 0%,#101a2e 100%)',
    'linear-gradient(135deg,#1f3a3e 0%,#102225 100%)',
    'linear-gradient(135deg,#332945 0%,#1c1530 100%)',
    'linear-gradient(135deg,#2c2f3a 0%,#181a22 100%)',
    'linear-gradient(135deg,#3d242a 0%,#231016 100%)',
    'linear-gradient(135deg,#252830 0%,#14171d 100%)'
];

function copyPageUrl() {
    if (typeof requireLogin === 'function' && !requireLogin(null, '请先登录后复制链接')) return;
    navigator.clipboard.writeText(location.href).then(() => showToast('链接已复制'));
}

function updateArticleMetadata(article) {
    const title = String(article.title || '精选文章').trim();
    const summary = String(article.summary || '阅读教师 AI 教学领域的精选文章详情。').replace(/\s+/g, ' ').trim().slice(0, 160);
    const canonicalUrl = new URL('/article', 'https://xylaoshi.pages.dev');
    canonicalUrl.searchParams.set('id', articleId);
    document.title = title + ' · AI 教师培训中心';
    document.querySelector('meta[name="description"]')?.setAttribute('content', summary);
    document.querySelector('meta[property="og:title"]')?.setAttribute('content', title);
    document.querySelector('meta[property="og:description"]')?.setAttribute('content', summary);
    document.querySelector('meta[property="og:url"]')?.setAttribute('content', canonicalUrl.href);
    document.querySelector('link[rel="canonical"]')?.setAttribute('href', canonicalUrl.href);
    const jsonLd = {
        '@context': 'https://schema.org',
        '@type': 'Article',
        headline: title,
        description: summary,
        mainEntityOfPage: canonicalUrl.href,
        inLanguage: 'zh-CN',
        image: 'https://xylaoshi.pages.dev/assets/og/article.jpg',
        author: { '@type': 'Person', name: String(article.author || '编辑部') },
        publisher: { '@type': 'Organization', name: 'AI 教师培训中心', url: 'https://xylaoshi.pages.dev/' }
    };
    if (article.publishedAt) {
        const published = new Date(article.publishedAt);
        if (!Number.isNaN(published.getTime())) jsonLd.datePublished = published.toISOString();
    }
    const jsonLdNode = document.getElementById('article-jsonld');
    if (jsonLdNode) jsonLdNode.textContent = JSON.stringify(jsonLd).replace(/</g, '\\u003c');
}

// Get article ID from URL
const urlParams = new URLSearchParams(location.search);
const articleId = urlParams.get('id');

renderNav('articles');
renderFooter();

async function loadArticle() {
    if (!articleId) {
        document.getElementById('article-loading').style.display = 'none';
        document.getElementById('article-error').style.display = '';
        return;
    }

    const article = await DB.getArticle(articleId);

    document.getElementById('article-loading').style.display = 'none';

    if (!article || article.status !== 'published') {
        document.getElementById('article-error').style.display = '';
        return;
    }

    // Update page title, canonical URL, share metadata and structured data.
    updateArticleMetadata(article);
    document.getElementById('bc-title').textContent = article.title.length > 20 ? article.title.slice(0, 20) + '…' : article.title;

    // Cover
    // Force the cool-tone palette regardless of any legacy coverColor stored in Firestore.
    const gradient = COVER_GRADIENTS[Math.abs((articleId || '').charCodeAt(0)) % COVER_GRADIENTS.length];
    const emoji = article.coverEmoji || '📝';
    document.getElementById('article-cover').style.background = gradient;
    document.getElementById('article-cover').innerHTML = `<span style="position:relative;z-index:1">${SafeRender.escape(emoji)}</span>`;

    // Category tag
    const cat = CAT_CONFIG[article.category] || CAT_CONFIG.other;
    document.getElementById('article-cat').innerHTML = `<span style="display:inline-flex;align-items:center;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;background:${cat.bg};color:${cat.color}">${cat.label}</span>`;

    // Title & meta
    document.getElementById('article-title').textContent = article.title;
    const authorName = article.author || '编辑部';
    document.getElementById('author-avatar').textContent = authorName.charAt(0);
    document.getElementById('author-name').textContent = authorName;
    const date = (() => { try { return new Date(article.publishedAt).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}); } catch{return '';} })();
    document.getElementById('article-date').textContent = date;
    if (Number(article.readCount) > 0) {
        document.getElementById('read-count').innerHTML = `<i class="ph ph-eye"></i>${Number(article.readCount).toLocaleString('zh-CN')} 次阅读`;
    }

    // Content — render markdown
    if (article.content) {
        document.getElementById('article-content').innerHTML = SafeRender.markdown(article.content);
    } else if (article.type === 'external' && article.externalUrl) {
        const safeExternalUrl = SafeRender.safeUrl(article.externalUrl);
        if (!safeExternalUrl) {
            document.getElementById('article-content').textContent = '文章外部链接无效，请联系管理员更新。';
            document.getElementById('article-body').style.display = '';
            return;
        }
        document.getElementById('article-content').innerHTML = `
            <div style="text-align:center;padding:40px 20px;background:#f8fafc;border-radius:16px">
                <i class="ph ph-arrow-up-right" style="font-size:40px;color:#4F46E5;display:block;margin-bottom:12px"></i>
                <p style="font-size:15px;color:#374151;margin-bottom:20px">此文章来自外部链接，点击下方按钮跳转阅读原文</p>
                <a href="${SafeRender.escape(safeExternalUrl)}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:white;font-size:14px;font-weight:600;border-radius:12px;text-decoration:none">
                    阅读原文 <i class="ph ph-arrow-up-right"></i>
                </a>
            </div>`;
    }

    // Show article
    document.getElementById('article-body').style.display = '';
}

loadArticle();

onAuthReady((user) => {
    renderNav('articles');
    renderFooter();
});
</script>
<script src="js/pwa.js?v=20260715-pwa2"></script>
<script src="js/assistant.js?v=20260719-a11ysecurity"></script>
</body>
</html>
