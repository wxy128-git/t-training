<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习路径 · AI 教师培训中心</title>
    <meta name="description" content="面向中小学教师的三条 AI 学习路径：入门基础、教学应用、创作进阶。">
    <meta property="og:title" content="结构化的 AI 教学学习路径">
    <meta property="og:description" content="面向中小学教师的三条 AI 学习路径：入门基础、教学应用、创作进阶。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://xylaoshi.pages.dev/paths.html">
    <meta property="og:image" content="https://xylaoshi.pages.dev/assets/og/paths.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://xylaoshi.pages.dev/assets/og/paths.jpg">
    <link rel="canonical" href="https://xylaoshi.pages.dev/paths.html">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=20260616-tasksgroup">
    <style>
        .paths-page-title { font-family: var(--font-display); font-size: clamp(32px,4.6vw,52px); font-weight: 800; color: var(--ink); letter-spacing: -0.03em; line-height: 1.1; margin: 0; }
        .paths-page-sub { font-size: 14.5px; color: var(--muted); margin-top: 12px; line-height: 1.75; max-width: 580px; }
        .paths-page-kicker { font-family: var(--font-mono); font-size: 11.5px; color: var(--brand); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; font-weight: 500; }

        .step-detail { max-height: 0; overflow: hidden; transition: max-height 0.32s ease; }
        .step-detail.open { max-height: 1200px; }
        .step-row { cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); transition: padding 0.15s; }
        .step-row:last-child { border-bottom: none; }
        .step-row:hover { padding-left: 4px; }
        .step-row:hover .step-num { background: var(--brand); color: var(--soft); border-color: var(--brand); }
        .step-row:hover .step-name { color: var(--brand); }
        .step-num { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text); flex-shrink: 0; transition: all 0.18s; }
        .step-name { font-size: 14.5px; font-weight: 500; color: var(--ink); transition: color 0.15s; }
        .step-icon { color: var(--subtle); flex-shrink: 0; }
        .step-chevron { margin-left: auto; color: var(--subtle); transition: transform 0.22s; flex-shrink: 0; }
        .step-row.expanded { padding-left: 4px; }
        .step-row.expanded .step-chevron { transform: rotate(180deg); color: var(--brand); }
        .step-row.expanded .step-num { background: var(--brand); color: var(--soft); border-color: var(--brand); }
        .step-row.expanded .step-name { color: var(--ink); font-weight: 600; }
        .step-detail-inner { padding: 14px 16px 18px 70px; font-size: 13.5px; color: var(--text-soft); line-height: 1.85; background: var(--soft); border-radius: 0 0 12px 12px; }

        .resource-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; font-size: 12.5px; margin: 3px; color: white; }

        .path-nav-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 48px; }
        .path-nav-card {
            min-height: 130px;
            border-radius: var(--r-lg);
            padding: 24px;
            color: white;
            cursor: pointer;
            transition: transform 0.22s, box-shadow 0.22s;
            position: relative;
            overflow: hidden;
        }
        .path-nav-card::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 55% 50% at 92% 12%, rgba(255,255,255,0.14), transparent 70%),
                radial-gradient(ellipse 40% 50% at 5% 95%, rgba(255,255,255,0.06), transparent 70%);
        }
        .path-nav-card > * { position: relative; }
        .path-nav-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(26,22,18,0.18); }
        .path-nav-number { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 10px; letter-spacing: 0.1em; font-weight: 500; }
        .path-nav-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 26px; line-height: 1; color: white; }
        .path-nav-title { font-weight: 700; font-size: 19px; margin-bottom: 6px; letter-spacing: -0.015em; color: white; }
        .path-nav-duration { color: rgba(255,255,255,0.72); font-size: 12.5px; }
        .path-nav-level { margin-top: 14px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.18); padding: 3px 10px; border-radius: 999px; font-size: 11.5px; display: inline-block; color: white; }

        .path-detail { border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-md); border: 1px solid var(--line); }
        .path-detail-head { padding: 36px; color: white; position: relative; overflow: hidden; }
        .path-detail-head::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 55% 45% at 92% 12%, rgba(255,255,255,0.14), transparent 70%),
                radial-gradient(ellipse 40% 50% at 5% 95%, rgba(255,255,255,0.06), transparent 70%);
        }
        .path-detail-head > * { position: relative; }
        .path-detail-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; flex-shrink: 0; color: white; }
        .path-detail-title { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; letter-spacing: -0.022em; color: white; }
        .path-detail-sub { color: rgba(255,255,255,0.78); font-size: 13.5px; margin-top: 4px; }
        .path-detail-desc { color: rgba(255,255,255,0.9); font-size: 14.5px; line-height: 1.85; max-width: 620px; }
        .path-detail-pill { text-align: center; background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 18px 26px; flex-shrink: 0; }
        .path-detail-pill-label { font-size: 11.5px; color: rgba(255,255,255,0.7); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
        .path-detail-pill-value { font-size: 22px; font-weight: 800; color: white; letter-spacing: -0.015em; }
        .path-detail-pill-level { margin-top: 10px; background: rgba(255,255,255,0.18); color: white; padding: 3px 11px; border-radius: 999px; font-size: 12px; }
        .path-resources-label { font-size: 11.5px; color: rgba(255,255,255,0.72); margin-bottom: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
        .path-chapter-kicker { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.8); margin-bottom: 4px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }

        .path-detail-body { background: var(--paper); padding: 32px; border-top: 1px solid var(--line); }
        .path-steps-heading { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 18px; letter-spacing: -0.01em; }
        .path-steps-hint { font-size: 13px; font-weight: 400; color: var(--subtle); }
        .path-start-btn {
            margin-top: 24px; padding: 14px 26px;
            background: var(--ink); color: var(--soft);
            font-size: 14.5px; font-weight: 600;
            border: 1px solid var(--ink); border-radius: var(--r-sm);
            cursor: pointer;
            transition: background 0.18s, border-color 0.18s, transform 0.18s;
            width: 100%;
            letter-spacing: -0.005em;
        }
        .path-start-btn:hover { background: var(--brand); border-color: var(--brand); transform: translateY(-1px); }

        @media(max-width:760px) {
            .path-nav-grid { grid-template-columns: 1fr; }
            .path-nav-card { min-height: auto; }
            .path-detail-head { padding: 28px; }
            .path-detail-body { padding: 24px; }
        }
    </style>
</head>
<body>
<div id="main-nav"></div>

<main style="max-width:1100px;margin:0 auto;padding:56px 24px 88px">
    <div class="breadcrumb"><a href="index.html">首页</a><i class="ph ph-caret-right"></i><span>学习路径</span></div>

    <div style="margin-bottom:40px">
        <div class="paths-page-kicker">Learning Paths · 学习路径</div>
        <h1 class="paths-page-title">结构化<span style="font-style:italic;color:var(--brand)">学习</span>路径</h1>
        <p class="paths-page-sub">三条精心设计的进阶路径，从零基础到 AI 创作高手，点击每一步展开详细指引。</p>
    </div>

    <!-- Path comparison -->
    <div class="path-nav-grid" id="path-nav-cards">
        <!-- rendered by JS -->
    </div>

    <!-- Detailed paths -->
    <div id="paths-detail" style="display:flex;flex-direction:column;gap:40px"></div>
</main>

<div id="main-footer"></div>

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=20260615-authflash"></script>
<script src="js/data.js?v=20260615-rmshowcase"></script>
<script src="js/auth.js?v=20260616-navnames"></script>
<script>
function pathIcon(path) {
    return path.slug === 'starter' ? 'ph-rocket-launch' : path.icon;
}

function getPathUser() {
    try {
        return typeof Auth !== 'undefined' ? Auth.getCurrentUser() : null;
    } catch {
        return null;
    }
}

function isPathAuthReady() {
    try {
        return typeof _authReady !== 'undefined' && _authReady;
    } catch {
        return false;
    }
}

function promptPathLogin() {
    if (typeof showToast === 'function') showToast('请先登录后开始学习路径');
    if (typeof showAuthModal === 'function') setTimeout(() => showAuthModal('login'), 80);
}

function requirePathLogin(onReady) {
    if (getPathUser()) return true;
    if (typeof onAuthReady === 'function' && !isPathAuthReady()) {
        if (typeof showToast === 'function') showToast('正在确认登录状态...');
        onAuthReady(user => {
            if (user) onReady?.();
            else promptPathLogin();
        });
        return false;
    }
    promptPathLogin();
    return false;
}

function toggleStep(row) {
    if (!requirePathLogin(() => toggleStep(row))) return;
    const detail = row.nextElementSibling;
    const isOpen = detail.classList.contains('open');
    row.closest('section').querySelectorAll('.step-detail').forEach(d => d.classList.remove('open'));
    row.closest('section').querySelectorAll('.step-row').forEach(r => r.classList.remove('expanded'));
    if (!isOpen) { detail.classList.add('open'); row.classList.add('expanded'); }
}

function startPath(btn) {
    if (!requirePathLogin(() => startPath(btn))) return;
    const section = btn.closest('section');
    section.querySelectorAll('.step-detail').forEach(d => d.classList.add('open'));
    section.querySelectorAll('.step-row').forEach(r => r.classList.add('expanded'));
    btn.innerHTML = '<i class="ph ph-check-circle"></i> 已展开全部步骤，点击各步骤可折叠';
    btn.style.opacity = '0.85';
    btn.onclick = null;
    const firstStep = section.querySelector('.step-row');
    if (firstStep) setTimeout(() => firstStep.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
}

renderNav('paths');
renderFooter();
onAuthReady((user) => { renderNav('paths'); renderFooter(); });

(async () => {
    const paths = await DB.getPaths();

    // Force the editorial palette, ignoring any legacy gradient that
    // may still live in Firestore.
    const PATH_PALETTE = {
        starter: 'linear-gradient(135deg,#2d4a3a 0%,#1a3528 100%)',
        teacher: 'linear-gradient(135deg,#4a3625 0%,#2c1f15 100%)',
        creator: 'linear-gradient(135deg,#7a2e28 0%,#4d1812 100%)'
    };
    const PATH_FALLBACK = ['linear-gradient(135deg,#2d4a3a 0%,#1a3528 100%)','linear-gradient(135deg,#4a3625 0%,#2c1f15 100%)','linear-gradient(135deg,#7a2e28 0%,#4d1812 100%)'];
    const grad = (p, i) => PATH_PALETTE[p.slug] || PATH_FALLBACK[i % PATH_FALLBACK.length];

    // Nav cards
    document.getElementById('path-nav-cards').innerHTML = paths.map((p, i) => `
    <a href="#${p.slug}" style="text-decoration:none">
        <div class="path-nav-card" style="background:${grad(p, i)}">
            <div class="path-nav-number">No. ${String(i+1).padStart(2,'0')}</div>
            <i class="path-nav-icon ph-bold ${pathIcon(p)}" aria-hidden="true"></i>
            <div class="path-nav-title">${p.title}</div>
            <div class="path-nav-duration">${p.duration}</div>
            <div class="path-nav-level">${p.level}</div>
        </div>
    </a>`).join('');

    // Detailed sections
    document.getElementById('paths-detail').innerHTML = paths.map((p, i) => `
    <section id="${p.slug}" style="scroll-margin-top:80px">
        <div class="path-detail">
            <div class="path-detail-head" style="background:${grad(p, i)}">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px">
                    <div>
                        <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
                            <i class="path-detail-icon ph-bold ${pathIcon(p)}" aria-hidden="true"></i>
                            <div>
                                <div class="path-chapter-kicker">Chapter ${String(i+1).padStart(2,'0')}</div>
                                <h2 class="path-detail-title">${p.title}</h2>
                                <div class="path-detail-sub">${p.subtitle}</div>
                            </div>
                        </div>
                        <p class="path-detail-desc">${p.desc}</p>
                    </div>
                    <div class="path-detail-pill">
                        <div class="path-detail-pill-label">预计时长</div>
                        <div class="path-detail-pill-value">${p.duration}</div>
                        <div class="path-detail-pill-level">${p.level}水平</div>
                    </div>
                </div>
                <div style="margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.18)">
                    <div class="path-resources-label">推荐配合使用的工具</div>
                    <div>${p.resources.map(r => `<span class="resource-chip"><i class="ph ph-arrow-up-right"></i>${r}</span>`).join('')}</div>
                </div>
            </div>
            <div class="path-detail-body">
                <h3 class="path-steps-heading">学习步骤 <span class="path-steps-hint">（点击展开详情）</span></h3>
                <div>
                    ${p.steps.map((s, idx) => `
                    <div class="step-row" onclick="toggleStep(this)">
                        <div class="step-num">${idx+1}</div>
                        <i class="ph ${s.icon} step-icon"></i>
                        <span class="step-name">${s.name}</span>
                        <i class="ph ph-caret-down step-chevron"></i>
                    </div>
                    <div class="step-detail">
                        <div class="step-detail-inner">${s.detail}</div>
                    </div>`).join('')}
                </div>
                <button onclick="startPath(this)" class="path-start-btn" style="background:${grad(p, i)}">
                    展开全部步骤，开始学习 →
                </button>
            </div>
        </div>
    </section>`).join('');

    if (location.hash) {
        setTimeout(() => {
            const el = document.querySelector(location.hash);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }, 100);
    }
})();
</script>
<script src="js/assistant.js"></script>
</body>
</html>
